function toggleAdherenteDetalle(key) {
  if (adherenteExpandido.has(key)) adherenteExpandido.delete(key);
  else adherenteExpandido.add(key);
  renderResumen();
}

// Rubros que se consideran aportes de adherentes: [6] ADHERENTES | COLABORADORES y [5] PUBLICIDAD - Lonas y otros
const ADH_RUBROS = ["5", "6", "42"];

// anio: string "YYYY" para filtrar, o "" para todos los años
function calcAdherentesPorAnio(anio) {
  const movs6 = movimientos.filter(m =>
    ADH_RUBROS.includes(m.codRubro) && m.tipo === "INGRESO" && (!anio || m.fecha.slice(0,4) === anio)
  );
  const map = {};
  for (const a of adherentes) {
    map[a.nombre] = { adherente: a.nombre, cuotaMensual: a.cuotaMensual||0, cuotasAnuales: a.cuotasAnuales||0, totalAportado: 0, movs: [] };
  }
  for (const m of movs6) {
    // Aportes de combustible (rubro 42) sin adherente asignado se agrupan como "⛽ Combustible"
    const key = m.adherente || (m.codRubro === "42" ? "⛽ Combustible" : "Sin adherente");
    if (!map[key]) map[key] = { adherente: key, cuotaMensual: 0, cuotasAnuales: 0, totalAportado: 0, movs: [] };
    map[key].totalAportado += m.ingreso;
    map[key].movs.push(m);
  }
  return Object.values(map)
    .filter(r => r.totalAportado > 0 || (r.cuotaMensual > 0 && r.cuotasAnuales > 0))
    .map(r => {
      const compromisoAnual = r.cuotaMensual * r.cuotasAnuales;
      // pagosCount = cantidad real de movimientos (2 pagos en el mismo mes cuentan 2)
      const pagosCount = r.movs.length;
      // porMes: monto sumado por mes (celda de la planilla); el detalle por movimiento
      // sigue disponible en r.movs al expandir la fila
      const porMes = {};
      for (const m of r.movs) {
        const k = mesFromRecord(m);
        porMes[k] = (porMes[k] || 0) + m.ingreso;
      }
      let diferencia = null, estado = null;
      if (compromisoAnual > 0) {
        diferencia = r.totalAportado - compromisoAnual;
        estado = diferencia >= 0 ? "OK" : (r.totalAportado > 0 ? "PARCIAL" : "SIN");
      }
      return { ...r, compromisoAnual, pagosCount, porMes, diferencia, estado };
    });
}

// Independiente del filtro de año de la pantalla: cuánto aportó (o le falta aportar) cada
// adherente en el mes EN CURSO, para el KPI y el marcado en rojo de "pendiente este mes".
function calcPendientesMesActual() {
  const mesActual = nowMes();
  const aportadoPorNombre = {};
  for (const m of movimientos) {
    if (!ADH_RUBROS.includes(m.codRubro) || m.tipo !== "INGRESO") continue;
    if (mesFromRecord(m) !== mesActual) continue;
    const key = m.adherente || (m.codRubro === "42" ? "⛽ Combustible" : "Sin adherente");
    aportadoPorNombre[key] = (aportadoPorNombre[key] || 0) + m.ingreso;
  }
  let totalPendiente = 0;
  const pendientePorNombre = {};
  for (const a of adherentes) {
    const aportado = aportadoPorNombre[a.nombre] || 0;
    const cuota = a.cuotaMensual || 0;
    if (cuota > 0) {
      const pend = Math.max(cuota - aportado, 0);
      pendientePorNombre[a.nombre] = pend > TOL;
      totalPendiente += pend;
    } else {
      // Sin cuota mensual definida: no hay un monto concreto que reclamar, pero igual
      // sirve marcarlo si no aportó nada este mes.
      pendientePorNombre[a.nombre] = aportado <= TOL;
    }
  }
  return { mesActual, pendientePorNombre, totalPendiente };
}

// Igual criterio que calcPendientesMesActual() (cuota mensual pendiente si está definida,
// o "no aportó nada este mes" si no hay cuota configurada), pero para un mes arbitrario y
// con el universo de nombres ampliado: como muchos clubes no cargan una lista formal de
// "adherentes" (la entidad puede estar vacía), el nombre del adherente sale del propio
// movimiento (m.adherente) — sin esto, cualquier club sin entidades registradas vería
// siempre "sin adherentes" en Resumen > Mensual aunque tenga aportes reales cargados.
function calcPendientesEnMes(mes) {
  const aportadoPorNombre = {};
  const nombres = new Set(adherentes.map(a => a.nombre));
  for (const m of movimientos) {
    if (!ADH_RUBROS.includes(m.codRubro) || m.tipo !== "INGRESO") continue;
    const key = m.adherente || (m.codRubro === "42" ? "⛽ Combustible" : "Sin adherente");
    nombres.add(key);
    if (mesFromRecord(m) === mes) aportadoPorNombre[key] = (aportadoPorNombre[key] || 0) + m.ingreso;
  }
  const cuotaPorNombre = {};
  for (const a of adherentes) cuotaPorNombre[a.nombre] = a.cuotaMensual || 0;

  const pendientes = [];
  for (const nombre of nombres) {
    const aportado = aportadoPorNombre[nombre] || 0;
    const cuota = cuotaPorNombre[nombre] || 0;
    const estaPendiente = cuota > 0 ? (cuota - aportado) > TOL : aportado <= TOL;
    if (estaPendiente) pendientes.push(nombre);
  }
  pendientes.sort((a,b) => a.localeCompare(b));
  return { pendientes, totalCount: nombres.size, pagadosCount: nombres.size - pendientes.length };
}

let adhResumenSoloPendientesMes = false;
function toggleAdhResumenSoloPendientesMes() {
  adhResumenSoloPendientesMes = !adhResumenSoloPendientesMes;
  renderResumen();
}

function renderAdherentesResumen() {
  const movs6All = movimientos.filter(m => ADH_RUBROS.includes(m.codRubro) && m.tipo === "INGRESO");
  const anios = [...new Set(movs6All.map(m => m.fecha.slice(0,4)))].filter(Boolean).sort().reverse();
  if (adherenteAnio !== "" && !anios.includes(adherenteAnio) && anios.length) {
    adherenteAnio = anios[0];
  }

  const pendMes = calcPendientesMesActual();
  let rows = calcAdherentesPorAnio(adherenteAnio)
    .map(r => ({ ...r, pendienteEsteMes: !!pendMes.pendientePorNombre[r.adherente] }));
  if (adhResumenSoloPendientesMes) rows = rows.filter(r => r.pendienteEsteMes);

  // Meses a mostrar como columnas: unión de todos los adherentes del año seleccionado,
  // solo los que tengan al menos un pago (sin meses futuros vacíos)
  const movs6Anio = movs6All.filter(m => !adherenteAnio || m.fecha.slice(0,4) === adherenteAnio);
  const meses = [...new Set(movs6Anio.map(m => mesFromRecord(m)))].filter(Boolean).sort();

  const anioOptions = `<option value="" ${adherenteAnio===""?"selected":""}>Todos los años</option>` +
    anios.map(a => `<option value="${a}" ${adherenteAnio===a?"selected":""}>${a}</option>`).join("");

  const viewToggle = `
    <div class="reint-view-toggle">
      <button class="reint-view-btn ${adherenteVista==='tabla'?'active':''}" onclick="setAdherenteVista('tabla')">⊞ Tabla</button>
      <button class="reint-view-btn ${adherenteVista==='cards'?'active':''}" onclick="setAdherenteVista('cards')">▤ Cards</button>
    </div>`;

  let totAportado=0, totCompromiso=0, totDiferencia=0, hayCompromiso=false;
  for (const r of rows) {
    totAportado += r.totalAportado;
    if (r.compromisoAnual > 0) { hayCompromiso = true; totCompromiso += r.compromisoAnual; totDiferencia += r.diferencia; }
  }
  // Resta por cobrar contra el compromiso anual (totDiferencia con signo invertido, como absoluto)
  const restaPorCobrar = totCompromiso - totAportado;
  const statCards = `
    <div class="sum-grid three" style="margin-bottom:12px">
      <div class="stat-card">
        <div class="stat-label">Acumulado</div>
        <div class="stat-val ing">${fmt(totAportado)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pendiente cobrar ${esc(mesLabel(pendMes.mesActual))}</div>
        <div class="stat-val egr">${fmt(pendMes.totalPendiente)}</div>
      </div>
      ${hayCompromiso ? `
      <div class="stat-card">
        <div class="stat-label">Prometido</div>
        <div class="stat-val acc">${fmt(totCompromiso)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Resta por cobrar</div>
        <div class="stat-val ${restaPorCobrar>0?"egr":"ing"}">${fmt(Math.abs(restaPorCobrar))}</div>
        <div class="stat-sub">contra el compromiso anual</div>
      </div>` : ""}
    </div>`;
  const totalesLine = `${rows.length} adherente${rows.length!==1?"s":""} con aportes o compromiso registrado`;

  const body = !rows.length
    ? `<p class="note" style="text-align:center;padding:16px 0">${adhResumenSoloPendientesMes ? "Nadie pendiente este mes 🎉" : "Sin aportes de adherentes registrados"}</p>`
    : adherenteVista === "cards" ? renderAdherentesCards(rows) : renderAdherentesTabla(rows, meses);

  return `
    <div class="reint-section">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:150px">
          <label style="font-size:11px;color:var(--text3);white-space:nowrap">Año:</label>
          <select class="inp" style="flex:1" onchange="setAdherenteAnio(this.value)">${anioOptions}</select>
        </div>
        ${viewToggle}
      </div>
      <button class="pill sm ${adhResumenSoloPendientesMes?"active":""}" style="margin-bottom:10px" onclick="toggleAdhResumenSoloPendientesMes()">
        🔴 Solo pendientes de ${esc(mesLabel(pendMes.mesActual))}
      </button>
      ${statCards}
      <p class="note" style="margin-bottom:12px">${totalesLine}</p>
      ${body}
    </div>`;
}

function estadoAdherenteCorto(estado) {
  return estado==="OK"      ? "✅ Al día"
    : estado==="PARCIAL" ? "⚠️ Parcial"
    : estado==="SIN"     ? "🔴 Sin aportes"
    : "—";
}

// Encabezado corto de columna de mes: "Mar" (o "Mar '26" en vista Todos los años)
function mesCortoHeader(k) {
  const [y,m] = k.split("-");
  const lbl = MESES_LABELS[+m-1].slice(0,3);
  return adherenteAnio === "" ? `${lbl} '${y.slice(2)}` : lbl;
}

// Etiqueta de un movimiento de adherente: rubro 42 (movilidad) = "Aporte combustible"
function adhConcepto(m) {
  if (m.codRubro === "42") return "Aporte combustible";
  return esc(m.concepto) || "Adhesion";
}

function renderAdherentesTabla(rows, meses) {
  const isMobile = window.matchMedia("(max-width:599px)").matches;
  const rank = { SIN:0, PARCIAL:1, OK:3 };
  const sorted = [...rows].sort((a,b) => {
    const ra = a.estado===null ? 2 : rank[a.estado];
    const rb = b.estado===null ? 2 : rank[b.estado];
    if (ra !== rb) return ra - rb;
    return a.adherente.localeCompare(b.adherente);
  });

  // En mobile ocultamos las columnas de mes, cuota y prometido: Adherente | Acumulado | Resta
  const showMeses = !isMobile;
  const mesCols = showMeses ? (meses || []) : [];

  let totAportado=0, totCompromiso=0;
  let hayMultiPago = false;
  const totPorMes = {};
  const bodyRows = sorted.map(r => {
    const tieneCompromiso = r.compromisoAnual > 0;
    totAportado += r.totalAportado;
    if (tieneCompromiso) totCompromiso += r.compromisoAnual;
    const isExp = adherenteExpandido.has(r.adherente);
    const detalle = isExp ? renderAdherenteDetalle(r) : "";
    const rowClass = r.estado === "OK" ? "reint-row row-ok" : "reint-row";
    const resta = tieneCompromiso ? (r.compromisoAnual - r.totalAportado) : null;

    // cantidad de movimientos por mes de este adherente (para marcar celdas con >1 pago)
    const nMovPorMes = {};
    for (const m of r.movs) { const k = mesFromRecord(m); nMovPorMes[k] = (nMovPorMes[k]||0) + 1; }

    const mesCells = mesCols.map(mk => {
      const monto = r.porMes[mk];
      if (!monto) return `<td style="text-align:right;color:var(--text3)">—</td>`;
      totPorMes[mk] = (totPorMes[mk]||0) + monto;
      const multi = (nMovPorMes[mk]||0) > 1;
      if (multi) hayMultiPago = true;
      return `<td style="text-align:right;font-family:var(--mono)" class="ing"${multi?` title="${nMovPorMes[mk]} pagos"`:""}>${fmt(monto)}${multi?` <span style="color:var(--text3);font-weight:600">*</span>`:""}</td>`;
    }).join("");

    const cuotaCell = showMeses ? `<td style="text-align:right;font-family:var(--mono);color:var(--text2)">${r.cuotaMensual>0?fmt(r.cuotaMensual):"—"}</td>` : "";
    const prometidoCell = showMeses ? `<td style="text-align:right;font-family:var(--mono)">${tieneCompromiso?fmt(r.compromisoAnual):"—"}</td>` : "";
    const restaCell = resta!==null
      ? `<td style="text-align:right;font-family:var(--mono)" class="${resta>0?'egr':'ing'}">${fmt(Math.abs(resta))}</td>`
      : `<td style="text-align:right;color:var(--text3)">—</td>`;

    const colspan = 3 + mesCols.length + (showMeses ? 2 : 0);
    return `
    <tr class="${rowClass}" onclick="toggleAdherenteDetalle('${esc(escJs(r.adherente))}')">
      <td class="jugador-col" title="${esc(r.adherente)}" style="${r.pendienteEsteMes?'color:var(--red);font-weight:600':''}">${esc(r.adherente)}${r.pendienteEsteMes?' <span style="font-size:9px">●</span>':''}</td>
      ${cuotaCell}
      ${mesCells}
      ${prometidoCell}
      <td style="text-align:right;font-family:var(--mono)" class="ing">${fmt(r.totalAportado)}</td>
      ${restaCell}
    </tr>${isExp ? `
    <tr><td colspan="${colspan}" style="padding:0;border-bottom:none">${detalle}</td></tr>` : ""}`;
  }).join("");

  const totResta = totCompromiso - totAportado;
  const totMesCells = mesCols.map(mk => `<td style="text-align:right;font-family:var(--mono)">${totPorMes[mk]?fmt(totPorMes[mk]):"—"}</td>`).join("");
  const totRow = `<tr class="reint-tot-row">
    <td class="jugador-col">TOTALES</td>
    ${showMeses ? `<td></td>` : ""}
    ${totMesCells}
    ${showMeses ? `<td style="text-align:right;font-family:var(--mono)">${fmt(totCompromiso)}</td>` : ""}
    <td style="text-align:right;font-family:var(--mono)">${fmt(totAportado)}</td>
    <td style="text-align:right;font-family:var(--mono)" class="${totResta>0?'egr':'ing'}">${fmt(Math.abs(totResta))}</td>
  </tr>`;

  const cuotaHeader = showMeses ? `<th style="text-align:right">Cuota mensual</th>` : "";
  const prometidoHeader = showMeses ? `<th style="text-align:right">Prometido</th>` : "";
  const mesHeaders = mesCols.map(mk => `<th style="text-align:right">${mesCortoHeader(mk)}</th>`).join("");
  const footnote = isMobile
    ? `<p class="note" style="margin-top:6px;font-size:11px">* Vista reducida — cambiá a Cards para ver el detalle mes a mes</p>`
    : (hayMultiPago ? `<p class="note" style="margin-top:6px;font-size:11px">* Mes con más de un pago — tocá la fila para ver el detalle</p>` : "");

  return `
    <div class="reint-table-wrap">
      <table class="sum-table reint-table ${isMobile?'reint-table-mobile':''}">
        <thead><tr>
          <th class="jugador-col">Adherente</th>
          ${cuotaHeader}
          ${mesHeaders}
          ${prometidoHeader}
          <th style="text-align:right">Acumulado</th>
          <th style="text-align:right">Resta</th>
        </tr></thead>
        <tbody>${bodyRows}${totRow}</tbody>
      </table>
    </div>
    ${footnote}`;
}

      ${badge}

function renderAdherentesCards(rows) {
  const sinAportes    = rows.filter(r => r.estado === "SIN").sort((a,b) => Math.abs(b.diferencia||0) - Math.abs(a.diferencia||0));
  const parcial       = rows.filter(r => r.estado === "PARCIAL").sort((a,b) => Math.abs(b.diferencia||0) - Math.abs(a.diferencia||0));
  const sinCompromiso = rows.filter(r => r.estado === null).sort((a,b) => a.adherente.localeCompare(b.adherente));
  const alDia         = rows.filter(r => r.estado === "OK");

  const cardsHtml = [...sinAportes, ...parcial, ...sinCompromiso].map(renderAdherenteCard).join("");

  const alDiaKey  = "__aldia_adh__";
  const alDiaOpen = adherenteExpandido.has(alDiaKey);
  const alDiaHtml = alDia.length ? `
    <button class="reint-aldia-toggle" onclick="toggleAdherenteDetalle('${alDiaKey}')">
      Ver adherentes al día (${alDia.length}) ${alDiaOpen ? "▲" : "▼"}
    </button>
    ${alDiaOpen ? alDia.map(renderAdherenteCard).join("") : ""}` : "";

  return `${cardsHtml}${alDiaHtml}`;
}

// Detalle expandible: pagos agrupados por mes, marcando huecos sin pago
// (solo entre el primer y el último mes con pago, sin proyectar meses futuros)
// ── Tabla de detalle de movimientos reutilizable (Jugadores / Adherentes / Eventos) ──
// Cada item: { fechaRaw, fechaD, mesRaw, mesTxt, concepto, monto (número o null), rubro, categoria, entidad, extra, gap (bool) }
const DT_COLS = [
  { key:"fecha",     label:"Fecha",       sortable:true },
  { key:"mes",       label:"Mes",         sortable:true },
  { key:"concepto",  label:"Movimiento",  sortable:true, cls:"jd-concepto" },
  { key:"monto",     label:"Monto",       sortable:true },
  { key:"rubro",     label:"Rubro",       sortable:true },
  { key:"categoria", label:"Categoría",   sortable:true },
  { key:"entidad",   label:"Entidad",     sortable:true },
  { key:"extra",     label:"Detalle",     sortable:false, cls:"jd-extra" },
];
let detTablaState  = {};
let detTablaCache  = {};
let detTablaCols   = {};
let detTablaColWidths = {}; // key -> { colKey: anchoPx }, solo una vez que el usuario arrastra un resizer
let detTablaHidden  = {};   // key -> Set(colKey) de columnas ocultadas manualmente por el usuario

// Arrastre manual del ancho de columna (mousedown en el "handle" a la derecha del <th>).
// Al primer arrastre de una tabla se "congelan" los anchos actuales de sus columnas visibles
// (medidos en pantalla, indexados por colKey para no romperse si se ocultan/muestran columnas)
// y se pasa la tabla a table-layout:fixed para que respeten ese ancho.
function dtColResizeStart(ev, key, colKey) {
  ev.preventDefault();
  ev.stopPropagation();
  const th = ev.target.parentElement;
  const table = th.closest("table");
  if (!detTablaColWidths[key]) {
    const allTh = [...table.querySelectorAll("thead th")];
    const widths = {};
    allTh.forEach(t => { widths[t.dataset.col] = Math.round(t.getBoundingClientRect().width); });
    detTablaColWidths[key] = widths;
    table.classList.add("dt-fixed");
    allTh.forEach(t => { t.style.width = widths[t.dataset.col] + "px"; });
  }
  const startX = ev.clientX;
  const startWidth = detTablaColWidths[key][colKey];
  const resizer = ev.target;
  resizer.classList.add("dt-resizing");
  function onMove(e) {
    const newWidth = Math.max(40, startWidth + (e.clientX - startX));
    detTablaColWidths[key][colKey] = newWidth;
    th.style.width = newWidth + "px";
  }
  function onUp() {
    document.removeEventListener("mousemove", onMove);
    document.removeEventListener("mouseup", onUp);
    resizer.classList.remove("dt-resizing");
  }
  document.addEventListener("mousemove", onMove);
  document.addEventListener("mouseup", onUp);
}

function detTablaGetState(key) {
  if (!detTablaState[key]) detTablaState[key] = { sortCol:null, sortDir:1, filtro:"" };
  return detTablaState[key];
}

function detTablaGetHidden(key) {
  if (!detTablaHidden[key]) detTablaHidden[key] = new Set();
  return detTablaHidden[key];
}

// Muestra/oculta una columna (excepto las "pinned", ej. la de acciones). Se usa para
// que en pantallas angostas o con muchas columnas no haga falta scrollear horizontalmente.
function dtColToggleVisible(key, colKey) {
  const hidden = detTablaGetHidden(key);
  if (hidden.has(colKey)) hidden.delete(colKey); else hidden.add(colKey);
  const bar = document.getElementById(`dt-colbar-${key}`);
  if (bar) bar.innerHTML = dtColBarInner(key);
  const el = document.getElementById(`dt-inner-${key}`);
  if (el) el.innerHTML = detTablaRenderInner(key);
}

function dtColBarInner(key) {
  const cols = detTablaCols[key] || DT_COLS;
  const hideable = cols.filter(c => !c.pinned);
  if (hideable.length < 2) return "";
  const hidden = detTablaGetHidden(key);
  return hideable.map(c => {
    const isHidden = hidden.has(c.key);
    return `<button class="pill sm${isHidden?"":" active"}" onclick="dtColToggleVisible('${key}','${c.key}')">${isHidden?"☐":"☑"} ${esc(c.label)}</button>`;
  }).join("");
}

function detTablaSetFiltro(key, val) {
  detTablaGetState(key).filtro = val;
  const el = document.getElementById(`dt-inner-${key}`);
  if (el) el.innerHTML = detTablaRenderInner(key);
}

function detTablaSort(key, col) {
  const st = detTablaGetState(key);
  if (st.sortCol === col) st.sortDir *= -1;
  else { st.sortCol = col; st.sortDir = 1; }
  const el = document.getElementById(`dt-inner-${key}`);
  if (el) el.innerHTML = detTablaRenderInner(key);
}

// col.key "fecha"/"mes" leen fechaD/mesTxt del item para mostrar, pero fechaRaw/mesRaw para ordenar
function dtFieldFor(col) {
  return col.key === "fecha" ? "fechaD" : col.key === "mes" ? "mesTxt" : col.key;
}

function detTablaRenderInner(key) {
  const st = detTablaGetState(key);
  const items = detTablaCache[key] || [];
  const allCols = detTablaCols[key] || DT_COLS;
  const hidden = detTablaGetHidden(key);
  const cols = allCols.filter(c => c.pinned || !hidden.has(c.key));
  const widths = detTablaColWidths[key];
  const tableCls = "jug-detalle-table" + (widths ? " dt-fixed" : "");
  const q = normStr(st.filtro);
  let filtrados = !q ? items : items.filter(it =>
    normStr(cols.filter(c => c.key !== "monto" && !c.render).map(c => it[dtFieldFor(c)]).join(" ")).includes(q)
  );
  if (st.sortCol) {
    const dir = st.sortDir;
    filtrados = [...filtrados].sort((a,b) => {
      let av, bv;
      if (st.sortCol === "fecha") { av = a.fechaRaw||""; bv = b.fechaRaw||""; }
      else if (st.sortCol === "mes") { av = a.mesRaw||""; bv = b.mesRaw||""; }
      else if (st.sortCol === "monto") { av = a.monto||0; bv = b.monto||0; return (av-bv)*dir; }
      else { av = normStr(a[st.sortCol]); bv = normStr(b[st.sortCol]); }
      return (av < bv ? -1 : av > bv ? 1 : 0) * dir;
    });
  }
  const thead = cols.map(c => {
    // Fallback de 120px si la tabla ya está en modo ancho-fijo pero esta columna
    // se acaba de volver a mostrar y todavía no tiene un ancho guardado propio.
    const wStyle = widths ? ` style="width:${widths[c.key]||120}px"` : "";
    const resizer = `<span class="dt-resizer" onmousedown="dtColResizeStart(event,'${key}','${c.key}')" onclick="event.stopPropagation()"></span>`;
    if (!c.sortable) return `<th data-col="${c.key}"${wStyle}>${c.label}${resizer}</th>`;
    const active = st.sortCol === c.key;
    const arrow = active ? `<span class="dt-arrow">${st.sortDir===1?"▲":"▼"}</span>` : "";
    return `<th class="dt-sortable" data-col="${c.key}"${wStyle} onclick="detTablaSort('${key}','${c.key}')">${c.label}${arrow}${resizer}</th>`;
  }).join("");
  if (!filtrados.length) {
    return `<table class="${tableCls}"><thead><tr>${thead}</tr></thead></table><p class="dt-empty">Sin resultados${st.filtro?" para ese filtro":""}</p>`;
  }
  const rows = filtrados.map(it => {
    const tds = cols.map(c => {
      const cls = c.cls ? ` class="${c.cls}"` : "";
      if (c.render) return `<td${cls}>${c.render(it)}</td>`;
      if (c.key === "monto") {
        return it.monto === null
          ? `<td>—</td>`
          : `<td class="${it.monto<0?'egr':'ing'}">${it.monto<0?"-":"+"}${fmt(Math.abs(it.monto))}</td>`;
      }
      return `<td${cls}>${esc(it[dtFieldFor(c)])||"—"}</td>`;
    }).join("");
    return `<tr${it.gap ? ' class="dt-row-gap"' : ""}>${tds}</tr>`;
  }).join("");
  return `<table class="${tableCls}"><thead><tr>${thead}</tr></thead><tbody>${rows}</tbody></table>`;
}

function renderDetTabla(tableKey, items, cols) {
  detTablaCache[tableKey] = items;
  detTablaCols[tableKey] = cols || DT_COLS;
  const st = detTablaGetState(tableKey);
  const colBar = dtColBarInner(tableKey);
  return `
    <div class="jug-detalle-wrap">
      <div class="dt-filterbar">
        <input class="inp" type="search" placeholder="Filtrar…" value="${esc(st.filtro)}" oninput="detTablaSetFiltro('${tableKey}', this.value)">
      </div>
      ${colBar ? `<div class="dt-colbar" id="dt-colbar-${tableKey}">${colBar}</div>` : ""}
      <div id="dt-inner-${tableKey}">${detTablaRenderInner(tableKey)}</div>
    </div>`;
}

function renderAdherenteDetalle(r) {
  if (!r.movs.length) {
    return `<div style="background:var(--bg3);padding:6px 10px;border-radius:var(--rs);margin:4px 0 10px">
      <p class="note" style="padding:6px 0">Sin pagos registrados</p>
    </div>`;
  }
  const porMes = {};
  for (const m of r.movs) {
    const k = mesFromRecord(m);
    if (!porMes[k]) porMes[k] = [];
    porMes[k].push(m);
  }
  const mesesConPago = Object.keys(porMes).sort();
  const primerMes = mesesConPago[0];
  const ultimoMes = mesesConPago[mesesConPago.length-1];
  const mostrarHuecos = r.compromisoAnual > 0;

  const items = [];
  let k = primerMes;
  while (mesToNum(k) <= mesToNum(ultimoMes)) {
    const movsMes = porMes[k];
    if (movsMes && movsMes.length) {
      const sorted = [...movsMes].sort((a,b) => a.fecha.localeCompare(b.fecha));
      for (const m of sorted) {
        const fechaD = m.fecha ? m.fecha.slice(8)+"/"+m.fecha.slice(5,7)+"/"+m.fecha.slice(0,4) : "";
        const concepto = m.codRubro === "42" ? "Aporte combustible" : (m.concepto || "Adhesion");
        items.push({
          fechaRaw: m.fecha||"", fechaD, mesRaw: k, mesTxt: mesLabel(k),
          concepto, monto: m.ingreso, rubro: m.rubro||"", categoria: m.categoria||"",
          entidad: m.cuenta||"", extra: "",
        });
      }
    } else if (mostrarHuecos) {
      items.push({
        fechaRaw: "", fechaD: "—", mesRaw: k, mesTxt: mesLabel(k),
        concepto: "Sin pago", monto: null, rubro: "", categoria: "", entidad: "", extra: "", gap: true,
      });
    }
    k = nextMes(k);
  }
  return renderDetTabla(`adh_${escJs(r.adherente)}`, items);
}

// ── Jugadores — gastos/recuperos netos por jugador o grupo ──────
function setJugadorResAnio(v) {
  jugadorResAnio = v;
  jugadorResMes = "";
  jugadorResExpandido.clear();
  renderResumen();
}

function setJugadorResMes(v) {
  jugadorResMes = v;
  jugadorResExpandido.clear();
  renderResumen();
}

function setJugadorResVista(v) {
  jugadorResVista = v;
  localStorage.setItem("jugadores_vista", v);
  renderResumen();
}

function setJugadorResAgrupacion(v) {
  jugadorResAgrupacion = v;
  jugadorResExpandido.clear();
  localStorage.setItem("jugadores_agrupacion", v);
  renderResumen();
}

function toggleJugadorResDetalle(key) {
  if (jugadorResExpandido.has(key)) jugadorResExpandido.delete(key);
  else jugadorResExpandido.add(key);
  renderResumen();
}

// Devuelve la categoría de un codRubro para la sección Jugadores, o null si se excluye
// (rubro 6 = Adherentes, rubro 49 = Internos)
function jugadorResCategoria(codRubro) {
  if (codRubro === "18" || codRubro === "19") return "sueldos";
  if (codRubro === "15" || codRubro === "16" || codRubro === "22" || codRubro === "40" || codRubro === "41") return "movilidad";
  if (codRubro === "43") return "viandas";
  if (codRubro === "44") return "almacen";
  if (codRubro === "45" || codRubro === "51" || codRubro === "52") return "alquilerCasa";
  if (codRubro === "21") return "medico";
  if (codRubro === "6" || codRubro === "49") return null;
  return "otros";
}

function jugadorResMiembrosNombres(grupo) {
  return (grupo.miembros || []).map(id => jugadores.find(j => j.id === id)?.nombre).filter(Boolean);
}

// anio: string "YYYY" para filtrar, o "" para todos los años
// mes: string "MM" para filtrar dentro del año seleccionado, o "" para todo el año
// agrupacion: "jugador" (prorratea grupos entre miembros) o "grupo" (solo grupos, monto completo)
function calcJugadoresResumen(anio, mes, agrupacion) {
  const movs = movimientos.filter(m => {
    if (!m.jugadorCT) return false;
    if (anio && m.fecha.slice(0,4) !== anio) return false;
    if (anio && mes && m.fecha.slice(5,7) !== mes) return false;
    return jugadorResCategoria(m.codRubro) !== null;
  });

  const map = {};
  function ensure(key, esGrupo) {
    if (!map[key]) map[key] = { nombre:key, esGrupo, sueldos:0, movilidad:0, viandas:0, almacen:0, alquilerCasa:0, medico:0, otros:0, movimientos:[] };
    return map[key];
  }

  if (agrupacion === "grupo") {
    for (const m of movs) {
      const grupo = grupos.find(g => g.nombre === m.jugadorCT);
      if (!grupo) continue;
      const cat  = jugadorResCategoria(m.codRubro);
      const neto = m.ingreso - m.egreso;
      const row  = ensure(grupo.nombre, true);
      row[cat] += neto;
      row.movimientos.push({ ...m, montoAplicado: neto, prorrateado: false });
    }
    for (const key in map) {
      const grupo = grupos.find(g => g.nombre === key);
      map[key].miembros = grupo ? jugadorResMiembrosNombres(grupo) : [];
    }
  } else {
    const directos = movs.filter(m => !grupos.some(g => g.nombre === m.jugadorCT));
    const grupales = movs.filter(m => grupos.some(g => g.nombre === m.jugadorCT));

    for (const m of directos) {
      const cat  = jugadorResCategoria(m.codRubro);
      const neto = m.ingreso - m.egreso;
      const row  = ensure(m.jugadorCT, false);
      row[cat] += neto;
      row.movimientos.push({ ...m, montoAplicado: neto, prorrateado: false });
    }

    for (const m of grupales) {
      const grupo = grupos.find(g => g.nombre === m.jugadorCT);
      const cat   = jugadorResCategoria(m.codRubro);
      const neto  = m.ingreso - m.egreso;
      const nombresMiembros = jugadorResMiembrosNombres(grupo);

      if (!nombresMiembros.length) {
        const row = ensure(grupo.nombre, true);
        row[cat] += neto;
        row.movimientos.push({ ...m, montoAplicado: neto, prorrateado: false, grupoOriginal: grupo.nombre, montoOriginal: neto });
        continue;
      }

      const n = nombresMiembros.length;
      let acumulado = 0;
      nombresMiembros.forEach((nombre, idx) => {
        const esUltimo = idx === n - 1;
        const monto = esUltimo ? (neto - acumulado) : Math.round(neto / n);
        acumulado += monto;
        const row = ensure(nombre, false);
        row[cat] += monto;
        row.movimientos.push({ ...m, montoAplicado: monto, prorrateado: true, grupoOriginal: grupo.nombre, montoOriginal: neto, miembrosCount: n });
      });
    }
  }

  return Object.values(map).map(r => ({ ...r, total: r.sueldos + r.movilidad + r.viandas + r.almacen + r.alquilerCasa + r.medico + r.otros }));
}

function renderJugadoresResumen() {
  const movsAll = movimientos.filter(m => m.jugadorCT && jugadorResCategoria(m.codRubro) !== null);
  const anios = [...new Set(movsAll.map(m => m.fecha.slice(0,4)))].filter(Boolean).sort().reverse();
  if (jugadorResAnio !== "" && !anios.includes(jugadorResAnio) && anios.length) {
    jugadorResAnio = anios[0];
  }

  // El filtro por mes solo aplica cuando hay un año específico seleccionado
  const mesesDisponibles = jugadorResAnio
    ? [...new Set(movsAll.filter(m => m.fecha.slice(0,4) === jugadorResAnio).map(m => m.fecha.slice(5,7)))].sort()
    : [];
  if (jugadorResMes && !mesesDisponibles.includes(jugadorResMes)) jugadorResMes = "";

  const rows = calcJugadoresResumen(jugadorResAnio, jugadorResMes, jugadorResAgrupacion)
    .sort((a,b) => Math.abs(b.total) - Math.abs(a.total));

  const anioOptions = `<option value="" ${jugadorResAnio===""?"selected":""}>Todos los años</option>` +
    anios.map(a => `<option value="${a}" ${jugadorResAnio===a?"selected":""}>${a}</option>`).join("");

  const mesSelector = jugadorResAnio ? `
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:150px">
          <label style="font-size:11px;color:var(--text3);white-space:nowrap">Mes:</label>
          <select class="inp" style="flex:1" onchange="setJugadorResMes(this.value)">
            <option value="" ${jugadorResMes===""?"selected":""}>Todo el año</option>
            ${mesesDisponibles.map(mm => `<option value="${mm}" ${jugadorResMes===mm?"selected":""}>${MESES_LABELS[Number(mm)-1]}</option>`).join("")}
          </select>
        </div>` : "";

  const viewToggle = `
    <div class="reint-view-toggle">
      <button class="reint-view-btn ${jugadorResVista==='tabla'?'active':''}" onclick="setJugadorResVista('tabla')">⊞ Tabla</button>
      <button class="reint-view-btn ${jugadorResVista==='cards'?'active':''}" onclick="setJugadorResVista('cards')">▤ Cards</button>
    </div>`;

  const agrupacionToggle = `
    <div class="reint-view-toggle">
      <button class="reint-view-btn ${jugadorResAgrupacion==='jugador'?'active':''}" onclick="setJugadorResAgrupacion('jugador')">👤 Por Jugador</button>
      <button class="reint-view-btn ${jugadorResAgrupacion==='grupo'?'active':''}" onclick="setJugadorResAgrupacion('grupo')">👥 Por Grupo</button>
    </div>`;

  const totalGastado = rows.reduce((s,r) => s + (r.total < 0 ? -r.total : 0), 0);
  const periodoTxt = jugadorResMes ? ` (${MESES_LABELS[Number(jugadorResMes)-1]})` : "";
  const totalesLine = `${rows.length} ${jugadorResAgrupacion==='grupo'?'grupo':'jugador'}${rows.length!==1?"s":""}${periodoTxt} · Total gastado: ${fmt(totalGastado)}`;

  const body = !rows.length
    ? `<p class="note" style="text-align:center;padding:16px 0">Sin movimientos con jugador/grupo asignado</p>`
    : jugadorResVista === "cards" ? renderJugadoresResCards(rows) : renderJugadoresResTabla(rows);

  return `
    <div class="reint-section">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:150px">
          <label style="font-size:11px;color:var(--text3);white-space:nowrap">Año:</label>
          <select class="inp" style="flex:1" onchange="setJugadorResAnio(this.value)">${anioOptions}</select>
        </div>
        ${mesSelector}
        ${viewToggle}
      </div>
      <div style="margin-bottom:8px">${agrupacionToggle}</div>
      <p class="note" style="margin-bottom:12px">${totalesLine}</p>
      ${body}
    </div>`;
}

function renderJugadoresResTabla(rows) {
  const isMobile = window.matchMedia("(max-width:599px)").matches;

  let totSueldos=0, totMovilidad=0, totViandas=0, totAlmacen=0, totAlquilerCasa=0, totMedico=0, totOtros=0, totTotal=0;
  function cell(v) {
    if (!v) return `<td style="text-align:right;color:var(--text3)">—</td>`;
    return `<td style="text-align:right;font-family:var(--mono)" class="${v<0?'egr':'ing'}">${v<0?"-":"+"}${fmt(Math.abs(v))}</td>`;
  }

  const bodyRows = rows.map(r => {
    totSueldos      += r.sueldos;
    totMovilidad    += r.movilidad;
    totViandas      += r.viandas;
    totAlmacen      += r.almacen;
    totAlquilerCasa += r.alquilerCasa;
    totMedico       += r.medico;
    totOtros        += r.otros;
    totTotal        += r.total;
    const isExp = jugadorResExpandido.has(r.nombre);
    const detalle = isExp ? renderJugadorResDetalle(r) : "";
    const rowClass = r.esGrupo ? "reint-row" : "reint-row";
    const otrosCell = isMobile ? "" : cell(r.otros);
    const nombreLbl = (r.esGrupo ? "👥 " : "") + esc(r.nombre);
    const colspan = isMobile ? 6 : 9;
    return `
    <tr class="${rowClass}" style="${r.esGrupo?'background:var(--bg3)':''}" onclick="toggleJugadorResDetalle('${esc(escJs(r.nombre))}')">
      <td class="jugador-col" title="${esc(r.nombre)}">${nombreLbl}</td>
      ${cell(r.sueldos)}
      ${cell(r.movilidad)}
      ${cell(r.viandas)}
      ${cell(r.almacen)}
      ${cell(r.alquilerCasa)}
      ${cell(r.medico)}
      ${otrosCell}
      <td style="text-align:right;font-family:var(--mono);font-weight:600" class="${r.total<0?'egr':'ing'}">${r.total<0?"-":"+"}${fmt(Math.abs(r.total))}</td>
    </tr>${isExp ? `
    <tr><td colspan="${colspan}" style="padding:0;border-bottom:none">${detalle}</td></tr>` : ""}`;
  }).join("");

  const totRow = `<tr class="reint-tot-row">
    <td class="jugador-col">TOTALES</td>
    ${cell(totSueldos)}
    ${cell(totMovilidad)}
    ${cell(totViandas)}
    ${cell(totAlmacen)}
    ${cell(totAlquilerCasa)}
    ${cell(totMedico)}
    ${isMobile ? "" : cell(totOtros)}
    <td style="text-align:right;font-family:var(--mono);font-weight:600" class="${totTotal<0?'egr':'ing'}">${totTotal<0?"-":"+"}${fmt(Math.abs(totTotal))}</td>
  </tr>`;

  const otrosHeader = isMobile ? "" : `<th style="text-align:right">Otros</th>`;
  const footnote = isMobile ? `<p class="note" style="margin-top:6px;font-size:11px">* Vista reducida — cambiá a Cards para ver la columna Otros</p>` : "";

  return `
    <div class="reint-table-wrap">
      <table class="sum-table reint-table ${isMobile?'reint-table-mobile':''}" style="${isMobile?'font-size:11px':''}">
        <thead><tr>
          <th class="jugador-col">Jugador/Grupo</th>
          <th style="text-align:right">Sueldo</th>
          <th style="text-align:right">Movilidad</th>
          <th style="text-align:right">Viandas</th>
          <th style="text-align:right">Almacén</th>
          <th style="text-align:right">Alquiler y gastos casa</th>
          <th style="text-align:right">Médico</th>
          ${otrosHeader}
          <th style="text-align:right">TOTAL</th>
        </tr></thead>
        <tbody>${bodyRows}${totRow}</tbody>
      </table>
    </div>
    ${footnote}`;
}

function renderJugadorResCard(r) {
  const isExp = jugadorResExpandido.has(r.nombre);
  const cols = [
    ["SUELDO", r.sueldos], ["MOVILIDAD", r.movilidad], ["VIANDAS", r.viandas],
    ["ALMACÉN", r.almacen], ["ALQUILER Y GASTOS CASA", r.alquilerCasa],
    ["MÉDICO", r.medico], ["OTROS", r.otros]
  ].filter(([,v]) => v !== 0);

  const miembrosSub = r.esGrupo && r.miembros && r.miembros.length
    ? `<div class="entity-sub" style="white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${r.miembros.length} miembros: ${esc(r.miembros.join(", "))}</div>`
    : "";

  const colsHtml = cols.map(([label, v]) => `
    <div class="reint-card-col">
      <label>${label}</label>
      <div class="val ${v<0?'egr':'ing'}">${v<0?"-":"+"}${fmt(Math.abs(v))}</div>
    </div>`).join("");

  return `
  <div class="reint-card" onclick="toggleJugadorResDetalle('${esc(escJs(r.nombre))}')">
    <div class="reint-card-hdr">

      <span class="val ${r.total<0?'egr':'ing'}" style="font-family:var(--mono);font-weight:600">${r.total<0?"-":"+"}${fmt(Math.abs(r.total))}</span>

    ${miembrosSub}
    <div class="reint-card-body">${colsHtml}</div>
    ${isExp ? `<div class="reint-card-detalle" onclick="event.stopPropagation()">${renderJugadorResDetalle(r)}</div>` : ""}
  </div>`;
}

function renderJugadoresResCards(rows) {
  return rows.map(renderJugadorResCard).join("");
}

const JUGADOR_RES_CAT_LABEL = { sueldos:"Sueldo", movilidad:"Movilidad", viandas:"Viandas", almacen:"Almacén", alquilerCasa:"Alquiler y gastos casa", medico:"Médico", otros:"Otros" };

function renderJugadorResDetalle(r) {
  const sorted = [...r.movimientos].sort((a,b) => a.fecha.localeCompare(b.fecha));
  const items = sorted.map(m => {
    const fechaD = m.fecha ? m.fecha.slice(8)+"/"+m.fecha.slice(5,7)+"/"+m.fecha.slice(0,4) : "";
    const mesRaw = mesFromRecord(m);
    const cat = JUGADOR_RES_CAT_LABEL[jugadorResCategoria(m.codRubro)] || "Otros";
    const extra = m.prorrateado
      ? `👥 ${m.grupoOriginal} · orig. ${fmt(Math.abs(m.montoOriginal))} ÷ ${m.miembrosCount}`
      : "";
    return {
      fechaRaw: m.fecha||"", fechaD, mesRaw, mesTxt: mesLabel(mesRaw),
      concepto: m.concepto||"", monto: m.montoAplicado, rubro: m.rubro||"", categoria: cat,
      entidad: m.cuenta||"", extra,
    };
  });
  return renderDetTabla(`jug_${escJs(r.nombre)}`, items);
}

// ── Eventos — resumen de Peñas por evento ───────────────────────
function setEventoResAnio(v) {
  eventoResAnio = v;
  eventoResMes = "";
  eventoResExpandido.clear();
  renderResumen();
}

function setEventoResMes(v) {
  eventoResMes = v;
  eventoResExpandido.clear();
  renderResumen();
}

function setEventoResVista(v) {
  eventoResVista = v;
  localStorage.setItem("eventos_vista", v);
  renderResumen();
}

function toggleEventoResDetalle(key) {
  if (eventoResExpandido.has(key)) eventoResExpandido.delete(key);
  else eventoResExpandido.add(key);
  renderResumen();
}

// Devuelve la categoría de un codRubro para la sección Eventos, o null si no aplica (no es rubro de Peña)
function eventoResCategoria(codRubro) {
  if (codRubro === "54") return "buffet";
  if (codRubro === "55") return "gastosBuffet";
  if (codRubro === "56") return "tarjetas";
  if (codRubro === "57") return "gastosComida";
  if (codRubro === "58") return "show";
  if (codRubro === "59") return "colaboraciones";
  if (codRubro === "60") return "retiros";
  if (codRubro === "61") return "otrosGastos";
  if (codRubro === "62") return "otrosIngresos";
  return null;
}

// anio: string "YYYY" para filtrar, o "" para todos los años
// mes: string "MM" para filtrar dentro del año seleccionado, o "" para todo el año
function calcEventosResumen(anio, mes) {
  const movs = movimientos.filter(m => {
    if (!m.eventoId) return false;
    if (anio && m.fecha.slice(0,4) !== anio) return false;
    if (anio && mes && m.fecha.slice(5,7) !== mes) return false;
    return eventoResCategoria(m.codRubro) !== null;
  });

  const map = {};
  function ensure(eventoId) {
    if (!map[eventoId]) {
      const ev = eventos.find(x => x.id === eventoId);
      map[eventoId] = {
        eventoId, nombre: ev ? ev.nombre : "(evento eliminado)", fecha: ev ? ev.fecha : "",
        buffet:0, gastosBuffet:0, tarjetas:0, gastosComida:0, show:0, colaboraciones:0,
        retiros:0, otrosGastos:0, otrosIngresos:0, movimientos:[]
      };
    }
    return map[eventoId];
  }

  for (const m of movs) {
    const cat  = eventoResCategoria(m.codRubro);
    const neto = m.ingreso - m.egreso;
    const row  = ensure(m.eventoId);
    row[cat] += neto;
    row.movimientos.push({ ...m, montoAplicado: neto });
  }

  return Object.values(map).map(r => {
    const totalNetoBuffet = r.buffet + r.gastosBuffet;
    const totalNetoComida = r.tarjetas + r.gastosComida;
    const totalNetoPena = totalNetoBuffet + r.otrosIngresos + r.retiros + totalNetoComida + r.show + r.colaboraciones + r.otrosGastos;
    return { ...r, totalNetoBuffet, totalNetoComida, totalNetoPena };
  });
}

function renderEventosResumen() {
  const movsAll = movimientos.filter(m => m.eventoId && eventoResCategoria(m.codRubro) !== null);
  const anios = [...new Set(movsAll.map(m => m.fecha.slice(0,4)))].filter(Boolean).sort().reverse();
  if (eventoResAnio !== "" && !anios.includes(eventoResAnio) && anios.length) {
    eventoResAnio = anios[0];
  }

  // El filtro por mes solo aplica cuando hay un año específico seleccionado
  const mesesDisponibles = eventoResAnio
    ? [...new Set(movsAll.filter(m => m.fecha.slice(0,4) === eventoResAnio).map(m => m.fecha.slice(5,7)))].sort()
    : [];
  if (eventoResMes && !mesesDisponibles.includes(eventoResMes)) eventoResMes = "";

  const rows = calcEventosResumen(eventoResAnio, eventoResMes)
    .sort((a,b) => b.fecha.localeCompare(a.fecha));

  const anioOptions = `<option value="" ${eventoResAnio===""?"selected":""}>Todos los años</option>` +
    anios.map(a => `<option value="${a}" ${eventoResAnio===a?"selected":""}>${a}</option>`).join("");

  const mesSelector = eventoResAnio ? `
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:150px">
          <label style="font-size:11px;color:var(--text3);white-space:nowrap">Mes:</label>
          <select class="inp" style="flex:1" onchange="setEventoResMes(this.value)">
            <option value="" ${eventoResMes===""?"selected":""}>Todo el año</option>
            ${mesesDisponibles.map(mm => `<option value="${mm}" ${eventoResMes===mm?"selected":""}>${MESES_LABELS[Number(mm)-1]}</option>`).join("")}
          </select>
        </div>` : "";

  const viewToggle = `
    <div class="reint-view-toggle">
      <button class="reint-view-btn ${eventoResVista==='tabla'?'active':''}" onclick="setEventoResVista('tabla')">⊞ Tabla</button>
      <button class="reint-view-btn ${eventoResVista==='cards'?'active':''}" onclick="setEventoResVista('cards')">▤ Cards</button>
    </div>`;

  const totalNeto = rows.reduce((s,r) => s + r.totalNetoPena, 0);
  const periodoTxt = eventoResMes ? ` (${MESES_LABELS[Number(eventoResMes)-1]})` : "";
  const totalesLine = `${rows.length} evento${rows.length!==1?"s":""}${periodoTxt} · Total neto: ${totalNeto<0?"-":"+"}${fmt(Math.abs(totalNeto))}`;

  const body = !rows.length
    ? `<p class="note" style="text-align:center;padding:16px 0">Sin movimientos de Peñas y Eventos con evento asignado</p>`
    : eventoResVista === "cards" ? renderEventosResCards(rows) : renderEventosResTabla(rows);

  return `
    <div class="reint-section">
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:150px">
          <label style="font-size:11px;color:var(--text3);white-space:nowrap">Año:</label>
          <select class="inp" style="flex:1" onchange="setEventoResAnio(this.value)">${anioOptions}</select>
        </div>
        ${mesSelector}
        ${viewToggle}
      </div>
      <p class="note" style="margin-bottom:12px">${totalesLine}</p>
      ${body}
    </div>`;
}

function renderEventosResTabla(rows) {
  let totBuffet=0, totGastosBuffet=0, totNetoBuffet=0, totOtrosIng=0, totRetiros=0,

    return `<td style="text-align:right;font-family:var(--mono)" class="${v<0?'egr':'ing'}">${v<0?"-":"+"}${fmt(Math.abs(v))}</td>`;
  }
  function cellBold(v) {

    return `<td style="text-align:right;font-family:var(--mono);font-weight:600" class="${v<0?'egr':'ing'}">${v<0?"-":"+"}${fmt(Math.abs(v))}</td>`;
  }

  const bodyRows = rows.map(r => {

    totNetoComida   += r.totalNetoComida;

    totColab        += r.colaboraciones;

    const isExp = eventoResExpandido.has(r.eventoId);

    return `

  const totRow = `<tr class="reint-tot-row">

          <th style="text-align:right">Otros ingresos</th>

          <th style="text-align:right">Gastos Comida</th>

          <th style="text-align:right">Total Neto Peña</th>
        </tr></thead>
        <tbody>${bodyRows}${totRow}</tbody>
      </table>
    </div>`;
}

async function savePartido(partidoId) {
  const btnId = "btn-guardar-partido";
  if (document.getElementById(btnId)?.disabled) return; // evita doble envío
  const fecha     = (document.getElementById("par-fecha")?.value    || "").trim();
  const rival     = (document.getElementById("par-rival")?.value    || "").trim();
  const nfecha    = (document.getElementById("par-nfecha")?.value   || "").trim();
  const condicion = document.getElementById("par-condicion")?.value || "LOCAL";
  const torneo    = document.getElementById("par-torneo")?.value    || "";
  if (!fecha)  { toast("Ingresá una fecha", "err"); return; }
  if (!rival)  { toast("Ingresá el rival", "err"); return; }
  if (!nfecha) { toast("Ingresá el número de fecha", "err"); return; }
  const dupFecha = partidos.some(p => p.id !== partidoId && p.activo !== false
    && normStr(p.torneo) === normStr(torneo) && normStr(p.numeroFecha) === normStr(nfecha));
  if (dupFecha) { toast("Ya hay un partido con ese número de fecha en ese torneo", "err"); return; }
  const partido = partidoId
    ? { id:partidoId, fecha, rival, numeroFecha:nfecha, condicion, torneo }
    : { fecha, rival, numeroFecha:nfecha, condicion, torneo };
  setBtnState(btnId, "saving");
  try {
    const r = await Storage.savePartido(partido);
    if (!r.ok) throw new Error(r.error || "Error");
    if (partidoId) {
      const idx = partidos.findIndex(p => p.id === partidoId);
      if (idx >= 0) partidos[idx] = { ...partidos[idx], fecha, rival, numeroFecha:nfecha, condicion, torneo };
    } else {
      partidos.push({ id:r.id, fecha, rival, numeroFecha:nfecha, condicion, torneo, activo:true });
    }
    setBtnState(btnId, "saved");
    toast(partidoId ? "Partido actualizado ✓" : "Partido agregado ✓", "ok");
    closeModal();
    renderEntidades();
  } catch(e) { handleSaveError(btnId, e); }
}

function asocSelectAll(checked) {
  document.querySelectorAll(".asoc-cb").forEach(cb => {
    const row = cb.closest(".asoc-row");
    if (!row || row.style.display === "none") return;
    cb.checked = checked;
  });
}

function asocFiltrar(q) {
  const term = q.toLowerCase().trim();
  let visible = 0;
  document.querySelectorAll(".asoc-row").forEach(row => {
    const match = !term || row.textContent.toLowerCase().includes(term);
    row.style.display = match ? "" : "none";
    if (match) visible++;
  });
  const cnt = document.getElementById("asoc-count");
  if (cnt) cnt.textContent = visible + " movimiento" + (visible !== 1 ? "s" : "");
}

async function guardarAsociaciones(partidoId) {
  const checkboxes = [...document.querySelectorAll(".asoc-cb")];
  if (!checkboxes.length) { closeModal(); return; }

  // Clasificar cambios
  const toAssign   = []; // checked, sin partido o con partido diferente (confirmado)
  const toUnassign = []; // desmarcado, tenía ESTE partido
  const pendReasign = []; // checked, tenía OTRO partido → necesita confirmación

  for (const cb of checkboxes) {
    const movId      = cb.value;
    const origPid    = cb.dataset.originalPid;
    const otroLabel  = cb.dataset.otroLabel;
    if (cb.checked) {
      if (origPid === partidoId) continue; // ya está correcto
      if (origPid && origPid !== partidoId) pendReasign.push({ movId, otroLabel });
      else toAssign.push(movId);
    } else {
      if (origPid === partidoId) toUnassign.push(movId);
    }
  }

  // Confirmación única para reasignaciones
  if (pendReasign.length) {
    const labels = [...new Set(pendReasign.map(x => x.otroLabel))].join(", ");
    const msg = pendReasign.length === 1
      ? `Este movimiento ya está asociado a "${pendReasign[0].otroLabel}". ¿Reasignar a este partido?`
      : `${pendReasign.length} movimientos ya están asociados a: ${labels}. ¿Reasignarlos a este partido?`;
    if (confirm(msg)) pendReasign.forEach(x => toAssign.push(x.movId));
  }

  const ops = [
    ...toAssign.map(id   => ({ id, newPid: partidoId })),
    ...toUnassign.map(id => ({ id, newPid: "" })),
  ];

  if (!ops.length) { toast("Sin cambios para guardar", "ok"); return; }

  const btn = document.getElementById("asoc-save-btn");
  if (btn) { btn.disabled = true; btn.textContent = "0/" + ops.length + " guardados…"; }

  let done = 0;
  for (const { id, newPid } of ops) {
    const mov = movimientos.find(m => m.id === id);
    if (mov) {
      const updated = { ...mov, partidoId: newPid };
      try {
        const r = await Storage.updateMov(updated);
        if (r.ok) {
          const idx = movimientos.findIndex(m => m.id === id);
          if (idx >= 0) movimientos[idx] = updated;
        }
      } catch(e) { /* continuar con el resto */ }
    }
    done++;
    if (btn) btn.textContent = done + "/" + ops.length + " guardados…";
  }

  closeModal();
  toast(done + " movimiento" + (done!==1?"s":"") + " actualizados ✓", "ok");
}

// ── Reserva de Granos ────────────────────────────────────────────
// kg en stock por grano = Σ COSECHA - Σ VENTA (mismo patrón que calcSaldosCuentas).
function calcStockGranos() {
  const stock = {};
  for (const r of reservas) {
    if (!stock[r.grano]) stock[r.grano] = 0;
    if (r.tipo === "COSECHA") stock[r.grano] += r.kg;
    else if (r.tipo === "VENTA") stock[r.grano] -= r.kg;
  }
  return stock;
}

function valorTotalGranos() {
  const stock = calcStockGranos();
  let total = 0;
  for (const grano in stock) {
    total += (stock[grano] / 1000) * (preciosGranos[grano] || 0);
  }
  return total;
}

    toast("Precio actualizado ✓", "ok");

async function addCosecha() {
  const btnId = "btn-agregar-cosecha";
  if (document.getElementById(btnId)?.disabled) return; // evita doble envío
  const selGrano = document.getElementById("cosecha-grano")?.value || "";
  const otro     = (document.getElementById("cosecha-grano-otro")?.value || "").trim();
  const grano    = selGrano || otro;
  const fecha    = document.getElementById("cosecha-fecha")?.value || today();
  const kg       = parseFloat(document.getElementById("cosecha-kg")?.value || "0");
  const nota     = document.getElementById("cosecha-nota")?.value || "";
  if (!grano)               { toast("Indicá el grano", "err"); return; }
  if (!isFinite(kg) || kg <= 0) { toast("Ingresá los kg ingresados (número positivo)", "err"); return; }
  setBtnState(btnId, "saving");
  try {
    const r = await Storage.saveReserva({ fecha, grano, tipo: "COSECHA", kg, nota });
    if (!r.ok) throw new Error(r.error || "Error");
    reservas.push({ id: r.id, fecha, grano, tipo: "COSECHA", kg, nota, movimientoId: "" });
    toast("Cosecha registrada ✓", "ok");
    renderEntidades();
    setBtnState(btnId, "saved");
  } catch(e) { handleSaveError(btnId, e); }
}

async function addVentaGrano() {
  const btnId = "btn-registrar-venta-grano";
  if (document.getElementById(btnId)?.disabled) return; // evita doble envío
  const grano  = document.getElementById("venta-grano")?.value || "";
  const fecha  = document.getElementById("venta-fecha")?.value || today();
  const kg     = parseFloat(document.getElementById("venta-kg")?.value || "0");
  const monto  = parseFloat(document.getElementById("venta-monto")?.value || "0");
  const cuenta = document.getElementById("venta-cuenta")?.value || cuentas[0] || "";
  const modo   = document.getElementById("venta-metodo")?.value || metodos[0] || "";
  const nota   = document.getElementById("venta-nota")?.value || "";
  if (!grano)                      { toast("Seleccioná el grano", "err"); return; }
  if (!isFinite(kg) || kg <= 0)    { toast("Ingresá los kg vendidos (número positivo)", "err"); return; }
  if (!isFinite(monto) || monto<=0){ toast("Ingresá el monto del ingreso (número positivo)", "err"); return; }
  const stock = calcStockGranos();
  if (kg > (stock[grano] || 0)) {
    toast(`No hay suficiente stock de ${grano} (disponible: ${fmt(stock[grano]||0)} kg)`, "err");
    return;
  }
  setBtnState(btnId, "saving");
  showOverlay("Guardando…");
  try {
    const mes = fecha.slice(0,7).replace("-","");
    const movPayload = {
      id: uid(), mes, fecha,
      codRubro: "34", rubro: "CEREAL - INGRESOS Y GASTOS", categoria: "Otros | Internos",
      concepto: `Venta ${grano} ${fmt(kg)} kg`,
      egreso: 0, ingreso: monto, montoFinal: monto,
      cuenta, cuentaDestino: "", modoPago: modo,
      jugadorCT: "", adherente: "",
      observacion: nota, comprobante: "", seguroReintegro: 0, tipo: "INGRESO",
    };
    const rMov = await Storage.saveMov(movPayload);
    if (!rMov.ok) throw new Error(rMov.error || "Error al guardar el ingreso");
    movimientos.push(movPayload);

    const rRes = await Storage.saveReserva({ fecha, grano, tipo: "VENTA", kg, nota, movimientoId: rMov.id });
    if (!rRes.ok) throw new Error(rRes.error || "Error al descontar el stock");
    reservas.push({ id: rRes.id, fecha, grano, tipo: "VENTA", kg, nota, movimientoId: rMov.id });

    updateBadge();
    toast("Venta registrada e ingreso generado ✓", "ok");
    renderEntidades();
    setBtnState(btnId, "saved");
  } catch(e) {
    handleSaveError(btnId, e);
  } finally {
    hideOverlay();
  }
}

async function saveGrupo(grupoId) {
  const btnId = "btn-guardar-grupo";
  if (document.getElementById(btnId)?.disabled) return; // evita doble envío
  const nombre = (document.getElementById("grupo-nombre")?.value || "").trim();
  if (!nombre) { toast("Ingresá un nombre", "err"); return; }
  if (grupos.some(g => g.id !== grupoId && normStr(g.nombre) === normStr(nombre))) {
    toast("Ya existe un grupo con ese nombre", "err"); return;
  }
  const checks = document.querySelectorAll(".grupo-jug-list input[type=checkbox]:checked");
  const miembros = Array.from(checks).map(c => c.value);
  const grupo = grupoId ? { id:grupoId, nombre, miembros } : { nombre, miembros };
  setBtnState(btnId, "saving");
  try {
    const r = await Storage.saveGrupo(grupo);
    if (!r.ok) throw new Error(r.error || "Error");
    if (grupoId) {
      const idx = grupos.findIndex(g => g.id === grupoId);
      if (idx >= 0) grupos[idx] = { ...grupos[idx], nombre, miembros };
    } else {
      grupos.push({ id: r.id, nombre, miembros });
    }
    setBtnState(btnId, "saved");
    toast(grupoId ? "Grupo actualizado ✓" : "Grupo creado ✓", "ok");
    closeModal();
    renderEntidades();
  } catch(e) { handleSaveError(btnId, e); }
}

function confirmDeleteGrupo(id) {
  const btn = document.getElementById("gdel-"+id);
  if (!btn || btn.disabled) return;
  if (btn.dataset.confirm) { deleteGrupo(id); }
  else {
    btn.dataset.confirm = "1"; btn.textContent = "¿Eliminar?";
    setTimeout(() => { if(btn && !btn.disabled){ btn.dataset.confirm=""; btn.textContent="✕"; }}, 3000);
  }
}
async function deleteGrupo(id) {
  const btnId = "gdel-" + id;
  const btn = document.getElementById(btnId);
  if (btn) { btn.disabled = true; btn.textContent = "Eliminando…"; }
  try {
    const r = await Storage.deleteGrupo(id);
    if (!r.ok) throw new Error(r.error || "Error");
    grupos = grupos.filter(g => g.id !== id);
    saveSnapshotToCache();
    toast("Grupo eliminado", "ok");
    renderEntidades();
  } catch(e) { handleDeleteError(btnId, e); }
}

async function saveAdherenteModal(adherenteId) {

  const cuotasAnuales = Number(document.getElementById("adh-cuotas-anuales")?.value || 0);
  if (!nombre) { toast("Ingresá un nombre", "err"); return; }
  if (adherentes.some(a => a.id !== adherenteId && normStr(a.nombre) === normStr(nombre))) {
    toast("Ya existe un adherente con ese nombre", "err"); return;
  }
  if (!isFinite(cuotaMensual)  || cuotaMensual  < 0) { toast("La cuota mensual no puede ser negativa", "err"); return; }
  if (!isFinite(cuotasAnuales) || cuotasAnuales < 0) { toast("Las cuotas por año no pueden ser negativas", "err"); return; }
  const adherente = adherenteId
    ? { id:adherenteId, nombre, cuotaMensual, cuotasAnuales }
    : { nombre, cuotaMensual, cuotasAnuales };
  setBtnState(btnId, "saving");
  try {
    const r = await Storage.saveAdherente(adherente);
    if (!r.ok) throw new Error(r.error || "Error");
    if (adherenteId) {
      const idx = adherentes.findIndex(a => a.id === adherenteId);
      if (idx >= 0) adherentes[idx] = { ...adherentes[idx], nombre, cuotaMensual, cuotasAnuales };
    } else {
      adherentes.push({ id:r.id, nombre, cuotaMensual, cuotasAnuales });

    closeModal();
    renderEntidades();
  } catch(e) { handleSaveError(btnId, e); }

function renderAdhHistorial() {
  const months = getLast6Months();
  const adhs   = [...adherentes].sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const header = `<tr><th>Adherente</th>${months.map(m=>`<th>${mesLabel(m).slice(0,3)}<br>${m.slice(2,4)}</th>`).join("")}</tr>`;
  const rows   = adhs.map(adh => {
    const cells = months.map(m => {
      const mesCod = m.replace("-","");
      const p = pagos.find(p2 => p2.adherenteId === adh.id && p2.mes === mesCod);
      const estado = p ? p.estado : "";
      const icon   = estado==="PAGADO" ? "✓" : estado==="PENDIENTE" ? "✗" : "·";
      const style  = estado==="PAGADO" ? "color:var(--green)" : estado==="PENDIENTE" ? "color:var(--red)" : "color:var(--text3)";
      return `<td><button class="pago-btn" style="${style}" onclick="toggleAdhPago('${adh.id}','${esc(adh.nombre)}','${mesCod}')" title="${adh.nombre} — ${mesLabel(m)}">${icon}</button></td>`;
    }).join("");
    return `<tr><td>${esc(adh.nombre)}</td>${cells}</tr>`;
  }).join("");
  return `<div class="adh-grid-wrap"><table class="adh-grid"><thead>${header}</thead><tbody>${rows}</tbody></table></div>`;
}

function getLast6Months() {
  const months = [];
  let k = nowMes();
  for (let i = 0; i < 6; i++) { months.push(k); k = prevMes(k); }
  return months;
}

async function toggleAdhPago(adhId, adhNombre, mesCod) {
  try {
    const r = await Storage.togglePago(adhId, adhNombre, mesCod);
    if (!r.ok) throw new Error(r.error || "Error");
    // Refresh pagos from backend to guarantee accurate state
    const rPag = await Storage.listPagos();
    if (rPag.ok) pagos = rPag.pagos || [];
    renderEntidades();
  } catch(e) { toast("Error: " + e.message, "err"); }
}

// ── Auditoría de movimientos (Tarea 7) ───────────────────────────
function runAudit() {
  const rubrosByCod = {};
  for (const r of RUBROS) rubrosByCod[r.cod] = r;
  const nombresJug = new Set([...jugadores, ...grupos].map(j => j.nombre.toLowerCase().trim()));
  const nombresAdh = new Set(adherentes.map(a => a.nombre.toLowerCase().trim()));

  const problemas = []; // { id, fecha, concepto, motivo }
  for (const m of movimientos) {
    const motivos = [];
    const cat = rubrosByCod[m.codRubro];
    if (m.codRubro && (!cat || cat.nombre !== m.rubro)) motivos.push("Rubro fuera de catálogo o desincronizado con CodRubro");
    if (m.jugadorCT && !nombresJug.has(m.jugadorCT.toLowerCase().trim())) motivos.push("Jugador/CT no está en la lista");
    if (m.adherente && !nombresAdh.has(m.adherente.toLowerCase().trim())) motivos.push("Adherente no está en la lista");
    if (!m.tipo) motivos.push("Tipo vacío");
    else if (m.tipo === "INGRESO" && (m.egreso > 0 || !(m.ingreso > 0))) motivos.push("Tipo INGRESO incoherente con Egreso/Ingreso");
    else if (m.tipo === "EGRESO"  && (m.ingreso > 0 || !(m.egreso > 0))) motivos.push("Tipo EGRESO incoherente con Egreso/Ingreso");
    if (motivos.length) problemas.push({ id: m.id, fecha: m.fecha, concepto: m.concepto, motivos });
  }

  const el = document.getElementById("audit-result");
  if (!el) return;
  if (!problemas.length) { el.innerHTML = `<p class="note">✓ Sin inconsistencias detectadas</p>`; return; }
  el.innerHTML = `
    <p class="note" style="margin-bottom:8px"><b>${problemas.length}</b> movimientos con inconsistencias:</p>
    ${problemas.slice(0,100).map(p => `
      <div class="entity-item" style="flex-direction:column;align-items:stretch;gap:4px">
        <div style="display:flex;justify-content:space-between">
          <span class="entity-name">${esc(p.fecha)} — ${esc(p.concepto)||"—"}</span>
          <button class="btn-sm accent" onclick="editMovimiento('${p.id}')">Editar</button>
        </div>
        <div style="font-size:11px;color:var(--red)">${p.motivos.map(esc).join(" · ")}</div>
      </div>`).join("")}
    ${problemas.length > 100 ? `<p class="note">…y ${problemas.length-100} más</p>` : ""}
  `;
}

function addCuenta() {

// ── Excel Export ──────────────────────────────────────────────
// Arma headers + filas para un array de movimientos, en el formato común
// usado por exportExcel() y exportExcelFiltrado()
function movimientosToExcelRows(data) {
  const headers = ["MES","Fecha","Cód. Rubro","Rubro","CONCEPTO",
                   "# EGRESOS","# INGRESOS","# MONTO FINAL","SALDO",
                   "CUENTA","CUENTA DESTINO","MODO PAGO","Jug/Ct","Adherente","Partido","Observacion","Comprobante"];
  let saldo = 0;
  const rows = data.map(m => {
    const ing = m.tipo==="INGRESO" ? m.ingreso : 0;
    const egr = m.tipo==="EGRESO"  ? m.egreso  : 0;
    if (m.tipo !== "INTERNO") saldo += ing - egr;
    const p = m.partidoId ? partidos.find(x => x.id === m.partidoId) : null;
    const partidoLbl = p ? `${p.numeroFecha} — ${p.rival}` : "";
    return [
      m.mes, m.fecha, m.codRubro, m.rubro, m.concepto,
      egr||"", ing||"", m.montoFinal||"", saldo,
      m.cuenta, m.tipo==="INTERNO" ? (m.cuentaDestino||"") : "", m.modoPago, m.jugadorCT||"", m.adherente||"",
      partidoLbl, m.observacion||"", m.comprobante||""
    ];
  });
  return { headers, rows };
}

// mes: "YYYY-MM" para exportar solo ese mes, o null/"" para exportar todo el histórico
function exportExcel(mes) {
  if (typeof XLSX === "undefined") { toast("SheetJS no cargó", "err"); return; }
  let data = mes
    ? movimientos.filter(m => getMes(m.fecha) === mes)
    : [...movimientos];
  data = data.sort((a,b) => a.fecha.localeCompare(b.fecha));

  const { headers, rows } = movimientosToExcelRows(data);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws["!cols"] = [8,12,8,30,30,12,12,12,12,12,14,14,20,20,24,20,14].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws, "Movimientos");
  const fname = mes ? `tesoreria_${mes.replace("-","")}.xlsx` : "tesoreria_todos.xlsx";
  XLSX.writeFile(wb, fname);
  toast("Excel exportado ✓", "ok");
}

// Exporta exactamente lo que se ve en pantalla en Movimientos: mes + todos los
// filtros activos de listFiltros (a diferencia de exportExcel(), que solo filtra por mes)
function exportExcelFiltrado() {
  if (typeof XLSX === "undefined") { toast("SheetJS no cargó", "err"); return; }
  const data = getMovimientosFiltrados().sort((a,b) => a.fecha.localeCompare(b.fecha));
  if (!data.length) { toast("No hay movimientos para exportar con estos filtros", "err"); return; }

  const { headers, rows } = movimientosToExcelRows(data);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws["!cols"] = [8,12,8,30,30,12,12,12,12,12,14,14,20,20,24,20,14].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws, "Movimientos");
  const fname = listFiltrosActive() ? `tesoreria_${sharedMes}_filtrado.xlsx` : `tesoreria_${sharedMes}.xlsx`;
  XLSX.writeFile(wb, fname);
