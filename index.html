// Columnas de la vista tabla de Movimientos (variante propia de DT_COLS: sin "Mes"
// porque la pantalla ya muestra un solo mes a la vez, y con Cuenta/Partido propios).
// "acciones" es "pinned": no se puede ocultar desde el selector de columnas.
const MOV_TABLE_COLS = [
  { key:"acciones",  label:"",                  sortable:false, pinned:true,
    render: it => `<button class="btn-sm accent dt-edit-btn" onclick="openMovModal('${escJs(it.id)}')">✏️</button>` },
  { key:"fecha",     label:"Fecha",             sortable:true },
  { key:"concepto",  label:"Concepto",          sortable:true, cls:"jd-concepto" },
  { key:"monto",     label:"Monto",             sortable:true },
  { key:"rubro",     label:"Rubro",             sortable:true },
  { key:"categoria", label:"Categoría",         sortable:true },
  { key:"cuenta",    label:"Cuenta",            sortable:true },
  { key:"entidad",   label:"Jugador/Adherente", sortable:true },
  { key:"partido",   label:"Partido",           sortable:true },
];

function renderMovTabla(movMes) {
  const cuentaFiltro = listFiltros.cuenta;
  const items = movMes.map(m => {
    // INTERNO: sin filtro de cuenta (o filtrando por la cuenta de origen) se ve como
    // egreso (sale de esa cuenta); si se filtra justo por la cuenta DESTINO, es un
    // ingreso real para esa cuenta y debe verse en verde, no en rojo.
    const monto = m.tipo==="INGRESO" ? m.ingreso
                : m.tipo==="EGRESO"  ? -m.egreso
                : m.tipo==="AJUSTE"  ? m.montoFinal
                : (cuentaFiltro && m.cuentaDestino === cuentaFiltro) ? m.montoFinal : -m.montoFinal;
    return {
      id: m.id,
      fechaRaw: m.fecha || "",
      fechaD: m.fecha ? m.fecha.slice(8,10)+"/"+m.fecha.slice(5,7)+"/"+m.fecha.slice(0,4) : "",
      concepto: m.concepto || "",
      monto,
      rubro: m.rubro || "",
      categoria: m.categoria || "",
      cuenta: m.tipo==="INTERNO" ? `${m.cuenta||""} → ${m.cuentaDestino||""}` : (m.cuenta||""),
      entidad: m.jugadorCT || m.adherente || "",
      partido: m.partidoId ? partidoLabel(m.partidoId) : "",
    };
  });
  return renderDetTabla("movlist", items, MOV_TABLE_COLS);
}

// Movimientos del mes seleccionado con todos los filtros de listFiltros aplicados
// (usado tanto por renderMovList como por exportExcelFiltrado, para no duplicar la lógica)
function getMovimientosFiltrados() {
  return movimientos
    .filter(m => mesFromRecord(m) === sharedMes)
    .filter(m => !listFiltros.rubro  || normStr(m.rubro).includes(normStr(listFiltros.rubro)))
    .filter(m => !listFiltros.cat    || normStr(m.categoria).includes(normStr(listFiltros.cat)))
    .filter(m => !listFiltros.cuenta || m.cuenta === listFiltros.cuenta || m.cuentaDestino === listFiltros.cuenta)
    .filter(m => !listFiltros.tipo      || m.tipo        === listFiltros.tipo)
    .filter(m => !listFiltros.adherente || normStr(m.adherente).includes(normStr(listFiltros.adherente)))
    .filter(m => !listFiltros.jugadorCT || normStr(m.jugadorCT).includes(normStr(listFiltros.jugadorCT)))
    .filter(m => {
      if (!listFiltros.partido) return true;
      if (listFiltros.partido === "__sin__") return !m.partidoId;
      return m.partidoId === listFiltros.partido;
    })
    .filter(m => {
      const q = normStr(listFiltros.search);
      return !q || normStr(m.concepto).includes(q) || normStr(m.observacion).includes(q);
    });
}

function listFiltrosActive() {
  return !!(listFiltros.rubro || listFiltros.cat || listFiltros.cuenta || listFiltros.tipo ||
    listFiltros.adherente || listFiltros.jugadorCT || listFiltros.partido || listFiltros.search);
}

function renderMovList() {
  const movMes = getMovimientosFiltrados();

  // KPIs sobre el subtotal filtrado (igual al total del mes cuando no hay filtros extra)
  // Nota: las transferencias INTERNAS no suman al total general del club (no
  // entra ni sale plata, sólo cambia de cuenta), pero cuando el usuario filtra
  // por una cuenta puntual sí representan un movimiento real para esa cuenta:
  // egreso si la cuenta es el origen, ingreso si es el destino.
  const cuentaFiltro = listFiltros.cuenta;
  let ingTotal = movMes.filter(m => m.tipo === "INGRESO").reduce((s,m) => s + m.ingreso, 0);
  let egrTotal = movMes.filter(m => m.tipo === "EGRESO" ).reduce((s,m) => s + m.egreso,  0);
  if (cuentaFiltro) {
    for (const m of movMes) {
      if (m.tipo !== "INTERNO") continue;
      if (m.cuenta === cuentaFiltro)        egrTotal += m.montoFinal;
      if (m.cuentaDestino === cuentaFiltro) ingTotal += m.montoFinal;
    }
  }
  const saldo = ingTotal - egrTotal;
  const kpiIng = document.getElementById("kpi-ing");
  const kpiEgr = document.getElementById("kpi-egr");
  const kpiSaldo = document.getElementById("kpi-saldo");
  if (kpiIng) kpiIng.textContent = fmt(ingTotal);
  if (kpiEgr) kpiEgr.textContent = fmt(egrTotal);
  if (kpiSaldo) {
    kpiSaldo.textContent = (saldo<0?"-":"") + fmt(saldo);
    kpiSaldo.className = "stat-val " + (saldo>=0?"ing":"egr");
  }
  const kpiSaldoAcc = document.getElementById("kpi-saldo-acc");
  if (kpiSaldoAcc) {
    const saldoAcc = calcSaldoAcumuladoAnio(cuentaFiltro);
    kpiSaldoAcc.textContent = (saldoAcc<0?"-":"") + fmt(saldoAcc);
    kpiSaldoAcc.className = "stat-val " + (saldoAcc>=0?"ing":"egr");
    const lblAcc = kpiSaldoAcc.previousElementSibling;
    if (lblAcc) lblAcc.textContent = `Saldo acum. ${sharedMes.slice(0,4)}`;
  }
  const filtersActive = listFiltrosActive();
  const noteEl = document.getElementById("kpi-filter-note");
  if (noteEl) {
    const notaCuenta = cuentaFiltro
      ? ` · Incluye transferencias internas hacia/desde ${esc(cuentaFiltro)}`
      : "";
    noteEl.innerHTML = filtersActive
      ? `Mostrando subtotal filtrado${notaCuenta} · <a href="#" onclick="clearListFilters();return false;" style="color:var(--accent)">Ver mes completo</a>`
      : "";
  }
  const exportBtn = document.getElementById("mov-export-btn");
  if (exportBtn) exportBtn.innerHTML = `📥 Exportar ${mesLabel(sharedMes)}${filtersActive ? ' (filtrado)' : ''} a Excel`;

  // Orden, aplicado después de filtrar
  movMes.sort((a,b) => {
    if (movOrden === "fecha_asc")  return a.fecha.localeCompare(b.fecha);
    if (movOrden === "monto_desc") return Math.abs(b.montoFinal) - Math.abs(a.montoFinal);
    if (movOrden === "monto_asc")  return Math.abs(a.montoFinal) - Math.abs(b.montoFinal);
    return b.fecha.localeCompare(a.fecha); // fecha_desc (default)
  });

  const cnt = document.getElementById("mov-count");
  if (cnt) cnt.textContent = movMes.length + " movimiento" + (movMes.length!==1?"s":"");

  const el = document.getElementById("mov-list");
  if (!el) return;
  if (!movMes.length) {
    el.innerHTML = `<div class="empty"><div class="ico">📋</div><p>Sin movimientos${listFiltros.search ? " para esa búsqueda" : " en este mes"}</p></div>`;
    return;
  }

  if (movVista === "tabla") {
    el.innerHTML = `<div class="mov-table-breakout">${renderMovTabla(movMes)}</div>`;
    return;
  }

  el.innerHTML = movMes.map(m => {
    const montoClass = m.tipo==="INGRESO" ? "ing" : m.tipo==="EGRESO" ? "egr" : m.tipo==="AJUSTE" ? "adj" : "int";
    const montoVal   = m.tipo==="INGRESO" ? m.ingreso : m.tipo==="AJUSTE" ? Math.abs(m.montoFinal) : m.egreso || m.montoFinal;
    const montoSign  = m.tipo==="INGRESO" ? "+" : m.tipo==="EGRESO" ? "−" : m.tipo==="AJUSTE" ? (m.montoFinal>=0?"⊙+":"⊙−") : "⇄";
    const tagsHtml = `
          ${m._pending ? `<span class="tag" style="color:var(--warn);background:var(--warn-bg)">⏳ pendiente de sincronizar</span>` : ""}
          <span class="tag tag-cuenta">${esc(m.cuenta)}</span>
          ${m.jugadorCT ? `<span class="tag tag-jug">${esc(m.jugadorCT)}</span>` : ""}
          ${m.adherente ? `<span class="tag tag-adh">${esc(m.adherente)}</span>` : ""}
          ${m.partidoId ? `<span class="tag tag-partido">⚽ ${esc(partidoLabel(m.partidoId))}</span>` : ""}
          ${m.tipo==="INTERNO" ? `<span class="tag tag-int">→ ${esc(m.cuentaDestino||"?")}</span>` : ""}
          ${m.tipo==="AJUSTE" ? `<span class="tag tag-adj">⊙ ajuste</span>` : ""}`;
    return `
    <div class="mov-card" onclick="openMovModal('${m.id}')">
      <div class="mov-card-row1">
        <span class="mov-card-fecha-big">${fechaCorta(m.fecha)}</span>
        <span class="monto ${montoClass} mov-card-monto">${montoSign}${fmt(montoVal)}</span>
      </div>
      <div class="mov-card-rubro-full">${esc(m.rubro)}</div>
      <div class="mov-card-row3">
        <span class="mov-card-concepto">${esc(m.concepto) || '<span style="color:var(--text3)">Sin concepto</span>'}</span>
        <span class="mov-card-modo">${esc(m.modoPago)}</span>
      </div>
      ${tagsHtml.trim() ? `<div class="mov-card-tags">${tagsHtml}</div>` : ""}
    </div>`;
  }).join("");
}

function setListFilter(key, val) {
  if (listFiltros[key] === val) listFiltros[key] = "";
  else listFiltros[key] = val;
  renderMovimientos();
}
function clearListFilters() {
  listFiltros = { rubro: "", cat:"", cuenta:"", tipo:"", adherente:"", jugadorCT:"", partido:"", search:"" };
  renderMovimientos();
}
function changeMes(delta) {
  sharedMes = delta < 0 ? prevMes(sharedMes) : nextMes(sharedMes);
  if (currentTab === "movimientos") renderMovimientos();
  else if (currentTab === "resumen") {
    catResExpandido.clear();
    adhResumenOpen = false;
    renderResumen();
  }
}

function openMovModal(id) {
  const m = movimientos.find(x => x.id === id);
  if (!m) return;
  const montoClass = m.tipo==="INGRESO" ? "ing" : m.tipo==="EGRESO" ? "egr" : m.tipo==="AJUSTE" ? "adj" : "int";
  const montoVal   = m.tipo==="INGRESO" ? m.ingreso : m.tipo==="AJUSTE" ? Math.abs(m.montoFinal) : m.egreso || m.montoFinal;
  const montoSign  = m.tipo==="INGRESO" ? "+" : m.tipo==="EGRESO" ? "−" : m.tipo==="AJUSTE" ? (m.montoFinal>=0?"⊙+":"⊙−") : "⇄";
  const rows = [
    ["Tipo",        m.tipo],
    ["Fecha",       m.fecha],
    ["Mes",         mesLabel(m.mes ? m.mes.slice(0,4)+"-"+m.mes.slice(4) : "")],
    ["Rubro",       "["+m.codRubro+"] "+m.rubro],
    ["Categoría",   m.categoria],
    ["Concepto",    m.concepto || "—"],
    ["Cuenta",      m.cuenta + (m.cuentaDestino ? " → "+m.cuentaDestino : "")],
    ["Método pago", m.modoPago],
    ["Jugador/CT",  m.jugadorCT || "—"],
    ["Adherente",   m.adherente || "—"],
    ["Partido",     m.partidoId ? partidoLabel(m.partidoId) : "—"],
    (m.codRubro === "21" && m.tipo === "EGRESO") ? ["Reintegro", m.seguroReintegro ? "SÍ" : "NO"] : null,
    ["Observación", m.observacion || "—"],
    ["Comprobante", m.comprobante || "—"],
  ].filter(r => r && r[1] && r[1] !== "—").map(([l,v]) =>
    `<div class="modal-detail-row"><span class="modal-detail-lbl">${l}</span><span class="modal-detail-val">${esc(v)}</span></div>`
  ).join("");

  document.getElementById("modal-root").innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-monto-big ${montoClass}">${montoSign}${fmt(montoVal)}</div>
        ${rows}
        <div class="modal-footer">
          <button class="btn-secondary" style="flex:1" onclick="editMovimiento('${id}')">✏️ Editar</button>
          <button class="btn-sm danger" style="padding:12px 16px" id="del-btn-${id}" onclick="confirmDelete('${id}')">🗑</button>
        </div>
      </div>
    </div>`;
}

function confirmDelete(id) {
  const btn = document.getElementById("del-btn-"+id);
  if (!btn) return;
  if (btn.dataset.confirm) {
    deleteMovimiento(id);
  } else {
    btn.dataset.confirm = "1";
    btn.textContent = "¿Eliminar?";
    btn.style.color = "var(--red)";
    setTimeout(() => { if(btn){ btn.dataset.confirm=""; btn.textContent="🗑"; btn.style.color=""; }}, 3000);
  }
}

async function deleteMovimiento(id) {
  closeModal();
  showOverlay("Eliminando…");
  try {
    const r = await Storage.deleteMov(id);
    if (!r.ok) throw new Error(r.error || "Error al eliminar");
    movimientos = movimientos.filter(m => m.id !== id);
    updateBadge();
    saveSnapshotToCache();
    toast("Movimiento eliminado", "ok");
    renderMovimientos();
  } catch(e) { toast("Error: " + e.message, "err"); }
  finally { hideOverlay(); }
}

function editMovimiento(id) {
  const m = movimientos.find(x => x.id === id);
  if (!m) return;
  F.id          = m.id;
  F.tipo        = m.tipo;
  F.fecha       = m.fecha;
  F.codRubro    = m.codRubro;
  F.rubro       = m.rubro;
  F.categoria   = m.categoria;
  F.concepto    = m.concepto;
  F.monto       = String(m.tipo === "INGRESO" ? m.ingreso : m.egreso || m.montoFinal);
  F.cuenta      = m.cuenta;
  F.cuentaDestino = m.cuentaDestino || "";
  F.modoPago    = m.modoPago;
  F.jugadorCT   = m.jugadorCT || "";
  F.adherente   = m.adherente || "";
  F.observacion = m.observacion || "";
  F.comprobante = m.comprobante || "";
  F.seguroReintegro = m.seguroReintegro || 0;
  F.saldoReal = "";
  F.partidoId = m.partidoId || "";
  F.eventoId  = m.eventoId || "";
  editId = id;
  closeModal();
  goTab("nuevo");
}

function closeModal(e) {
  if (e && e.target !== document.querySelector(".modal-overlay")) return;
  document.getElementById("modal-root").innerHTML = "";
}

function showMovSavedModal(mov, wasEdit) {
  const montoClass = mov.tipo==="INGRESO" ? "ing" : mov.tipo==="EGRESO" ? "egr" : mov.tipo==="AJUSTE" ? "adj" : "int";
  const montoVal   = mov.tipo==="INGRESO" ? mov.ingreso : mov.tipo==="AJUSTE" ? Math.abs(mov.montoFinal) : mov.egreso || mov.montoFinal;
  const montoSign  = mov.tipo==="INGRESO" ? "+" : mov.tipo==="EGRESO" ? "\u2212" : mov.tipo==="AJUSTE" ? (mov.montoFinal>=0?"\u229a+":"\u229a\u2212") : "\u21c4";
  const detalles = [
    ["Tipo",      mov.tipo],
    ["Fecha",     mov.fecha],
    ["Rubro",     "["+mov.codRubro+"] "+mov.rubro],
    ["Concepto",  mov.concepto || null],
    ["Cuenta",    mov.cuenta + (mov.cuentaDestino ? " \u2192 "+mov.cuentaDestino : "")],
    ["M\u00e9todo",    mov.modoPago],
    mov.jugadorCT ? ["Jugador/CT", mov.jugadorCT] : null,
    mov.adherente ? ["Adherente",  mov.adherente]  : null,
    (mov.codRubro === "21" && mov.tipo === "EGRESO") ? ["Reintegro", mov.seguroReintegro ? "S\u00cd" : "NO"] : null,
    mov.observacion ? ["Observaci\u00f3n", mov.observacion] : null,
  ].filter(r => r && r[1]).map(([l,v]) =>
    `<div class="modal-detail-row"><span class="modal-detail-lbl">${l}</span><span class="modal-detail-val">${esc(v)}</span></div>`
  ).join("");
  document.getElementById("modal-root").innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div style="text-align:center;font-size:12px;font-weight:600;color:var(--green);letter-spacing:.05em;margin-bottom:2px">
          ${wasEdit ? "\u270f\ufe0f MOVIMIENTO ACTUALIZADO" : "\u2713 MOVIMIENTO GUARDADO"}
        </div>
        <div class="modal-monto-big ${montoClass}">${montoSign}${fmt(montoVal)}</div>
        ${detalles}
        <div class="modal-footer">
          <button class="btn-main" onclick="document.getElementById('modal-root').innerHTML=''">Aceptar</button>
        </div>
      </div>
    </div>`;
}

// ══════════════════════════════════════════════════════════════
// TAB 3 — RESUMEN / DASHBOARD
// ══════════════════════════════════════════════════════════════

function renderResumen() {
  const mesNum = mesToNum(sharedMes);
  const movMes = movimientos.filter(m => getMes(m.fecha) === sharedMes);
  const movHasta = movimientos.filter(m => mesToNum(getMes(m.fecha)) <= mesNum);

  const ingMes  = movMes.filter(m => m.tipo==="INGRESO").reduce((s,m) => s+m.ingreso, 0);
  const egrMes  = movMes.filter(m => m.tipo==="EGRESO" ).reduce((s,m) => s+m.egreso,  0);
  const saldoMes = ingMes - egrMes;

  const ingAcc  = movHasta.filter(m => m.tipo==="INGRESO").reduce((s,m) => s+m.ingreso, 0);
  const egrAcc  = movHasta.filter(m => m.tipo==="EGRESO" ).reduce((s,m) => s+m.egreso,  0);
  const saldoAcc = ingAcc - egrAcc;

  // Saldo por cuenta (todos los movimientos)
  const saldosCuentas = calcSaldosCuentas(movHasta);

  // Categorías del mes (egresos), con desglose por rubro dentro de cada una
  const catMap = {};
  for (const m of movMes) {
    if (m.tipo !== "EGRESO" && m.tipo !== "INGRESO") continue;
    if (!catMap[m.categoria]) catMap[m.categoria] = { ing:0, egr:0, rubros:{} };
    const cd = catMap[m.categoria];
    const rubroKey = m.codRubro || m.rubro || "(sin rubro)";
    if (!cd.rubros[rubroKey]) {
      const rubroNombre = m.rubro || RUBROS.find(r => r.cod === m.codRubro)?.nombre || "(sin rubro)";
      cd.rubros[rubroKey] = { nombre: rubroNombre, ing:0, egr:0 };
    }
    if (m.tipo === "INGRESO") { cd.ing += m.ingreso; cd.rubros[rubroKey].ing += m.ingreso; }
    else { cd.egr += m.egreso; cd.rubros[rubroKey].egr += m.egreso; }
  }
  const catItems = Object.entries(catMap)
    .map(([cat, v]) => ({ cat, ing:v.ing, egr:v.egr, rubros: Object.values(v.rubros).sort((a,b) => b.egr - a.egr) }))
    .filter(d => d.egr > 0 || d.ing > 0)
    .sort((a,b) => b.egr - a.egr);

  // Table — fila de categoría clickeable, expande el detalle por rubro debajo
  const tableRows = catItems.map(d => {
    const neto = d.ing - d.egr;
    const isExp = catResExpandido.has(d.cat);
    const detalleHtml = isExp ? d.rubros.map(r => {
      const rn = r.ing - r.egr;
      return `<tr class="sum-table-detail-row">
        <td style="padding-left:22px;font-size:11px;color:var(--text3)">${esc(r.nombre)}</td>
        <td class="ing" style="font-size:11px">${r.ing?fmt(r.ing):""}</td>
        <td class="egr" style="font-size:11px">${r.egr?fmt(r.egr):""}</td>
        <td class="net ${rn>=0?"":"egr"}" style="font-size:11px">${rn>=0?"+":"−"}${fmt(rn)}</td>
      </tr>`;
    }).join("") : "";
    return `<tr class="sum-table-row-toggle" onclick="toggleCatRes('${esc(escJs(d.cat))}')">
      <td>${isExp?"▾":"▸"} ${esc(d.cat)}</td>
      <td class="ing">${d.ing?fmt(d.ing):""}</td>
      <td class="egr">${d.egr?fmt(d.egr):""}</td>
      <td class="net ${neto>=0?"":"egr"}">${neto>=0?"+":"−"}${fmt(neto)}</td>
    </tr>${detalleHtml}`;
  }).join("");

  // Adherentes del mes — mismo criterio que Resumen > Adherentes (calcPendientesMesActual),
  // pero para el mes seleccionado en pantalla (sharedMes) en vez del mes real en curso
  const pendAdh = calcPendientesEnMes(sharedMes);
  const adhPendientesHtml = pendAdh.pendientes.map(nombre => `<div class="adh-item-res">
      <span class="nombre">${esc(nombre)}</span>
      <span class="adh-estado pendiente">PENDIENTE</span>
    </div>`).join("");

  // Top 10 jugadores/CT por monto neto (egresos - ingresos) en el mes
  const jugMontoMes = {};
  for (const m of movMes) {
    if (m.jugadorCT) {
      if (!jugMontoMes[m.jugadorCT]) jugMontoMes[m.jugadorCT] = { egr: 0, ing: 0 };
      if (m.tipo === "EGRESO")  jugMontoMes[m.jugadorCT].egr += m.egreso;
      if (m.tipo === "INGRESO") jugMontoMes[m.jugadorCT].ing += m.ingreso;
    }
  }
  const top10Jug = Object.entries(jugMontoMes)
    .map(([nombre, v]) => [nombre, v.egr - v.ing])
    .filter(([, neto]) => neto !== 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 10);
  const totalJugMes = top10Jug.reduce((s,[,v]) => s + v, 0);
  const avgJugMes   = top10Jug.length ? totalJugMes / top10Jug.length : 0;

  // Promedio mensual histórico por jugador/CT (monto neto)
  function avgMensualJug(nombre) {
    const mesMap = {};
    for (const m of movimientos) {
      if (m.jugadorCT === nombre) {
        const k = mesFromRecord(m);
        if (!mesMap[k]) mesMap[k] = { egr: 0, ing: 0 };
        if (m.tipo === "EGRESO")  mesMap[k].egr += m.egreso;
        if (m.tipo === "INGRESO") mesMap[k].ing += m.ingreso;
      }
    }
    const vals = Object.values(mesMap).map(v => v.egr - v.ing).filter(n => n !== 0);
    return vals.length ? vals.reduce((s,v) => s + v, 0) / vals.length : 0;
  }
  const jugTableRows = top10Jug.map(([nombre, neto], i) => {
    const avg = avgMensualJug(nombre);
    const clsNeto = neto < 0 ? "ing" : "egr";
    const clsAvg  = avg  < 0 ? "ing" : "egr";
    return `<tr>
      <td>${i+1}. ${esc(nombre)}</td>
      <td class="${clsNeto}">${neto < 0 ? "-" : ""}${fmt(neto)}</td>
      <td class="${clsAvg}" style="opacity:.7">${avg < 0 ? "-" : ""}${fmt(avg)}</td>
    </tr>`;
  }).join("");

  // Saldo cuentas html
  const ajustesPorCuenta = {};
  for (const m of movimientos) {
    if (m.tipo === "AJUSTE") {
      if (!ajustesPorCuenta[m.cuenta] || m.fecha > ajustesPorCuenta[m.cuenta].fecha) {
        ajustesPorCuenta[m.cuenta] = m;
      }
    }
  }
  const cuentasHtml = cuentas.map(c => {
    const s  = saldosCuentas[c] || 0;
    const aj = ajustesPorCuenta[c];
    const ajHtml = aj ? `<span class="cuenta-adj-note">
      ⊙ últ. ajuste ${aj.fecha.slice(8)+"/"+aj.fecha.slice(5,7)} ${aj.montoFinal>=0?"+":""}${fmt(aj.montoFinal)}</span>` : "";
    return `<div class="cuenta-item cuenta-item-kpi">
      <div class="cuenta-item-row">
        <span class="cuenta-nombre">${esc(c)}</span>
        <span class="cuenta-saldo ${s>0?"pos":s<0?"neg":"zer"}">${s<0?"-":""}${fmt(s)}</span>
      </div>
      ${ajHtml}
    </div>`;
  }).join("");

  // Reintegros médicos — total pendiente global (todos los años) para el badge de alerta
  const reintegrosGlobal = calcReintegrosPorJugador("");
  const pendienteGlobal  = reintegrosGlobal.reduce((s,r) => s + Math.max(r.pendiente,0), 0);

  // Adherentes — total adeudado del año actual para el badge de alerta
  const adherentesGlobal = calcAdherentesPorAnio(String(new Date().getFullYear()));
  const adherentePendienteGlobal = adherentesGlobal
    .filter(r => r.compromisoAnual > 0 && r.diferencia < 0)
    .reduce((s,r) => s + Math.abs(r.diferencia), 0);

  const subTabsHtml = `
    <div class="entity-tabs entity-tabs--wrap">
      <button class="entity-tab ${resumenSubTab==='mensual'?'active':''}"    onclick="setResumenSubTab('mensual')">Mensual</button>
      <button class="entity-tab ${resumenSubTab==='reportes'?'active':''}"   onclick="setResumenSubTab('reportes')">Reportes</button>
      <button class="entity-tab ${resumenSubTab==='partido'?'active':''}"    onclick="setResumenSubTab('partido')">Por Partido</button>
      <button class="entity-tab ${resumenSubTab==='reintegros'?'active':''}" onclick="setResumenSubTab('reintegros')">Reintegros${pendienteGlobal>0?" 🏥":""}</button>
      <button class="entity-tab ${resumenSubTab==='adherentes'?'active':''}" onclick="setResumenSubTab('adherentes')">Adherentes${adherentePendienteGlobal>0?" 👥":""}</button>
      <button class="entity-tab ${resumenSubTab==='jugadoresRes'?'active':''}" onclick="setResumenSubTab('jugadoresRes')">Jugadores</button>
      <button class="entity-tab ${resumenSubTab==='eventosRes'?'active':''}" onclick="setResumenSubTab('eventosRes')">Eventos</button>
      <button class="entity-tab ${resumenSubTab==='patrimonio'?'active':''}" onclick="setResumenSubTab('patrimonio')">Patrimonio</button>
    </div>`;

  const alertHtml = (pendienteGlobal > 0 && resumenSubTab !== "reintegros") ? `
    <div class="reintegro-alert" onclick="setResumenSubTab('reintegros')">
      🏥 ${fmt(pendienteGlobal)} pendientes de reintegro
    </div>` : "";

  const adherenteAlertHtml = (adherentePendienteGlobal > 0 && resumenSubTab !== "adherentes") ? `
    <div class="adherente-alert" onclick="setResumenSubTab('adherentes')">
      👥 ${fmt(adherentePendienteGlobal)} pendientes de adherentes
    </div>` : "";

  setContent(`
    <div class="resumen-top-row">
      ${subTabsHtml}
      <div class="resumen-alerts">${alertHtml}${adherenteAlertHtml}</div>
    </div>
    ${resumenSubTab === "mensual" ? `
    <div class="resumen-kpi-row">
      <div class="mes-sel">
        <button class="mes-sel-btn" onclick="changeMes(-1)">◀</button>
        <span class="mes-sel-label">${mesLabel(sharedMes)}</span>
        <button class="mes-sel-btn" onclick="changeMes(1)">▶</button>
      </div>

      <div class="sum-grid three">
        <div class="stat-card">
          <div class="stat-label">Ingresos mes</div>
          <div class="stat-val ing">${fmt(ingMes)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Egresos mes</div>
          <div class="stat-val egr">${fmt(egrMes)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Saldo mes</div>
          <div class="stat-val ${saldoMes>=0?"ing":"egr"}">${saldoMes<0?"-":""}${fmt(saldoMes)}</div>
        </div>
      </div>

      <div class="stat-card resumen-kpi-acc" style="margin-bottom:14px">
        <div class="stat-label">Saldo acumulado hasta ${mesLabel(sharedMes)}</div>
        <div class="stat-val acc" style="font-size:22px">${saldoAcc<0?"-":""}${fmt(saldoAcc)}</div>
      </div>
    </div>

    <div class="resumen-2col">
      <div>
        <div class="sec-hdr"><span class="sec-title">Saldo por cuenta</span></div>
        <div class="cuenta-list">${cuentasHtml || '<p class="note">Sin cuentas configuradas</p>'}</div>

        <div class="sec-hdr">
          <span class="sec-title">Adherentes — ${mesLabel(sharedMes)}</span>
        </div>
        ${!pendAdh.totalCount ? `<p class="note">Sin adherentes registrados</p>` :
          !pendAdh.pendientes.length ? `
          <button class="reint-aldia-toggle" style="cursor:default">
            ${pendAdh.pagadosCount}/${pendAdh.totalCount} pagados — Todos al día ✓
          </button>` : `
          <button class="reint-aldia-toggle" onclick="toggleAdhResumenOpen()">
            ${pendAdh.pagadosCount}/${pendAdh.totalCount} pagados — ${pendAdh.pendientes.length} pendientes ${adhResumenOpen?"▲":"▼"}
          </button>
          ${adhResumenOpen ? `<div class="adh-resumen">${adhPendientesHtml}</div>` : ""}`
        }
      </div>

      <div>

// ── Reportes: tabla jerárquica Categoría → Rubro → Movimiento, con filtros
// combinables (meses multi-selección, cuentas multi-selección, jugador/CT,
// adherente, búsqueda libre). Estado persistente en reportesState. ──────

// Movimientos filtrados por todos los criterios de reportesState (AND entre sí).
// meses/cuentas vacíos = sin filtro (todos). Solo INGRESO/EGRESO entran en la agregación
// por categoría/rubro (mismo criterio que la tabla por categoría de Mensual).
function getMovimientosReportes() {
  return movimientos
    .filter(m => m.tipo === "INGRESO" || m.tipo === "EGRESO")
    .filter(m => !reportesState.meses.length  || reportesState.meses.includes(mesFromRecord(m)))
    .filter(m => !reportesState.cuentas.length || reportesState.cuentas.includes(m.cuenta))
    .filter(m => !reportesState.categoria || m.categoria === reportesState.categoria)
    .filter(m => !reportesState.rubroCod  || m.codRubro === reportesState.rubroCod)
    .filter(m => !reportesState.jugadorCT || normStr(m.jugadorCT).includes(normStr(reportesState.jugadorCT)))
    .filter(m => !reportesState.adherente || normStr(m.adherente).includes(normStr(reportesState.adherente)))
    .filter(m => {
      const q = normStr(reportesState.search);
      return !q || normStr(m.concepto).includes(q) || normStr(m.observacion).includes(q);
    });
}

// Agrupa movimientos ya filtrados en Categoría → Rubro → lista de movimientos.
function buildReportesJerarquia(movs) {
  const catMap = {};
  for (const m of movs) {
    const cat = m.categoria || "(sin categoría)";
    if (!catMap[cat]) catMap[cat] = { ing:0, egr:0, count:0, rubros:{} };
    const cd = catMap[cat];
    cd.count++;
    const rubroKey = m.codRubro || m.rubro || "(sin rubro)";
    if (!cd.rubros[rubroKey]) {
      const rubroNombre = m.rubro || RUBROS.find(r => r.cod === m.codRubro)?.nombre || "(sin rubro)";
      cd.rubros[rubroKey] = { nombre: rubroNombre, ing:0, egr:0, count:0, movs:[] };
    }
    const rd = cd.rubros[rubroKey];
    rd.count++;
    rd.movs.push(m);
    if (m.tipo === "INGRESO") { cd.ing += m.ingreso; rd.ing += m.ingreso; }
    else { cd.egr += m.egreso; rd.egr += m.egreso; }
  }
  return Object.entries(catMap)
    .map(([cat, v]) => ({
      cat, ing: v.ing, egr: v.egr, count: v.count,
      rubros: Object.entries(v.rubros).map(([key, r]) => ({ key, ...r })).sort((a,b) => b.egr - a.egr),
    }))
    .sort((a,b) => b.egr - a.egr);
}

function renderReportesBody() {
  const movs = getMovimientosReportes();
  if (!movs.length) {
    return `<p class="note">Sin movimientos para estos filtros</p>`;
  }

  const jerarquia = buildReportesJerarquia(movs);
  const totIng = movs.filter(m => m.tipo === "INGRESO").reduce((s,m) => s+m.ingreso, 0);
  const totEgr = movs.filter(m => m.tipo === "EGRESO" ).reduce((s,m) => s+m.egreso,  0);
  const totNeto = totIng - totEgr;

  const rows = jerarquia.map(cat => {
    const catNeto = cat.ing - cat.egr;
    const catExp  = reportesState.catExpandido.has(cat.cat);
    let rubroRows = "";
    if (catExp) {
      rubroRows = cat.rubros.map(r => {
        const rKey  = cat.cat + "||" + r.key;
        const rExp  = reportesState.rubroExpandido.has(rKey);
        const rNeto = r.ing - r.egr;
        let movRows = "";
        if (rExp) {
          const sortedMovs = [...r.movs].sort((a,b) => b.fecha.localeCompare(a.fecha));
          movRows = `<tr class="sum-table-detail-row"><td colspan="4" style="padding:0">
            <table class="sum-table" style="margin:0 0 0 20px;width:calc(100% - 20px)">
              <thead><tr><th>Fecha</th><th>Concepto</th><th style="text-align:right">Monto</th><th>Cuenta</th></tr></thead>
              <tbody>${sortedMovs.map(m => {
                const fechaD = m.fecha ? m.fecha.slice(8,10)+"/"+m.fecha.slice(5,7)+"/"+m.fecha.slice(0,4) : "";
                const montoClass = m.tipo === "INGRESO" ? "ing" : "egr";
                const montoVal   = m.tipo === "INGRESO" ? m.ingreso : m.egreso;
                const montoSign  = m.tipo === "INGRESO" ? "+" : "−";
                return `<tr>
                  <td style="font-size:11px">${esc(fechaD)}</td>
                  <td style="font-size:11px">${esc(m.concepto) || '<span style="color:var(--text3)">Sin concepto</span>'}</td>
                  <td class="${montoClass}" style="font-size:11px">${montoSign}${fmt(montoVal)}</td>
                  <td style="font-size:11px">${esc(m.cuenta)}</td>
                </tr>`;
              }).join("")}</tbody>
            </table>
          </td></tr>`;
        }
        return `<tr class="sum-table-row-toggle" onclick="toggleReportesRubro('${esc(escJs(rKey))}')">
          <td style="padding-left:20px">${rExp?"▾":"▸"} ${esc(r.nombre)} <span class="note" style="font-size:10px">(${r.count})</span></td>
          <td class="ing">${r.ing?fmt(r.ing):""}</td>
          <td class="egr">${r.egr?fmt(r.egr):""}</td>
          <td class="net ${rNeto>=0?"":"egr"}">${rNeto>=0?"+":"−"}${fmt(rNeto)}</td>
        </tr>${movRows}`;
      }).join("");
    }
    return `<tr class="sum-table-row-toggle" onclick="toggleReportesCat('${esc(escJs(cat.cat))}')">
      <td>${catExp?"▾":"▸"} ${esc(cat.cat)} <span class="note" style="font-size:10px">(${cat.count})</span></td>
      <td class="ing">${cat.ing?fmt(cat.ing):""}</td>
      <td class="egr">${cat.egr?fmt(cat.egr):""}</td>
      <td class="net ${catNeto>=0?"":"egr"}">${catNeto>=0?"+":"−"}${fmt(catNeto)}</td>
    </tr>${rubroRows}`;
  }).join("");

  const totRow = `<tr style="font-weight:600">
    <td>TOTAL PERÍODO FILTRADO</td>
    <td class="ing">${fmt(totIng)}</td>
    <td class="egr">${fmt(totEgr)}</td>
    <td class="net ${totNeto>=0?"":"egr"}">${totNeto>=0?"+":"−"}${fmt(totNeto)}</td>
  </tr>`;

  return `
    <p class="note" style="margin-bottom:8px">${movs.length} movimiento${movs.length!==1?"s":""}</p>
    <table class="sum-table">
      <thead><tr><th>Categoría / Rubro</th><th style="text-align:right">Ing.</th><th style="text-align:right">Egr.</th><th style="text-align:right">Neto</th></tr></thead>
      <tbody>${rows}${totRow}</tbody>
    </table>`;
}

function changeReportesAnio(delta) {
  reportesState.anio = String(Number(reportesState.anio) + delta);
  renderResumen();
}

function toggleReportesMes(mes) {
  const i = reportesState.meses.indexOf(mes);
  if (i === -1) reportesState.meses.push(mes); else reportesState.meses.splice(i, 1);
  renderResumen();
}

function toggleReportesAnioCompleto() {
  const mesesAnio = Array.from({length:12}, (_,i) => reportesState.anio + "-" + String(i+1).padStart(2,"0"));
  const todosSel = mesesAnio.every(m => reportesState.meses.includes(m));
  if (todosSel) {
    reportesState.meses = reportesState.meses.filter(m => !mesesAnio.includes(m));
  } else {
    for (const m of mesesAnio) if (!reportesState.meses.includes(m)) reportesState.meses.push(m);
  }
  renderResumen();
}

function toggleReportesCuenta(c) {
  const i = reportesState.cuentas.indexOf(c);
  if (i === -1) reportesState.cuentas.push(c); else reportesState.cuentas.splice(i, 1);
  renderResumen();
}

function setReportesCategoria(v) {
  reportesState.categoria = v;
  reportesState.rubroCod = ""; // el rubro elegido puede no pertenecer a la nueva categoría
  renderResumen();
}

function setReportesRubro(v) {
  reportesState.rubroCod = v;
  renderResumen();
}

function toggleReportesCat(cat) {
  if (reportesState.catExpandido.has(cat)) reportesState.catExpandido.delete(cat);
  else reportesState.catExpandido.add(cat);
  renderResumen();
}

function toggleReportesRubro(key) {
  if (reportesState.rubroExpandido.has(key)) reportesState.rubroExpandido.delete(key);
  else reportesState.rubroExpandido.add(key);
  renderResumen();
}

// Exporta exactamente la jerarquía Categoría → Rubro → Movimiento visible en pantalla,
// ya filtrada por reportesState (meses/cuentas/jugador/adherente/búsqueda).
function exportReportesExcel() {
  if (typeof XLSX === "undefined") { toast("SheetJS no cargó", "err"); return; }
  const movs = getMovimientosReportes();
  if (!movs.length) { toast("No hay movimientos para exportar con estos filtros", "err"); return; }

  const jerarquia = buildReportesJerarquia(movs);
  const headers = ["Categoría","Rubro","Fecha","Concepto","Ingreso","Egreso","Cuenta"];
  const rows = [];
  let totIng = 0, totEgr = 0;
  for (const cat of jerarquia) {
    rows.push([cat.cat, "", "", "", cat.ing || "", cat.egr || "", ""]);
    for (const r of cat.rubros) {
      rows.push(["", r.nombre, "", "", r.ing || "", r.egr || "", ""]);
      const sorted = [...r.movs].sort((a,b) => a.fecha.localeCompare(b.fecha));
      for (const m of sorted) {
        rows.push(["", "", m.fecha, m.concepto || "",
          m.tipo==="INGRESO" ? m.ingreso : "", m.tipo==="EGRESO" ? m.egreso : "", m.cuenta || ""]);
      }
    }
    totIng += cat.ing; totEgr += cat.egr;
  }
  rows.push(["TOTAL PERÍODO FILTRADO", "", "", "", totIng, totEgr, ""]);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws["!cols"] = [26,26,10,30,12,12,16].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws, "Reportes");
  XLSX.writeFile(wb, `tesoreria_reportes_${today()}.xlsx`);
  toast("Excel exportado ✓", "ok");
}

// ── Patrimonio: saldo de cuentas + valor de granos en stock ──────
function renderPatrimonio() {
  const saldos = calcSaldosCuentas(movimientos);
  const totalCuentas = Object.values(saldos).reduce((s,v) => s+v, 0);
  const valorGranos = valorTotalGranos();
  const patrimonioTotal = totalCuentas + valorGranos;

  const cuentasHtml = cuentas.map(c => {
    const s = saldos[c] || 0;
    return `<div class="cuenta-item">
      <span class="cuenta-nombre">${esc(c)}</span>
      <span class="cuenta-saldo ${s>0?"pos":s<0?"neg":"zer"}">${s<0?"-":""}${fmt(s)}</span>
    </div>`;
  }).join("");

  // ⚠️ Diagnóstico: cuentas "huérfanas" — nombres de cuenta usados en movimientos
  // que no coinciden con ninguna de la lista configurada (`cuentas`). Su saldo
  // entra en totalCuentas pero no se ve en la lista de arriba, lo que puede
  // explicar por qué la suma visible no coincide con el total mostrado.
  const cuentasConocidas = new Set(cuentas);
  const huerfanas = Object.keys(saldos).filter(k => !cuentasConocidas.has(k) && saldos[k] !== 0);
  const huerfanasHtml = huerfanas.length ? `
    <div class="cfg-title" style="margin:14px 0 8px;color:var(--red)">⚠️ Cuentas no reconocidas</div>
    <p class="note" style="margin-bottom:8px">
      Estos nombres de cuenta aparecen en movimientos pero no están en la lista de cuentas
      configurada. Su saldo se suma al total de Patrimonio aunque no se muestra en "Cuentas".
      Revisá esos movimientos (puede ser un typo, una cuenta renombrada o eliminada).
    </p>
    ${huerfanas.map(k => {
      const s = saldos[k] || 0;
      const movsCount = movimientos.filter(m => m.cuenta === k || m.cuentaDestino === k).length;
      return `<div class="cuenta-item">
        <span class="cuenta-nombre">${esc(k || "(vacío)")} <span class="note" style="font-size:11px">(${movsCount} mov.)</span></span>
        <span class="cuenta-saldo ${s>0?"pos":s<0?"neg":"zer"}">${s<0?"-":""}${fmt(s)}</span>
      </div>`;
    }).join("")}
  ` : "";

  const stock = calcStockGranos();
  const granosHtml = Object.keys(stock).sort().map(g => {
    const kg = stock[g] || 0;
    const valor = (kg/1000) * (preciosGranos[g]||0);
    return `<div class="cuenta-item">
      <span class="cuenta-nombre">${esc(g)} (${fmt(kg)} kg)</span>
      <span class="cuenta-saldo pos">${fmt(valor)}</span>
    </div>`;
  }).join("");

  return `
    <div class="sum-grid three">
      <div class="stat-card">
        <div class="stat-label">Cuentas</div>
        <div class="stat-val ${totalCuentas>=0?"ing":"egr"}">${fmt(totalCuentas)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Granos</div>
        <div class="stat-val ing">${fmt(valorGranos)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Patrimonio total</div>
        <div class="stat-val ${patrimonioTotal>=0?"ing":"egr"}">${fmt(patrimonioTotal)}</div>
      </div>
    </div>
    <div class="cfg-title" style="margin:14px 0 8px">🏦 Cuentas</div>
    ${cuentasHtml}
    ${huerfanasHtml}
    <div class="cfg-title" style="margin:14px 0 8px">🌾 Granos en stock</div>
    ${granosHtml || '<p class="note">Sin stock registrado</p>'}
  `;
}

function calcSaldosCuentas(movs) {
  const saldos = {};
  for (const c of cuentas) saldos[c] = 0;
  for (const m of movs) {
    if (m.tipo === "INGRESO") {
      saldos[m.cuenta] = (saldos[m.cuenta] || 0) + m.ingreso;
    } else if (m.tipo === "EGRESO") {
      saldos[m.cuenta] = (saldos[m.cuenta] || 0) - m.egreso;
    } else if (m.tipo === "INTERNO") {
      saldos[m.cuenta]        = (saldos[m.cuenta]        || 0) - m.montoFinal;
      saldos[m.cuentaDestino] = (saldos[m.cuentaDestino] || 0) + m.montoFinal;
    } else if (m.tipo === "AJUSTE") {
      saldos[m.cuenta] = (saldos[m.cuenta] || 0) + m.montoFinal;
    }
  }
  return saldos;
}

// Recorre TODOS los ingresos de rubro médico (sin filtrar por año — un reintegro puede
// llegar en un año distinto al del gasto) y arma cuánto quedó vinculado a cada egreso,
// y cuánto de cada ingreso todavía no se asignó a ningún egreso.
function buildVinculosIndex() {
  const porEgreso  = {}; // egresoId -> monto total vinculado desde ingresos
  const porIngreso = {}; // ingresoId -> monto total ya asignado a egresos
  for (const m of movimientos) {
    if (m.codRubro !== "21" || m.tipo !== "INGRESO" || !m.vinculos || !m.vinculos.length) continue;
    let asignado = 0;
    for (const v of m.vinculos) {
      const monto = Number(v.monto) || 0;
      asignado += monto;
      porEgreso[v.egresoId] = (porEgreso[v.egresoId] || 0) + monto;
    }
    porIngreso[m.id] = asignado;
  }
  return { porEgreso, porIngreso };
}

const TOL = 1; // tolerancia de redondeo en pesos

// anio: string "YYYY" para filtrar los EGRESOS mostrados, o "" para todos los años.
// Los vínculos se calculan siempre contra el historial completo (buildVinculosIndex),
// porque un reintegro puede llegar meses después y en otro año que el gasto original.
function calcReintegrosPorJugador(anio) {
  const { porEgreso, porIngreso } = buildVinculosIndex();
  const movs21 = movimientos.filter(m => m.codRubro === "21" && (m.tipo === "EGRESO" || m.tipo === "INGRESO"));
  const map = {};
  const getBucket = (key) => {
    if (!map[key]) map[key] = { jugador: key, abonado: 0, sinReintegro: 0, reintegrado: 0, diferencia: 0, pendiente: 0, sinVincular: 0, movs: [], egresosDetalle: [], ingresosSinVincular: [] };
    return map[key];
  };
  for (const m of movs21) {
    if (m.tipo === "EGRESO" && (!anio || m.fecha.slice(0,4) === anio)) {
      const key = m.jugadorCT || "Sin jugador";
      const b = getBucket(key);
      b.abonado += m.egreso;
      b.movs.push(m);
      if (!m.seguroReintegro) { b.sinReintegro += m.egreso; continue; }
      const vinculado = porEgreso[m.id] || 0;
      const pendienteRaw = m.egreso - vinculado;
      let estado;
      if (Math.abs(pendienteRaw) <= TOL) { estado = "OK"; }
      else if (pendienteRaw < 0) { estado = "SALDO_FAVOR"; b.diferencia += Math.abs(pendienteRaw); }
      else { estado = vinculado > 0 ? "PARCIAL" : "SIN"; b.pendiente += pendienteRaw; }
      // Reintegrado = toda la plata que efectivamente volvió (incluye el excedente cuando el
      // reintegro fue mayor a lo abonado) — no se limita al monto del egreso.
      b.reintegrado += vinculado;
      b.egresosDetalle.push({ ...m, vinculado, pendiente: Math.max(pendienteRaw,0), estadoVinculo: estado });
    } else if (m.tipo === "INGRESO") {
      // Los ingresos entran en el balance del jugador aunque hayan sido cargados en otro año,
      // así el jugador no "pierde" el reintegro solo porque cambió el año en pantalla.
      const key = m.jugadorCT || "Sin jugador";
      const b = getBucket(key);
      b.movs.push(m);
      const asignado   = porIngreso[m.id] || 0;
      const disponible = m.ingreso - asignado;
      if (disponible > TOL) {
        b.sinVincular += disponible;
        b.ingresosSinVincular.push({ ...m, disponible });
      }
    }
  }
  return Object.values(map).map(r => {
    const pendiente = Math.round(r.pendiente) === 0 ? 0 : r.pendiente;
    const estado = pendiente > 0
      ? (r.reintegrado > 0 ? "PARCIAL" : "SIN")
      : (r.diferencia > TOL || r.sinVincular > TOL ? "DIF" : "OK");
    return { ...r, pendiente, estado };
  // Pendiente más grande primero. Los que ya están en $0 quedan al final (aunque tengan
  // saldo a favor o ingresos sin vincular, eso se ve aparte, no hace subir el orden).
  }).sort((a,b) => b.pendiente - a.pendiente || (b.sinVincular||0) - (a.sinVincular||0));
}

function renderReintegrosMedicos() {
  const movs21All = movimientos.filter(m => m.codRubro === "21" && (m.tipo === "EGRESO" || m.tipo === "INGRESO"));
  const anios = [...new Set(movs21All.map(m => m.fecha.slice(0,4)))].filter(Boolean).sort().reverse();
  if (reintegroAnio !== "" && !anios.includes(reintegroAnio)) {
    reintegroAnio = anios[0] || String(new Date().getFullYear());
  }

  const rows = calcReintegrosPorJugador(reintegroAnio);

  const anioOptions = `<option value="" ${reintegroAnio===""?"selected":""}>Todos los años</option>` +
    anios.map(a => `<option value="${a}" ${reintegroAnio===a?"selected":""}>${a}</option>`).join("");

  const viewToggle = `
    <div class="reint-view-toggle">
      <button class="reint-view-btn ${reintegroVista==='tabla'?'active':''}" onclick="setReintegroVista('tabla')">⊞ Tabla</button>
      <button class="reint-view-btn ${reintegroVista==='cards'?'active':''}" onclick="setReintegroVista('cards')">▤ Cards</button>
    </div>`;

  const body = !rows.length
    ? `<p class="note" style="text-align:center;padding:16px 0">Sin movimientos de rubro médico</p>`
    : reintegroVista === "cards" ? renderReintegrosCards(rows) : renderReintegrosTabla(rows);

  return `
    <div class="reint-section">
      <button class="btn-secondary" style="margin-bottom:8px" onclick="openVincularReintegros('')">🔗 Vincular reintegros con sus egresos</button>
      <button class="btn-export" style="margin-bottom:12px" onclick="exportarPendientesReintegro()">📥 Exportar pendientes de reintegro</button>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:150px">
          <label style="font-size:11px;color:var(--text3);white-space:nowrap">Año:</label>
          <select class="inp" style="flex:1" onchange="setReintegroAnio(this.value)">${anioOptions}</select>

    </div>`;
}

function estadoCorto(estado, diferencia, sinVincular) {
  if (estado === "DIF") {
    const partes = [];
    if (diferencia > TOL)   partes.push("saldo a favor " + fmt(diferencia));
    if (sinVincular > TOL)  partes.push(fmt(sinVincular) + " sin vincular");
    return "🔵 " + (partes.join(" · ") || "Diferencia");
  }
  return estado==="OK"      ? "✅ OK"
    : estado==="PARCIAL" ? "⚠️ Parcial"
    : "🔴 Pendiente";
}

  const conPendiente = rows.filter(r => r.pendiente > 0).sort((a,b) => b.pendiente - a.pendiente);
  const sinPendiente  = rows.filter(r => r.pendiente <= 0);

    ${alDiaOpen ? `<div style="opacity:.55">${sinPendiente.map(renderReintegroCard).join("")}</div>` : ""}` : "";

}

// Agrupa los movimientos de un jugador en "grupos vinculados": cada grupo es un conjunto
// de egresos + ingresos conectados entre sí por vinculos (unión de componentes conexas).
// Un egreso o ingreso sin ningún vínculo queda solo en su propio grupo — eso es justamente
// lo que se ve vacío del otro lado en la vista de dos columnas.
function buildGruposVinculo(r) {
  const egresosBase = r.movs.filter(m => m.tipo === "EGRESO" && m.seguroReintegro);
  const ingresos    = r.movs.filter(m => m.tipo === "INGRESO");
  const egresosMap  = {}; // id -> movimiento (incluye egresos "externos" traídos por un vínculo, ej. de otro año)
  for (const e of egresosBase) egresosMap[e.id] = e;

  const parent = {};
  const find = id => { while (parent[id] !== id) id = parent[id]; return id; };
  const union = (a,b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
  for (const e of egresosBase) parent[e.id] = e.id;
  for (const i of ingresos) {
    parent[i.id] = i.id;
    for (const v of (i.vinculos||[])) {
      if (!(v.egresoId in parent)) {
        const ext = movimientos.find(m => m.id === v.egresoId);
        if (ext) { parent[v.egresoId] = v.egresoId; egresosMap[v.egresoId] = ext; }
      }
      if (v.egresoId in parent) union(i.id, v.egresoId);
    }
  }

  const grupos = {};
  for (const id of Object.keys(egresosMap)) {
    const root = find(id);
    (grupos[root] = grupos[root] || { egresos: [], ingresos: [] }).egresos.push(egresosMap[id]);
  }
  for (const i of ingresos) {
    const root = find(i.id);
    (grupos[root] = grupos[root] || { egresos: [], ingresos: [] }).ingresos.push(i);
  }

  return Object.values(grupos).map(g => {
    const abonado   = g.egresos.reduce((s,e) => s + e.egreso, 0);
    const vinculado = g.ingresos.reduce((s,i) => s + (i.vinculos||[]).reduce((s2,v) => s2 + (Number(v.monto)||0), 0), 0);
    const diff = vinculado - abonado;
    let estado;
    if (!g.egresos.length)        estado = "SINASIGNAR"; // ingreso(s) sin ningún egreso vinculado
    else if (!g.ingresos.length)  estado = "SIN";          // egreso sin ningún reintegro
    else if (Math.abs(diff) <= TOL) estado = "OK";
    else if (diff < 0)            estado = "PARCIAL";
    else                          estado = "FAVOR";
    const fechaOrden = [...g.egresos, ...g.ingresos].map(m => m.fecha).sort()[0] || "";
    return { ...g, abonado, vinculado, diff, estado, fechaOrden };
  }).sort((a,b) => a.fechaOrden.localeCompare(b.fechaOrden));
}

function renderMovGrupoRow(m, tipo, tieneVinculo) {
  const fechaD = m.fecha ? m.fecha.slice(8)+"/"+m.fecha.slice(5,7) : "";
  const montoVal = tipo === "INGRESO" ? m.ingreso : m.egreso;
  const montoCls = tipo === "INGRESO" ? "ing" : "egr";
  let nota = "";
  if (tipo === "INGRESO") {
    const asignado    = (m.vinculos||[]).reduce((s,v) => s + (Number(v.monto)||0), 0);
    const disponible  = m.ingreso - asignado;
    if (disponible > TOL) nota = `<div style="font-size:11px;color:var(--warn)">+ ${fmt(disponible)} sin asignar</div>`;
  }
  const btn = tieneVinculo
    ? `<button class="btn-sm" style="align-self:flex-start;margin-top:2px" onclick="verVinculosMovimiento('${m.id}')">Ver / cambiar vínculo</button>` : "";
  return `
    <div class="reint-grupo-mov">
      <div class="top"><span style="color:var(--text3)">${fechaD}</span><span class="${montoCls}">${fmt(montoVal)}</span></div>
      <div>${esc(m.concepto)||"—"}</div>
      ${nota}
      ${btn}
    </div>`;
}

function renderGrupoVinculo(g, porEgreso) {
  const claseEstado = {
    OK: "estado-ok", PARCIAL: "estado-parcial", SIN: "estado-sin",
    FAVOR: "estado-favor", SINASIGNAR: "estado-sinasignar"
  }[g.estado];

  const resumen = g.egresos.length && g.ingresos.length
    ? `Abonado ${fmt(g.abonado)} · Reintegrado ${fmt(g.vinculado)}` +
      (g.estado === "FAVOR" ? ` · saldo a favor ${fmt(g.diff)}` : g.estado === "PARCIAL" ? ` · falta ${fmt(-g.diff)}` : "")
    : g.egresos.length
      ? `Abonado ${fmt(g.abonado)} · sin reintegro`
      : `Reintegro ${fmt(g.ingresos.reduce((s,i) => s+i.ingreso, 0))} · sin egreso vinculado`;

  const egresosHtml = g.egresos.length
    ? g.egresos.map(e => renderMovGrupoRow(e, "EGRESO", (porEgreso[e.id]||0) > TOL)).join("")
    : `<div class="reint-grupo-col-empty">— sin egreso asociado —</div>`;
  const ingresosHtml = g.ingresos.length
    ? g.ingresos.map(i => renderMovGrupoRow(i, "INGRESO", (i.vinculos||[]).length > 0)).join("")
    : `<div class="reint-grupo-col-empty">— sin ingreso asociado —</div>`;

  return `
    <div class="reint-grupo ${claseEstado}">
      <div class="reint-grupo-header">${resumen}</div>
      <div class="reint-grupo-cols">
        <div class="reint-grupo-col">${egresosHtml}</div>
        <div class="reint-grupo-col">${ingresosHtml}</div>
      </div>
    </div>`;
}

function renderReintegroDetalle(r) {
  const { porEgreso } = buildVinculosIndex();
  const grupos = buildGruposVinculo(r);
  const gruposHtml = grupos.map(g => renderGrupoVinculo(g, porEgreso)).join("");

  // Gastos médicos que nunca se marcaron con reintegro de seguro (checkbox "Tiene reintegro
  // del seguro" destildado) — no participan de los vínculos, así que van aparte, en una sola
  // columna, sin la parte de "ingreso asociado" porque no corresponde que la tengan.
  const sinReintegro = r.movs
    .filter(m => m.tipo === "EGRESO" && !m.seguroReintegro)
    .sort((a,b) => a.fecha.localeCompare(b.fecha));
  const sinReintegroHtml = sinReintegro.length ? `
    <div class="reint-grupo estado-neutral">
      <div class="reint-grupo-header">Gastos médicos sin reintegro esperado</div>
      <div class="reint-grupo-col">
        ${sinReintegro.map(e => renderMovGrupoRow(e, "EGRESO", false)).join("")}
      </div>
    </div>` : "";

  return `
    <div style="padding:2px 0 4px">
      ${gruposHtml}
      ${sinReintegroHtml}
      <button class="btn-sm accent" style="margin-top:4px" onclick="event.stopPropagation(); openVincularReintegros('${esc(escJs(r.jugador))}')">🔗 Vincular movimientos de ${esc(r.jugador)}</button>
    </div>`;
}

// ── Ver / cambiar / desvincular el o los vínculos de un movimiento puntual ────
// Los vínculos siempre se guardan en el array `vinculos` del INGRESO (aunque se esté
// mirando desde un EGRESO), así que hay que buscar en ambos sentidos.
let vincDetalleMovId = null;

function verVinculosMovimiento(movId) {
  vincDetalleMovId = movId;
  renderVinculosMovimientoModal();
}

function paresVinculadosDe(movId) {
  const mov = movimientos.find(m => m.id === movId);
  if (!mov) return [];
  const pares = [];
  if (mov.tipo === "EGRESO") {
    for (const i of movimientos) {
      if (i.tipo !== "INGRESO" || !i.vinculos) continue;
      for (const v of i.vinculos) {
        if (v.egresoId === mov.id) pares.push({ ingresoId: i.id, ingreso: i, egresoId: mov.id, egreso: mov, monto: Number(v.monto)||0 });
      }
    }
  } else if (mov.tipo === "INGRESO") {
    for (const v of (mov.vinculos||[])) {
      pares.push({ ingresoId: mov.id, ingreso: mov, egresoId: v.egresoId, egreso: movimientos.find(m => m.id === v.egresoId), monto: Number(v.monto)||0 });
    }
  }
  return pares.sort((a,b) => (a.egreso?a.egreso.fecha:"").localeCompare(b.egreso?b.egreso.fecha:""));
}

function renderVinculosMovimientoModal() {
  const mov = movimientos.find(m => m.id === vincDetalleMovId);
  if (!mov) { closeModal(); return; }
  const pares = paresVinculadosDe(vincDetalleMovId);
  const rows = pares.map((p,i) => `
    <div class="entity-item" style="flex-direction:column;align-items:stretch;gap:8px">
      <div>
        <div class="entity-sub">Egreso: ${p.egreso ? fechaCorta(p.egreso.fecha)+" · "+esc(p.egreso.concepto||"—")+" (total "+fmt(p.egreso.egreso)+")" : "⚠️ no encontrado"}</div>
        <div class="entity-sub">Ingreso: ${fechaCorta(p.ingreso.fecha)} · ${esc(p.ingreso.concepto||"—")} (total ${fmt(p.ingreso.ingreso)})</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <label style="font-size:11px;color:var(--text3)">Monto vinculado</label>
        <input class="inp" type="number" style="width:130px" id="vinc-edit-${i}" value="${p.monto}">
        <button class="btn-sm accent" onclick="guardarEdicionVinculo(this, '${p.ingresoId}','${p.egresoId}', document.getElementById('vinc-edit-${i}').value)">Guardar</button>
        <button class="btn-sm danger" onclick="desvincularDesdeModal(this, '${p.ingresoId}','${p.egresoId}')">Desvincular</button>
      </div>
    </div>`).join("");

  setModalHtml(`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-card" onclick="event.stopPropagation()" style="max-width:640px">
        <div class="modal-handle"></div>
        <div class="modal-title">🔗 Vínculos de este movimiento</div>
        <p class="cfg-note" style="margin-bottom:10px">${esc(mov.jugadorCT||"Sin jugador")} · ${fechaCorta(mov.fecha)} · ${esc(mov.concepto)||"—"}</p>
        ${pares.length ? rows : '<p class="note">Este movimiento no tiene vínculos.</p>'}
        <div class="modal-footer">
          <button class="btn-secondary" style="flex:1" onclick="closeModal()">Cerrar</button>
        </div>
      </div>
    </div>`);
}

// Actualiza (o si nuevoMonto es null/0, elimina) la entrada de vinculo egresoId↔ingresoId.
// El array vinculos vive siempre en el movimiento de tipo INGRESO.
async function actualizarVinculoEntry(ingresoId, egresoId, nuevoMonto) {
  const ing = movimientos.find(m => m.id === ingresoId);
  if (!ing) return false;
  let vinculos = [...(ing.vinculos||[])];
  if (nuevoMonto == null || Number(nuevoMonto) <= TOL) {
    vinculos = vinculos.filter(v => v.egresoId !== egresoId);
  } else {
    const idx = vinculos.findIndex(v => v.egresoId === egresoId);
    if (idx >= 0) vinculos[idx] = { egresoId, monto: Number(nuevoMonto) };
    else vinculos.push({ egresoId, monto: Number(nuevoMonto) });
  }
  try {
    const r = await Storage.setVinculos(ingresoId, vinculos);
    if (!r.ok) throw new Error(r.error || "Error");
    ing.vinculos = vinculos;
    saveSnapshotToCache();
    return true;
  } catch(e) {
    toast(isNetworkError(e) ? "Sin conexión — no se pudo actualizar, probá de nuevo" : "Error: " + e.message, "err");
    return false;
  }
}

async function guardarEdicionVinculo(btn, ingresoId, egresoId, nuevoMonto) {
  if (btn.disabled) return; // evita doble envío
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = "Guardando…";
  const ok = await actualizarVinculoEntry(ingresoId, egresoId, Number(nuevoMonto));
  if (ok) {
    toast("Vínculo actualizado ✓", "ok");
    renderVinculosMovimientoModal(); // re-renderiza el modal entero con botones nuevos, ya habilitados
    if (currentTab === "resumen") renderResumen();
  } else {
    btn.disabled = false; btn.textContent = original;
  }
}

async function desvincularDesdeModal(btn, ingresoId, egresoId) {
  if (btn.disabled) return; // evita doble envío
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = "Desvinculando…";
  const ok = await actualizarVinculoEntry(ingresoId, egresoId, null);
  if (ok) {
    toast("Movimiento desvinculado", "ok");
    renderVinculosMovimientoModal();
    if (currentTab === "resumen") renderResumen();
  } else {
    btn.disabled = false; btn.textContent = original;
  }
}

// ── Vincular reintegros (ingresos) con sus egresos ────────────────
// jugadorFiltro: "" = todos los jugadores con movimientos de rubro médico.
function openVincularReintegros(jugadorFiltro) {
  vincJugadorFiltro = jugadorFiltro || "";
  vincExpandedIngresoId = null;
  vincAsignaciones = {};
  renderVincularModal();
}

function closeVincularModal() {
  document.getElementById("modal-root").innerHTML = "";
}

// Reemplaza el contenido de #modal-root preservando el scroll del modal actual —
// sin esto, cada vez que se re-renderiza (ej. al tildar un checkbox) el modal saltaba
// arriba del todo y había que volver a bajar. El elemento que scrollea puede ser el
// modal-card entero o, en los modales tipo "asociar" (asoc-list), un hijo interno.
const MODAL_SCROLL_SELECTOR = ".asoc-list, .modal-card";
function setModalHtml(html) {
  const root = document.getElementById("modal-root");
  const prevEl = root.querySelector(MODAL_SCROLL_SELECTOR);
  const prevScroll = prevEl?.scrollTop || 0;
  root.innerHTML = html;
  const nextEl = root.querySelector(MODAL_SCROLL_SELECTOR);
  if (nextEl) nextEl.scrollTop = prevScroll;
}

// Egresos con reintegro aún no cubierto e ingresos de reintegro aún no asignados a ningún
// egreso, opcionalmente filtrados a un jugador. Se recalcula siempre contra buildVinculosIndex()
// (todo el historial), no contra un año en particular.
function getPendientesYSinVincular(jugadorFiltro) {
  const { porEgreso, porIngreso } = buildVinculosIndex();
  const egresos = movimientos
    .filter(m => m.codRubro === "21" && m.tipo === "EGRESO" && m.seguroReintegro && (!jugadorFiltro || m.jugadorCT === jugadorFiltro))
    .map(m => ({ ...m, vinculado: porEgreso[m.id] || 0, pendiente: m.egreso - (porEgreso[m.id] || 0) }))
    .filter(m => m.pendiente > TOL)
    .sort((a,b) => a.fecha.localeCompare(b.fecha));
  const ingresos = movimientos
    .filter(m => m.codRubro === "21" && m.tipo === "INGRESO" && (!jugadorFiltro || m.jugadorCT === jugadorFiltro))
    .map(m => ({ ...m, asignado: porIngreso[m.id] || 0, disponible: m.ingreso - (porIngreso[m.id] || 0) }))
    .filter(m => m.disponible > TOL)
    .sort((a,b) => a.fecha.localeCompare(b.fecha));
  return { egresos, ingresos };
}

// Egresos pendientes del MISMO jugador que un ingreso dado (match exacto de jugadorCT,
// incluso si está vacío) — son los candidatos que se ofrecen al vincular ese ingreso.
function candidatosParaIngreso(ing) {
  const { porEgreso } = buildVinculosIndex();
  return movimientos
    .filter(m => m.codRubro === "21" && m.tipo === "EGRESO" && m.seguroReintegro && m.jugadorCT === ing.jugadorCT)
    .map(m => ({ ...m, vinculado: porEgreso[m.id] || 0, pendiente: m.egreso - (porEgreso[m.id] || 0) }))
    .filter(m => m.pendiente > TOL)
    .sort((a,b) => a.fecha.localeCompare(b.fecha));
}

function renderVincularModal() {
  const { egresos, ingresos } = getPendientesYSinVincular(vincJugadorFiltro);
  const jugadoresConMovs = [...new Set(movimientos.filter(m => m.codRubro === "21").map(m => m.jugadorCT || "Sin jugador"))].sort();
  const filtroOptions = `<option value="">Todos los jugadores</option>` +
    jugadoresConMovs.map(j => `<option value="${esc(j)}" ${vincJugadorFiltro===j?"selected":""}>${esc(j)}</option>`).join("");

  const ingresosHtml = ingresos.length
    ? ingresos.map(renderVincIngresoRow).join("")
    : `<p class="note" style="padding:8px 0">No hay ingresos de reintegro sin vincular${vincJugadorFiltro?` para ${esc(vincJugadorFiltro)}`:""}.</p>`;

  const egresosHtml = egresos.length
    ? egresos.map(e => `
      <div class="entity-item">
        <div style="flex:1;min-width:0">
          <span class="entity-name">${fechaCorta(e.fecha)} · ${esc(e.jugadorCT||"Sin jugador")}</span>
          <div class="entity-sub">${esc(e.concepto)||"—"} · Pendiente: ${fmt(e.pendiente)} de ${fmt(e.egreso)}</div>
        </div>
      </div>`).join("")
    : `<p class="note" style="padding:8px 0">Sin egresos pendientes de reintegro${vincJugadorFiltro?` para ${esc(vincJugadorFiltro)}`:""}.</p>`;

  setModalHtml(`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-card" onclick="event.stopPropagation()" style="max-width:900px">
        <div class="modal-handle"></div>
        <div class="modal-title">🔗 Vincular reintegros</div>
        <div class="field" style="margin-bottom:10px">
          <label>Jugador</label>
          <select class="inp" onchange="vincJugadorFiltro=this.value; vincExpandedIngresoId=null; vincAsignaciones={}; renderVincularModal()">${filtroOptions}</select>
        </div>
        <button class="btn-secondary" style="margin-bottom:12px" onclick="sugerirVinculosAutomaticos()">✨ Sugerir vínculos automáticos</button>
        <p class="cfg-note" style="margin-bottom:10px">Los montos de las listas de abajo son los reales (lo que falta cobrar de cada egreso, lo que falta asignar de cada ingreso). Al abrir un ingreso para vincularlo, el monto que aparece junto a cada egreso candidato es una <b>propuesta editable</b> — no se guarda nada hasta que tocás "Confirmar vínculo".</p>
        <div class="sec-hdr"><span class="sec-title">Ingresos sin vincular (${ingresos.length})</span></div>
        ${ingresosHtml}
        <div class="divider"></div>
        <div class="sec-hdr"><span class="sec-title">Egresos pendientes de reintegro (${egresos.length})</span></div>
        ${egresosHtml}

          <button class="btn-secondary" style="flex:1" onclick="closeVincularModal()">Cerrar</button>
        </div>
      </div>

}

function renderVincIngresoRow(ing) {
  const isExp = vincExpandedIngresoId === ing.id;
  let expandedHtml = "";
  if (isExp) {
    const candidatos = candidatosParaIngreso(ing);
    if (!candidatos.length) {
      expandedHtml = `<p class="note" style="padding:8px 0">No hay egresos pendientes de reintegro para ${esc(ing.jugadorCT||"Sin jugador")}.</p>`;
    } else {
      const rows = candidatos.map(e => {
        const checked = vincAsignaciones[e.id] != null;
        const monto = checked ? vincAsignaciones[e.id] : "";
        return `
        <div class="grupo-jug-item" style="justify-content:space-between" onclick="event.stopPropagation()">
          <label style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer">
            <input type="checkbox" ${checked?"checked":""} onchange="toggleVincAsignacion('${e.id}', ${e.pendiente})">
            <span style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${fechaCorta(e.fecha)} · ${esc(e.concepto)||"—"} (pendiente real ${fmt(e.pendiente)})</span>
          </label>
          ${checked ? `<input class="inp" type="number" style="width:110px" title="Monto propuesto, editable" value="${monto}" oninput="vincAsignaciones['${e.id}']=Number(this.value)||0">` : ""}
        </div>`;
      }).join("");
      const totalAsignado = Object.values(vincAsignaciones).reduce((s,v) => s + (Number(v)||0), 0);
      expandedHtml = `
        <div style="background:var(--bg3);border-radius:var(--rs);padding:10px;margin-top:6px" onclick="event.stopPropagation()">
          ${rows}
          <div style="margin-top:8px;font-size:12px;color:var(--text2)">A aplicar (propuesto, editable arriba): ${fmt(totalAsignado)} de ${fmt(ing.disponible)} disponibles</div>
          <button class="btn-main" style="margin-top:8px" id="btn-confirmar-vinculo" onclick="confirmarVinculo('${ing.id}')">Confirmar vínculo</button>
        </div>`;
    }
  }
  const yaAsignado = ing.ingreso - ing.disponible;
  return `
    <div class="entity-item" style="flex-direction:column;align-items:stretch;gap:4px;cursor:pointer" onclick="toggleVincIngreso('${ing.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="entity-name">${fechaCorta(ing.fecha)} · ${esc(ing.jugadorCT||"Sin jugador")}</span>
        <span class="monto ing">${fmt(ing.disponible)}</span>
      </div>
      <div class="entity-sub">${esc(ing.concepto)||"—"}${yaAsignado > TOL ? ` · ya asignado ${fmt(yaAsignado)}` : ""}</div>
      ${expandedHtml}
    </div>`;
}

function toggleVincIngreso(ingresoId) {
  if (vincExpandedIngresoId === ingresoId) {
    vincExpandedIngresoId = null;
    vincAsignaciones = {};
  } else {
    vincExpandedIngresoId = ingresoId;
    vincAsignaciones = {};
    const ing = movimientos.find(m => m.id === ingresoId);
    if (ing) {
      const { porIngreso } = buildVinculosIndex();
      let restante = ing.ingreso - (porIngreso[ing.id] || 0);
      // Autocompleta del egreso pendiente más viejo al más nuevo hasta agotar el disponible;
      // el usuario puede destildar o ajustar el monto de cada uno antes de confirmar.
      for (const e of candidatosParaIngreso(ing)) {
        if (restante <= TOL) break;
        const monto = Math.min(e.pendiente, restante);
        vincAsignaciones[e.id] = monto;
        restante -= monto;
      }
    }
  }
  renderVincularModal();
}

function toggleVincAsignacion(egresoId, pendienteDefault) {
  if (vincAsignaciones[egresoId] != null) delete vincAsignaciones[egresoId];
  else vincAsignaciones[egresoId] = pendienteDefault;
  renderVincularModal();
}

async function confirmarVinculo(ingresoId) {
  const btnId = "btn-confirmar-vinculo";
  if (document.getElementById(btnId)?.disabled) return; // evita doble envío
  const ing = movimientos.find(m => m.id === ingresoId);
  if (!ing) return;
  const nuevas = Object.entries(vincAsignaciones)
    .filter(([,monto]) => Number(monto) > TOL)
    .map(([egresoId,monto]) => ({ egresoId, monto: Number(monto) }));
  if (!nuevas.length) { toast("Seleccioná al menos un egreso y un monto", "err"); return; }
  const { porIngreso } = buildVinculosIndex();
  const disponible = ing.ingreso - (porIngreso[ing.id] || 0);
  const totalNuevo = nuevas.reduce((s,v) => s+v.monto, 0);
  if (totalNuevo > disponible + TOL) { toast("El total asignado supera el disponible del ingreso", "err"); return; }
  const vinculosFinal = [...(ing.vinculos||[]), ...nuevas];
  setBtnState(btnId, "saving");
  try {
    const r = await Storage.setVinculos(ingresoId, vinculosFinal);
    if (!r.ok) throw new Error(r.error || "Error");
    ing.vinculos = vinculosFinal;
    saveSnapshotToCache();
    toast("Vínculo guardado ✓", "ok");
    vincExpandedIngresoId = null;
    vincAsignaciones = {};
    renderVincularModal();
    if (currentTab === "resumen") renderResumen();
  } catch(e) {
    handleSaveError(btnId, e);
  }
}

// ── Sugerencias automáticas de vínculo (para poner al día el historial) ──────
// Empareja por jugador, del egreso/ingreso más viejo al más nuevo (FIFO). No aplica nada
// solo: junta las propuestas para que el usuario las revise y confirme en bloque.
function calcularSugerenciasAutomaticas(jugadorFiltro) {
  const { egresos, ingresos } = getPendientesYSinVincular(jugadorFiltro);
  const porJugador = {};
  for (const e of egresos) {
    const k = e.jugadorCT || "Sin jugador";
    (porJugador[k] = porJugador[k] || { egresos: [], ingresos: [] }).egresos.push({ ...e });
  }
  for (const i of ingresos) {
    const k = i.jugadorCT || "Sin jugador";
    (porJugador[k] = porJugador[k] || { egresos: [], ingresos: [] }).ingresos.push({ ...i });
  }
  const sugerencias = [];
  for (const k of Object.keys(porJugador)) {
    const { egresos: egs, ingresos: ings } = porJugador[k];
    let egIdx = 0;
    for (const ing of ings) {
      let restante = ing.disponible;
      while (restante > TOL && egIdx < egs.length) {
        const e = egs[egIdx];
        if (e.pendiente <= TOL) { egIdx++; continue; }
        const monto = Math.min(e.pendiente, restante);
        sugerencias.push({
          jugador: k, ingresoId: ing.id, ingresoFecha: ing.fecha, ingresoConcepto: ing.concepto,
          egresoId: e.id, egresoFecha: e.fecha, egresoConcepto: e.concepto, monto
        });
        e.pendiente -= monto; restante -= monto;
        if (e.pendiente <= TOL) egIdx++;
      }
    }
  }
  return sugerencias;
}

function sugerirVinculosAutomaticos() {
  vincSugerenciasPendientes = calcularSugerenciasAutomaticas(vincJugadorFiltro).map(s => ({ ...s, selected: true }));
  renderSugerenciasModal();
}

function renderSugerenciasModal() {
  const rows = vincSugerenciasPendientes.map((s,i) => `
    <div class="asoc-row" onclick="toggleSugerencia(${i})">
      <input type="checkbox" ${s.selected?"checked":""} onclick="event.stopPropagation()" onchange="toggleSugerencia(${i})">
      <div class="asoc-info">
        <div class="asoc-main">
          <span class="asoc-fecha">${fechaCorta(s.egresoFecha)}</span>
          <span class="asoc-rubro">${esc(s.jugador)} — ${esc(s.egresoConcepto)||"egreso"}</span>
          <span class="asoc-monto ing">${fmt(s.monto)}</span>
        </div>
        <div class="asoc-concepto">← reintegro ${fechaCorta(s.ingresoFecha)} ${esc(s.ingresoConcepto)||""}</div>
      </div>
    </div>`).join("");
  setModalHtml(`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-card asoc-modal" onclick="event.stopPropagation()" style="max-width:900px">
        <div class="modal-handle"></div>
        <div class="modal-title asoc-header">✨ Vínculos sugeridos (${vincSugerenciasPendientes.length})</div>
        <p class="cfg-note asoc-header" style="margin-bottom:8px">Emparejados por jugador, del más viejo al más nuevo. Los montos son propuestas editables recién al confirmar. Destildá los que no correspondan antes de confirmar.</p>
        <div class="asoc-list">${rows || '<p class="note">No se encontraron coincidencias para sugerir.</p>'}</div>
        <div class="asoc-footer modal-footer">
          <button class="btn-secondary" style="flex:1" onclick="openVincularReintegros(vincJugadorFiltro)">Cancelar</button>
          <button class="btn-main" style="flex:1" id="btn-confirmar-sugerencias" onclick="confirmarSugerenciasSeleccionadas()">Confirmar seleccionadas</button>
        </div>
      </div>
    </div>`);
}

function toggleSugerencia(i) {
  vincSugerenciasPendientes[i].selected = !vincSugerenciasPendientes[i].selected;
  renderSugerenciasModal();
}

async function confirmarSugerenciasSeleccionadas() {
  const btnId = "btn-confirmar-sugerencias";
  if (document.getElementById(btnId)?.disabled) return; // evita doble envío
  const seleccionadas = vincSugerenciasPendientes.filter(s => s.selected);
  if (!seleccionadas.length) { toast("No hay ninguna seleccionada", "err"); return; }
  const porIngresoNuevo = {};
  for (const s of seleccionadas) {
    (porIngresoNuevo[s.ingresoId] = porIngresoNuevo[s.ingresoId] || []).push({ egresoId: s.egresoId, monto: s.monto });
  }
  setBtnState(btnId, "saving");
  try {
    for (const ingresoId of Object.keys(porIngresoNuevo)) {
      const ing = movimientos.find(m => m.id === ingresoId);
      if (!ing) continue;
      const vinculosFinal = [...(ing.vinculos||[]), ...porIngresoNuevo[ingresoId]];
      const r = await Storage.setVinculos(ingresoId, vinculosFinal);
      if (!r.ok) throw new Error(r.error || "Error");
      ing.vinculos = vinculosFinal;
    }
    saveSnapshotToCache();
    toast(seleccionadas.length + " vínculo(s) aplicado(s) ✓", "ok");
    openVincularReintegros(vincJugadorFiltro);
    if (currentTab === "resumen") renderResumen();
  } catch(e) {
    handleSaveError(btnId, e);
  }
}

// ── Adherentes — aportes vs. compromiso (rubro 6) ────────────────
function setAdherenteAnio(v) {

}

function setAdherenteVista(v) {
