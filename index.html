async function saveAdherenteModal(adherenteId) {
  const btnId = "btn-guardar-adherente";
  if (document.getElementById(btnId)?.disabled) return; // evita doble envío
  const nombre = (document.getElementById("adh-nombre")?.value || "").trim();
  const cuotaMensual  = Number(document.getElementById("adh-cuota")?.value || 0);
  const cuotasAnuales = Number(document.getElementById("adh-cuotas-anuales")?.value || 0);
  if (!nombre) { toast("Ingresá un nombre", "err"); return; }
  if (adherentes.some(a => a.id !== adherenteId && normStr(a.nombre) === normStr(nombre))) {
    toast("Ya existe un adherente con ese nombre", "err"); return;
  }
  if (!isFinite(cuotaMensual)  || cuotaMensual  < 0) { toast("La cuota mensual no puede ser negativa", "err"); return; }
  if (!isFinite(cuotasAnuales) || cuotasAnuales < 0) { toast("Las cuotas por año no pueden ser negativas", "err"); return; }
  const adherente = adherenteId
    ? { id:adherenteId, nombre, cuotaMensual, cuotasAnuales }
    : { nombre, cuotaMensual, cuotasAnuales };
  const nombreViejo = adherenteId ? (adherentes.find(a => a.id === adherenteId)?.nombre || "") : "";
  const cambioNombre = adherenteId && nombreViejo && nombreViejo !== nombre;
  setBtnState(btnId, "saving");
  if (cambioNombre) showOverlay("Actualizando movimientos…");
  try {
    const r = await Storage.saveAdherente(adherente);
    if (!r.ok) throw new Error(r.error || "Error");
    if (adherenteId) {
      const idx = adherentes.findIndex(a => a.id === adherenteId);
      if (idx >= 0) adherentes[idx] = { ...adherentes[idx], nombre, cuotaMensual, cuotasAnuales };
    } else {
      adherentes.push({ id:r.id, nombre, cuotaMensual, cuotasAnuales });
    }
    // Espejo local del rename en cascada del backend, para no recargar todo.
    if (cambioNombre) {
      movimientos.forEach(m => {
        if (m.adherenteId === adherenteId ||
            (!m.adherenteId && normStr(m.adherente) === normStr(nombreViejo))) {
          m.adherenteId = adherenteId;
          m.adherente   = nombre;
        }
      });
      pagos.forEach(p => { if (p.adherenteId === adherenteId) p.adherenteNombre = nombre; });
      saveSnapshotToCache();
    }
    hideOverlay();
    setBtnState(btnId, "saved");
    const nMovs = (r.actualizados || {}).movimientos || 0;
    toast(adherenteId
      ? `Adherente actualizado ✓${nMovs ? " — " + nMovs + " movimiento" + (nMovs!==1?"s":"") + " actualizado" + (nMovs!==1?"s":"") : ""}`
      : "Adherente agregado ✓", "ok");
    closeModal();
    renderEntidades();
  } catch(e) { hideOverlay(); handleSaveError(btnId, e); }
}

function confirmDeleteAdherente(id) {
  const btn = document.getElementById("adel-"+id);
  if (!btn || btn.disabled) return;
  if (btn.dataset.confirm) { deleteAdherente(id); }
  else {
    btn.dataset.confirm = "1"; btn.textContent = "¿Eliminar?";
    setTimeout(() => { if(btn && !btn.disabled){ btn.dataset.confirm=""; btn.textContent="✕"; }}, 3000);
  }
}
async function deleteAdherente(id) {
  const btnId = "adel-" + id;
  const btn = document.getElementById(btnId);
  if (btn) { btn.disabled = true; btn.textContent = "Eliminando…"; }
  try {
    const r = await Storage.deleteAdherente(id);
    if (!r.ok) throw new Error(r.error || "Error");
    adherentes = adherentes.filter(a => a.id !== id);
    saveSnapshotToCache();
    toast("Adherente eliminado", "ok");
    renderEntidades();
  } catch(e) { handleDeleteError(btnId, e); }
}

function renderAdhHistorial() {
  const months = getLast6Months();
  const adhs   = [...adherentes].sort((a,b)=>a.nombre.localeCompare(b.nombre));
  const header = `<tr><th>Adherente</th>${months.map(m=>`<th>${mesLabel(m).slice(0,3)}<br>${m.slice(2,4)}</th>`).join("")}</tr>`;
  const rows   = adhs.map(adh => {
    const cells = months.map(m => {
      const mesCod = m.replace("-","");
      const p = pagos.find(p2 => p2.adherenteId === adh.id && p2.mes === mesCod);
      const estado = p ? p.estado : "";
      const icon   = estado==="PAGADO" ? "✓" : estado==="PENDIENTE" ? "✗" : "·";
      const style  = estado==="PAGADO" ? "color:var(--green)" : estado==="PENDIENTE" ? "color:var(--red)" : "color:var(--text3)";
      return `<td><button class="pago-btn" style="${style}" onclick="toggleAdhPago('${adh.id}','${esc(adh.nombre)}','${mesCod}')" title="${adh.nombre} — ${mesLabel(m)}">${icon}</button></td>`;
    }).join("");
    return `<tr><td>${esc(adh.nombre)}</td>${cells}</tr>`;
  }).join("");
  return `<div class="adh-grid-wrap"><table class="adh-grid"><thead>${header}</thead><tbody>${rows}</tbody></table></div>`;
}

function getLast6Months() {
  const months = [];
  let k = nowMes();
  for (let i = 0; i < 6; i++) { months.push(k); k = prevMes(k); }
  return months;
}

async function toggleAdhPago(adhId, adhNombre, mesCod) {
  try {
    const r = await Storage.togglePago(adhId, adhNombre, mesCod);
    if (!r.ok) throw new Error(r.error || "Error");
    // Refresh pagos from backend to guarantee accurate state
    const rPag = await Storage.listPagos();
    if (rPag.ok) pagos = rPag.pagos || [];
    renderEntidades();
  } catch(e) { toast("Error: " + e.message, "err"); }
}

// ══════════════════════════════════════════════════════════════
// TAB 5 — CONFIGURACIÓN
// ══════════════════════════════════════════════════════════════

// ══════════════════════════════════════════════════════════════
// PAGOS A JUGADORES (módulo aparte — no integrado a Movimientos)
// ══════════════════════════════════════════════════════════════

const PJ_ROL_LABEL = { titular:"Titular", suplenteConMin:"Suplente c/min", suplente:"Suplente", noJugo:"No jugó" };

// Opciones de <select> de mes en formato "YYYY-MM" (mismo formato que nowMes()/mesLabel()), en un
// rango razonable alrededor del mes actual (por defecto 2 meses atrás a 3 meses adelante) para poder
// cargar pagos que corresponden al mes siguiente sin tener que esperar a que llegue.
function generarOpcionesMes(selected, before, after) {
  before = before == null ? 2 : before;
  after  = after  == null ? 3 : after;
  let m = nowMes();
  for (let i = 0; i < before; i++) m = prevMes(m);
  const opts = [];
  for (let i = 0; i < before + after + 1; i++) {
    opts.push(`<option value="${m}" ${m===selected?"selected":""}>${mesLabel(m)}</option>`);
    m = nextMes(m);
  }
  return opts.join("");
}

function renderPagosJugadores() {
  const tabs = [
    { key:"partido",       label:"Por partido" },
    { key:"mensual",       label:"Mensual" },
    { key:"transferencias",label:"Transferencias" },
  ];
  const tabBtns = tabs.map(t =>
    `<button class="entity-tab ${pagosJugTab===t.key?"active":""}" onclick="setPagosJugTab('${t.key}')">${t.label}</button>`
  ).join("");
  const inner = pagosJugTab === "transferencias" ? renderTransferencias()
              : pagosJugTab === "mensual" ? renderPagoMensual()
              : renderPagoPartido();
  setContent(`
    <div class="entity-tabs">${tabBtns}</div>
    <div id="pagosjug-content">${inner}</div>
  `);
  // Los totales de Transferencias dependen de qué está tildado (los premios se eligen uno por
  // uno), así que se calculan recién con la tabla ya en el DOM.
  if (pagosJugTab === "transferencias") pjTransfRecalc();
}

function setPagosJugTab(tab) { pagosJugTab = tab; renderPagosJugadores(); }

function pjMontoRol(cfg, rol) {
  if (rol === "titular") return Number(cfg.montoTitular || 0);
  if (rol === "suplenteConMin") return Number(cfg.montoSuplenteConMin || 0);
  if (rol === "suplente") return Number(cfg.montoSuplente || 0);
  return 0;
}

/** Tipo de una fila de "Pagos Jugadores": "partido" | "premio" | "periodico" | "descuento".
 *  Las filas cargadas antes de la columna Tipo lo traen vacío y se clasifican con el criterio
 *  viejo (PartidosIncluidos.length + la frecuencia del jugador) — que es exactamente lo que hace
 *  backfillTipoPagos en el backend. El fallback no se puede sacar hasta que el usuario lo corra. */
function pjTipoFila(p) {
  if (p.tipo) return p.tipo;
  if (p.partidosIncluidos.length) return "partido";
  const cfg = configJugadores.find(c => c.idJugador === p.jugadorId);
  return cfg && cfg.frecuencia === "partido" ? "premio" : "periodico";
}

/** Fila de "Pagos Jugadores" de un jugador para un partido puntual (partidosIncluidos=[partidoId]). */
function pjFilaPartido(jugadorId, partidoId) {
  return pagosJugadores.find(p => p.jugadorId === jugadorId && pjTipoFila(p) === "partido"
    && p.partidosIncluidos.length === 1 && p.partidosIncluidos[0] === partidoId);
}

/** Filas pendientes de un jugador que no son el pago de un partido: premios, sueldos
 *  periódicos y descuentos (estos últimos con montoFinal negativo, así restan solos). */
function pjFilasAcumuladoPendiente(jugadorId) {
  return pagosJugadores.filter(p => p.jugadorId === jugadorId && p.estado === "pendiente"
    && pjTipoFila(p) !== "partido");
}

/** Suma de lo acumulado pendiente (quincenal/mensual + premios − descuentos) de un jugador. */
function pjAcumuladoPendiente(jugadorId) {
  return pjFilasAcumuladoPendiente(jugadorId).reduce((s,p) => s + Number(p.montoFinal||0), 0);
}

/** Premios pendientes de un jugador. Van aparte del resto porque se eligen uno por uno en
 *  Transferencias: tildar a un jugador para pagarle el partido no tiene que arrastrarle los premios. */
function pjPremiosPendientes(jugadorId) {
  return pagosJugadores.filter(p => p.jugadorId === jugadorId && p.estado === "pendiente"
    && pjTipoFila(p) === "premio");
}

/** Lo acumulado pendiente que NO son premios (sueldo periódico neto de descuentos). */
function pjFilasSueldoPendiente(jugadorId) {
  return pjFilasAcumuladoPendiente(jugadorId).filter(p => pjTipoFila(p) !== "premio");
}

/** Etiqueta corta del partido de un premio ("—" si no tiene ninguno asociado). */
function pjPartidoLabel(partidoId) {
  if (!partidoId) return "—";
  const p = partidos.find(x => x.id === partidoId);
  if (!p) return "partido borrado";
  return (p.numeroFecha ? p.numeroFecha + " · " : "") + p.rival;
}

/** Descripción de una fila de pago, con el mismo texto que le pone el backend al armar
 *  ItemsDetalle (ver confirmarPagosJugadores en Code.gs). Está duplicada a propósito: el
 *  comprobante que se emite ANTES de confirmar tiene que decir exactamente lo mismo que el
 *  que sale después, y antes de confirmar no hay movimiento del cual leerlo. Si cambia el
 *  formato de allá, cambiarlo acá. */
function pjDescItem(p) {
  if (pjTipoFila(p) !== "partido") return p.etiqueta || "Ajuste";
  const par = partidos.find(x => x.id === (p.partidosIncluidos[0] || p.partidoId || ""));
  const desc = par ? (par.numeroFecha + " vs " + par.rival) : "Pago partido";
  return p.motivoAjuste ? desc + " — " + p.motivoAjuste : desc;
}

function renderPagoPartido() {
  const sorted = [...partidos].sort((a,b) => b.fecha.localeCompare(a.fecha));
  if (!sorted.length) return '<p class="note">Todavía no hay partidos cargados (Entidades → Partidos).</p>';
  if (!pjPartidoSel || !sorted.some(p => p.id === pjPartidoSel)) pjPartidoSel = sorted[0].id;

  const opciones = sorted.map(p => {
    const fd = p.fecha ? p.fecha.slice(8)+"/"+p.fecha.slice(5,7)+"/"+p.fecha.slice(0,4) : "";
    return `<option value="${p.id}" ${p.id===pjPartidoSel?"selected":""}>${esc(p.rival)} — ${fd}</option>`;
  }).join("");

  const cfgPartido   = configJugadores.filter(c => c.frecuencia === "partido").sort((a,b)=>a.nombre.localeCompare(b.nombre));
  // Los "mensual" tienen su propia subtab ("Mensual") — acá solo quedan los quincenales.
  const cfgPeriodico = configJugadores.filter(c => c.frecuencia === "quincenal").sort((a,b)=>a.nombre.localeCompare(b.nombre));

  let totalPartido = 0, pagadoPartido = 0, pendientePartido = 0;
  const rowsPartido = cfgPartido.map(cfg => {
    const roster = rosterPartidos.find(r => r.partidoId === pjPartidoSel && r.jugadorId === cfg.idJugador);
    const rol    = roster ? roster.rol : "noJugo";
    const fila   = pjFilaPartido(cfg.idJugador, pjPartidoSel);
    const base   = pjMontoRol(cfg, rol);
    const ajuste = fila ? Number(fila.ajuste||0) : 0;
    const motivo = fila ? fila.motivoAjuste || "" : "";
    const final  = fila ? Number(fila.montoFinal||0) : (base + ajuste);
    const estado = fila ? fila.estado : "pendiente";
    // Premios / montos sueltos pendientes: viven en filas propias (sin partido) y se
    // cobran junto con el partido, así que suman al total del jugador.
    const premiosPend = pjAcumuladoPendiente(cfg.idJugador);
    if (rol !== "noJugo") {
      totalPartido += final;
      if (estado === "pagado") pagadoPartido += final; else pendientePartido += final;
    }
    totalPartido     += premiosPend;
    pendientePartido += premiosPend;
    const hayPendiente = estado !== "pagado" || premiosPend > 0;
    // Estado es sólo informativo acá: el pago en sí se hace desde "Transferencias", que junta
    // partidos + quincenales en una sola transferencia por jugador.
    const badge = !hayPendiente
      ? `<span class="pj-badge pj-badge-pagado">Pagado</span>`
      : `<span class="pj-badge pj-badge-pendiente">Pendiente</span>`;
    const premiosCell = `
      <td class="mono">${premiosPend ? fmt(premiosPend) : "—"}
        <button class="btn-sm" onclick="abrirPremiosModal('${cfg.idJugador}','${esc(cfg.nombre)}')" title="Agregar premios">🏆</button>
      </td>`;
    return `
    <tr class="${rol==='noJugo'?'pj-nojugo':''}" data-jug="${cfg.idJugador}" data-nombre="${esc(cfg.nombre)}"
        data-titular="${cfg.montoTitular}" data-supmin="${cfg.montoSuplenteConMin}" data-suplente="${cfg.montoSuplente}"
        data-premios="${premiosPend}" data-pagoid="${fila?fila.id:""}" data-estado="${estado}">
      <td>${esc(cfg.nombre)}</td>
      <td>
        <select class="inp pj-rol" onchange="pjRecalcRow(this)" ${estado==='pagado'?"disabled":""}>
          <option value="titular" ${rol==='titular'?'selected':''}>Titular</option>
          <option value="suplenteConMin" ${rol==='suplenteConMin'?'selected':''}>Suplente c/min</option>
          <option value="suplente" ${rol==='suplente'?'selected':''}>Suplente</option>
          <option value="noJugo" ${rol==='noJugo'?'selected':''}>No jugó</option>
        </select>
      </td>
      <td class="mono pj-base">${fmt(base)}</td>
      <td><input class="inp pj-ajuste" type="number" step="1" value="${ajuste}" oninput="pjRecalcRow(this)" ${estado==='pagado'?"disabled":""}></td>
      <td><input class="inp pj-motivo" type="text" value="${esc(motivo)}" placeholder="Motivo (opcional)" ${estado==='pagado'?"disabled":""}></td>
      ${premiosCell}
      <td class="mono pj-final">${fmt(final + premiosPend)}</td>
      <td>${badge}</td>
    </tr>`;
  }).join("");

  const rowsPeriodico = cfgPeriodico.map(cfg => {
    const acumulado = pjAcumuladoPendiente(cfg.idJugador);
    const label = "Quincenal · acumulado";
    const hayPendiente = acumulado > 0;
    const badge = hayPendiente
      ? `<span class="pj-badge pj-badge-pendiente">Pendiente</span>`
      : `<span class="pj-badge pj-badge-pagado">Al día</span>`;
    return `
    <tr>
      <td>${esc(cfg.nombre)}</td>
      <td class="pj-acumulado">${label}</td>
      <td class="mono">${fmt(acumulado)}</td>
      <td colspan="2" style="text-align:center">
        <button class="btn-sm" onclick="abrirAgregarMontoModal('${cfg.idJugador}','${esc(cfg.nombre)}')">+ Agregar monto</button>
      </td>
      <td style="text-align:center">
        <button class="btn-sm" onclick="abrirPremiosModal('${cfg.idJugador}','${esc(cfg.nombre)}')" title="Agregar premios">🏆</button>
      </td>
      <td class="mono">${fmt(acumulado)}</td>
      <td>${badge}</td>
    </tr>`;
  }).join("");

  return `
    <div class="field">
      <label>Partido</label>
      <select class="inp" id="pj-partido-sel" onchange="pjPartidoSel=this.value; renderPagosJugadores()">${opciones}</select>
    </div>
    <div class="sum-grid three">
      <div class="stat-card"><div class="stat-label">Total a pagar</div><div class="stat-val acc">${fmt(totalPartido)}</div></div>
      <div class="stat-card"><div class="stat-label">Ya pagado</div><div class="stat-val ing">${fmt(pagadoPartido)}</div></div>
      <div class="stat-card"><div class="stat-label">Pendiente</div><div class="stat-val egr">${fmt(pendientePartido)}</div></div>
    </div>
    <div class="pj-table-wrap">
      <table class="pj-table">
        <thead><tr>
          <th>Jugador</th><th>Rol</th><th>Base</th><th>Ajuste</th><th>Motivo</th><th>Premios</th><th>Final</th><th>Estado</th>
        </tr></thead>
        <tbody>${rowsPartido}${rowsPeriodico}</tbody>
      </table>
    </div>
    <button class="btn-main" id="btn-guardar-pagopartido" onclick="guardarPagoPartido()">Guardar</button>
  `;
}

/** Filas de "Pagos Jugadores" acumuladas (todo lo que no es el pago de un partido: sueldo,
 *  premios y descuentos) de un jugador para un mes puntual ("" = sin mes asignado). */
function pjFilasMes(jugadorId, mes) {
  return pagosJugadores.filter(p =>
    p.jugadorId === jugadorId && pjTipoFila(p) !== "partido" && (p.mes||"") === mes
  );
}

function renderPagoMensual() {
  const cfgMensual = configJugadores.filter(c => c.frecuencia === "mensual").sort((a,b)=>a.nombre.localeCompare(b.nombre));
  if (pjMesSel === null) pjMesSel = nowMes();

  const opcionesMes = `<option value="" ${pjMesSel===""?"selected":""}>Sin mes asignado</option>` + generarOpcionesMes(pjMesSel);
  const selectorMes = `
    <div class="field">
      <label>Mes</label>
      <select class="inp" id="pj-mes-sel" onchange="pjMesSel=this.value; renderPagosJugadores()">${opcionesMes}</select>
    </div>`;

  if (!cfgMensual.length) {
    return selectorMes + '<p class="note">Todavía no hay jugadores con frecuencia "mensual" (Entidades → Config Jugadores).</p>';
  }

  let totalMes = 0, pagadoMes = 0, pendienteMes = 0, descuentosMes = 0;
  const rows = cfgMensual.map(cfg => {
    const filas       = pjFilasMes(cfg.idJugador, pjMesSel);
    const pendientes  = filas.filter(p => p.estado === "pendiente");
    const pagados     = filas.filter(p => p.estado === "pagado");
    const totalPend   = pendientes.reduce((s,p) => s + Number(p.montoFinal||0), 0);
    const totalPagado = pagados.reduce((s,p) => s + Number(p.montoFinal||0), 0);
    const totalNeto   = totalPend + totalPagado;
    totalMes += totalNeto; pagadoMes += totalPagado; pendienteMes += totalPend;
    descuentosMes += filas.filter(p => pjTipoFila(p) === "descuento").reduce((s,p) => s + Number(p.montoFinal||0), 0);

    // Los descuentos se muestran aparte y con su ✕ para poder quitarlos mientras estén pendientes.
    const detalle = filas.length
      ? filas.map(p => {
          const esDesc = pjTipoFila(p) === "descuento";
          const quitar = (esDesc && p.estado === "pendiente")
            ? ` <button class="btn-sm danger" style="padding:0 5px" title="Quitar descuento" onclick="quitarDescuento('${p.id}')">✕</button>` : "";
          return `<span style="${esDesc?'color:var(--red)':''}">${esc(p.etiqueta || (esDesc?"Descuento":"Monto"))}: ${fmtSigned(p.montoFinal)}${p.estado==='pagado'?' ✓':''}</span>${quitar}`;
        }).join(" · ")
      : `<span class="pj-acumulado">Sin cargos este mes</span>`;

    const badge = !filas.length ? ""
      : pendientes.length === 0
        ? `<span class="pj-badge pj-badge-pagado">Pagado</span>`
        : `<span class="pj-badge pj-badge-pendiente">Pendiente</span>`;

    const marcarBtn = pendientes.length
      ? `<button class="btn-sm accent" onclick="marcarMesPagado('${cfg.idJugador}','${pjMesSel}')" title="Marcar pagado">✓</button>`
      : "";

    return `
    <tr>
      <td>${esc(cfg.nombre)}</td>
      <td class="pj-acumulado">${detalle}</td>
      <td colspan="2" style="text-align:center;white-space:nowrap">
        <button class="btn-sm" onclick="abrirAgregarMontoModal('${cfg.idJugador}','${esc(cfg.nombre)}','${pjMesSel}')">+ Agregar monto</button>
        <button class="btn-sm" onclick="abrirDescuentoModal('${cfg.idJugador}','${esc(cfg.nombre)}','${pjMesSel}')" title="Cargar descuento">− Descuento</button>
        <button class="btn-sm" onclick="abrirPremiosModal('${cfg.idJugador}','${esc(cfg.nombre)}','${pjMesSel}')" title="Agregar premios">🏆</button>
      </td>
      <td class="mono" style="${totalNeto<0?'color:var(--red)':''}">${fmtSigned(totalNeto)}</td>
      <td>${badge}</td>
      <td>${marcarBtn}</td>
    </tr>`;
  }).join("");

  return `
    ${selectorMes}
    <div class="sum-grid">
      <div class="stat-card"><div class="stat-label">Total del mes</div><div class="stat-val acc">${fmtSigned(totalMes)}</div></div>
      <div class="stat-card"><div class="stat-label">Descuentos</div><div class="stat-val egr">${fmtSigned(descuentosMes)}</div></div>
      <div class="stat-card"><div class="stat-label">Ya pagado</div><div class="stat-val ing">${fmt(pagadoMes)}</div></div>
      <div class="stat-card"><div class="stat-label">Neto a pagar</div><div class="stat-val egr">${fmtSigned(pendienteMes)}</div></div>
    </div>
    <div class="pj-table-wrap">
      <table class="pj-table">
        <thead><tr>
          <th>Jugador</th><th>Detalle</th><th colspan="2"></th><th>Total neto</th><th>Estado</th><th></th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>
    </div>
    <p class="note">Los descuentos (multas, adelantos ya entregados) quedan pendientes como el resto y se netean contra el sueldo al confirmar el pago. El "Neto a pagar" ya los tiene descontados.</p>
  `;
}

// ── Descuentos sobre el sueldo mensual ────────────────────────
// Se guardan como una fila más de Pagos Jugadores, con Tipo "descuento" y MontoFinal NEGATIVO:
// así restan de cualquier suma existente sin lógica especial, y viajan en el mismo lote de
// confirmarPagosJugadores que el sueldo del mes.
function abrirDescuentoModal(jugadorId, jugadorNombre, mesDefault) {
  const mesSel = mesDefault || nowMes();
  document.getElementById("modal-root").innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-title">Cargar descuento — ${esc(jugadorNombre)}</div>
        <div class="fgrid">
          <div class="field">

          </div>

        <div class="modal-footer">
          <button class="btn-secondary" style="flex:1" onclick="closeModal()">Cancelar</button>
          <button class="btn-main" style="flex:1" id="btn-guardar-descuento" onclick="guardarDescuento('${jugadorId}','${esc(jugadorNombre)}')">Guardar</button>
        </div>

    </div>`;
}

async function guardarDescuento(jugadorId, jugadorNombre) {
  const btnId = "btn-guardar-descuento";
  if (document.getElementById(btnId)?.disabled) return;
  const monto  = Math.abs(parseFloat(document.getElementById("pj-desc-monto")?.value || "0") || 0);
  const mes    = document.getElementById("pj-desc-mes")?.value || "";
  const motivo = (document.getElementById("pj-desc-motivo")?.value || "").trim();
  if (!monto)  { toast("Ingresá el monto a descontar", "err"); return; }
  if (!motivo) { toast("Poné el motivo del descuento", "err"); return; }
  setBtnState(btnId, "saving");
  try {
    // El monto se guarda negativo — es lo que hace que reste sin tocar ninguna suma existente.
    const pago = {
      jugadorId, jugadorNombre, partidosIncluidos: [],
      montoBase: -monto, ajuste: 0, motivoAjuste: "", montoFinal: -monto,
      estado: "pendiente", etiqueta: motivo, mes, tipo: "descuento", partidoId: ""
    };
    const r = await Storage.savePagoJugador(pago);
    if (!r.ok) throw new Error(r.error || "Error");
    pagosJugadores.push({ id: r.id, ...pago, fechaPago: "", medioPago: "", movimientoId: "" });
    saveSnapshotToCache();
    setBtnState(btnId, "saved");
    toast("Descuento cargado ✓", "ok");
    closeModal();
    renderPagosJugadores();
  } catch(e) { handleSaveError(btnId, e); }
}

/** Quita un descuento pendiente. deletePagoJugador sólo deja borrar filas en "pendiente",
 *  así que un descuento ya cobrado no se puede hacer desaparecer del movimiento. */
async function quitarDescuento(id) {
  const p = pagosJugadores.find(x => x.id === id);
  if (!p) return;
  if (!confirm("¿Quitar el descuento \"" + (p.etiqueta || "sin motivo") + "\" de " + fmt(Math.abs(p.montoFinal)) + "?")) return;
  showOverlay("Quitando…");
  try {
    const r = await Storage.deletePagoJugador(id);
    if (!r.ok) throw new Error(r.error || "Error");
    const idx = pagosJugadores.findIndex(x => x.id === id);
    if (idx >= 0) pagosJugadores.splice(idx, 1);
    saveSnapshotToCache();
    hideOverlay();
    toast("Descuento quitado ✓", "ok");
    renderPagosJugadores();
  } catch(e) {
    hideOverlay();
    toast("Error: " + e.message, "err");
  }
}

/** Monto base de una fila de la tabla "Por partido" según el rol elegido. */
function pjBaseDeFila(tr) {
  const rolSel = tr.querySelector(".pj-rol")?.value;
  return rolSel === "titular" ? Number(tr.dataset.titular||0)
       : rolSel === "suplenteConMin" ? Number(tr.dataset.supmin||0)
       : rolSel === "suplente" ? Number(tr.dataset.suplente||0) : 0;
}

function pjRecalcRow(el) {
  const tr = el.closest("tr");
  if (!tr) return;
  const base    = pjBaseDeFila(tr);
  const ajuste  = Number(tr.querySelector(".pj-ajuste").value || 0);
  const premios = Number(tr.dataset.premios || 0); // se cobran junto con el partido
  tr.querySelector(".pj-base").textContent  = fmt(base);
  tr.querySelector(".pj-final").textContent = fmt(base + ajuste + premios);
}

/** Guarda lo que el usuario tiene cargado (sin grabar) en la tabla "Por partido",
 *  para poder restaurarlo después de un re-render (ej. al agregar un premio). */
function pjSnapshotFormPartido() {
  const st = {};
  document.querySelectorAll("#pagosjug-content .pj-table tbody tr[data-jug]").forEach(tr => {
    st[tr.dataset.jug] = {
      rol:    tr.querySelector(".pj-rol")?.value,
      ajuste: tr.querySelector(".pj-ajuste")?.value,
      motivo: tr.querySelector(".pj-motivo")?.value,
    };
  });
  return st;
}

function pjRestoreFormPartido(st) {
  if (!st) return;
  document.querySelectorAll("#pagosjug-content .pj-table tbody tr[data-jug]").forEach(tr => {
    const s = st[tr.dataset.jug];
    if (!s) return;
    const rol = tr.querySelector(".pj-rol");
    const aj  = tr.querySelector(".pj-ajuste");
    const mo  = tr.querySelector(".pj-motivo");
    if (rol && !rol.disabled && s.rol    != null) rol.value = s.rol;
    if (aj  && !aj.disabled  && s.ajuste != null) aj.value  = s.ajuste;
    if (mo  && !mo.disabled  && s.motivo != null) mo.value  = s.motivo;
    if (rol) pjRecalcRow(rol);
  });
}

async function guardarPagoPartido() {
  const btnId = "btn-guardar-pagopartido";
  if (document.getElementById(btnId)?.disabled) return;
  const rows = [...document.querySelectorAll("#pagosjug-content .pj-table tbody tr[data-jug]")];
  const partidoActual = partidos.find(p => p.id === pjPartidoSel);
  const mesPartido = partidoActual ? getMes(partidoActual.fecha) : "";
  // El montoBase/montoFinal se calculan de los inputs, NO del texto de la celda "Final":
  // esa celda muestra además los premios, que van en filas propias y no deben duplicarse acá.
  const roster = rows.map(tr => {
    const montoBase = pjBaseDeFila(tr);
    const ajuste    = Number(tr.querySelector(".pj-ajuste").value || 0);
    return {
      jugadorId:     tr.dataset.jug,
      jugadorNombre: tr.dataset.nombre,
      rol:           tr.querySelector(".pj-rol").value,
      montoBase,
      ajuste,
      motivoAjuste:  tr.querySelector(".pj-motivo").value || "",
      montoFinal:    montoBase + ajuste,
      mes:           mesPartido,
    };
  });
  setBtnState(btnId, "saving");
  try {
    const r = await Storage.saveRoster(pjPartidoSel, roster);
    if (!r.ok) throw new Error(r.error || "Error");
    const [rRos, rPJ] = await Promise.all([Storage.listRoster(), Storage.listPagosJugadores()]);
    if (rRos.ok) rosterPartidos = rRos.roster || [];
    if (rPJ.ok)  pagosJugadores = rPJ.pagosJugadores || [];
    saveSnapshotToCache();
    setBtnState(btnId, "saved");
    toast("Roster y montos guardados ✓", "ok");
    renderPagosJugadores();
  } catch(e) { handleSaveError(btnId, e); }
}

async function confirmarMedioPagoModal() {
  const btnId = "btn-confirmar-mediopago";

  const medioPago = document.getElementById("pj-medio-pago")?.value || "";
  const cuenta    = document.getElementById("pj-cuenta")?.value || "";

    await pjMedioPagoCallback(medioPago, cuenta, fechaPago);

function abrirMedioPagoModal(idsIniciales, jugadorId, partidoId, idsExtra) {
  abrirMedioPagoModalGenerico("Confirmar pago", async (medioPago, cuenta, fechaPago) => {
    let ids = (idsIniciales || []).filter(Boolean);
    const extra = (idsExtra || []).filter(Boolean);
    if (partidoId && !ids.length) {
      // La fila no existía todavía (rol recién elegido y no guardado) — hay que guardar primero.
      await guardarPagoPartido();
      const fila = pjFilaPartido(jugadorId, partidoId);
      if (fila) ids = [fila.id];
    }
    // Los premios (filas sin partido) se cobran junto con el resto.
    ids = [...new Set([...ids, ...extra])];
    if (!ids.length) throw new Error("Guardá el roster antes de marcar como pagado");
    const r = await Storage.confirmarPagosJugadores(ids, fechaPago, medioPago, cuenta);
    if (!r.ok) throw new Error(r.error || "Error");
    ids.forEach(id => {
      const p = pagosJugadores.find(x => x.id === id);
      if (p) { p.estado = "pagado"; p.fechaPago = fechaPago; p.medioPago = medioPago; }
    });
    aplicarMovimientosCreados(r.movimientos);
    saveSnapshotToCache();
    renderPagosJugadores();
    mostrarConfirmacionPagosModal(r.movimientos);
  });
}

/** Suma al array local movimientos los que el backend acaba de crear al confirmar un pago. */
function aplicarMovimientosCreados(movimientosCreados) {
  (movimientosCreados || []).forEach(m => movimientos.push(m));
  updateBadge();
}

/** Marca como pagadas las filas pendientes de un jugador "mensual" en un mes puntual: sueldo,
 *  premios y descuentos del mes van en la misma transferencia, neteados. */
function marcarMesPagado(jugadorId, mes) {
  const filas = pjFilasMes(jugadorId, mes).filter(p => p.estado === "pendiente");
  if (!filas.length) return;
  const ids = filas.map(p => p.id);
  const negativo = pjJugadorConNetoNegativo(ids);
  if (negativo) {
    toast("Los descuentos de " + negativo.nombre + " superan el sueldo del mes (" + fmtSigned(negativo.neto) + "). Ajustalos antes de confirmar.", "err");
    return;
  }
  abrirMedioPagoModal(ids, jugadorId, null);
}

// ── Aplicar premios a un jugador ──────────────────────────────
// Cada premio con cantidad > 0 genera/actualiza una fila pendiente propia (sin
// partido asociado), que se suma al pendiente del jugador y se cobra junto con el
// resto. Si el jugador ya tenía ese premio cargado (pendiente), se precarga la
// cantidad para poder modificarla o ponerla en 0 para quitarlo.

/** Filas pendientes (sin partido) de un jugador que corresponden a un premio dado,
 *  matcheando por descripción (la etiqueta guardada es "desc" o "desc xN"). */
function pjPremioExistente(jugadorId, descripcion) {
  // Matchea por etiqueta sobre cualquier fila pendiente que no sea de un partido: las filas
  // viejas sin Tipo de un jugador mensual se clasifican como "periodico", y aun así son el
  // premio que este modal cargó en su momento.
  return pagosJugadores.filter(p => p.jugadorId === jugadorId && p.estado === "pendiente"
    && pjTipoFila(p) !== "partido"
    && (p.etiqueta === descripcion || p.etiqueta.startsWith(descripcion + " x")));
}

function abrirPremiosModal(jugadorId, jugadorNombre, mesDefault) {
  const cfg = configJugadores.find(c => c.idJugador === jugadorId);
  const lista = (cfg && cfg.premios) ? cfg.premios : [];
  if (!lista.length) {
    toast("Este jugador no tiene premios cargados (Entidades → Cobros → editar el cobro)", "err");
    return;
  }
  const mesSel = mesDefault || nowMes();
  // Partido del premio: si el modal se abre desde "Por partido" ya sabemos cuál es, así que se
  // propone ese. Queda editable y se puede dejar vacío: hay premios que no son de un partido.
  const yaCargado = lista.map(p => pjPremioExistente(jugadorId, p.descripcion))
    .reduce((a,b) => a.concat(b), []).find(p => p.partidoId);
  const partidoSel = yaCargado ? yaCargado.partidoId : (pagosJugTab === "partido" ? pjPartidoSel : "");
  const opcionesPartido = `<option value="">— Sin partido —</option>` +
    [...partidos].sort((a,b) => b.fecha.localeCompare(a.fecha)).map(p => {
      const fd = p.fecha ? p.fecha.slice(8)+"/"+p.fecha.slice(5,7)+"/"+p.fecha.slice(0,4) : "";
      return `<option value="${p.id}" ${p.id===partidoSel?"selected":""}>${esc(p.rival)} — ${fd}</option>`;
    }).join("");
  const filas = lista.map((p, i) => {
    const existentes = pjPremioExistente(jugadorId, p.descripcion);
    const existingIds = existentes.map(r => r.id);
    const existingTotal = existentes.reduce((s,r) => s + Number(r.montoFinal||0), 0);
    const cantActual = existentes.length ? Math.max(1, Math.round(existingTotal / (Number(p.monto)||1))) : 0;
    return `
    <div class="entity-item">
      <div style="flex:1;min-width:0">
        <div class="entity-name">${esc(p.descripcion)}</div>
        <div class="entity-sub mono">${fmt(p.monto)} c/u</div>
      </div>
      <input class="inp premio-cant" data-idx="${i}" data-desc="${esc(p.descripcion)}" data-monto="${p.monto}"
             data-existing-ids='${JSON.stringify(existingIds)}'
             type="number" min="0" step="1" value="${cantActual}" style="width:72px;text-align:center" oninput="premiosRecalcTotal()">
    </div>`;
  }).join("");
  document.getElementById("modal-root").innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-title">Premios — ${esc(jugadorNombre)}</div>
        <div class="fgrid">
          <div class="field">
            <label>Mes</label>
            <select class="inp" id="premios-mes">${generarOpcionesMes(mesSel)}</select>
          </div>
          <div class="field">
            <label>Partido</label>
            <select class="inp" id="premios-partido">${opcionesPartido}</select>
          </div>
        </div>
        ${filas}
        <p class="note" style="margin:4px 0 0">Poné la cantidad en 0 para quitar un premio ya cargado.</p>
        <div class="modal-detail-row" style="margin-top:10px">
          <span class="modal-detail-lbl">Total</span>
          <span class="modal-detail-val mono" id="premios-total">${fmt(0)}</span>
        </div>
        <div class="modal-footer">
          <button class="btn-secondary" style="flex:1" onclick="closeModal()">Cancelar</button>
          <button class="btn-main" style="flex:1" id="btn-aplicar-premios" onclick="guardarPremiosJugador('${jugadorId}','${esc(jugadorNombre)}')">Guardar</button>
        </div>
      </div>
    </div>`;
  premiosRecalcTotal();
}

function premiosRecalcTotal() {
  const total = [...document.querySelectorAll(".premio-cant")]
    .reduce((s,i) => s + (Number(i.value||0) * Number(i.dataset.monto||0)), 0);
  const el = document.getElementById("premios-total");
  if (el) el.textContent = fmt(total);
}

async function guardarPremiosJugador(jugadorId, jugadorNombre) {
  const btnId = "btn-aplicar-premios";
  if (document.getElementById(btnId)?.disabled) return;
  const mes       = document.getElementById("premios-mes")?.value || "";
  const partidoId = document.getElementById("premios-partido")?.value || "";
  // Por cada tipo de premio: cant 0 con filas existentes -> quitarlas; cant > 0 ->
  // actualiza la primera fila existente (o crea una nueva) y borra duplicados sueltos.
  const aBorrar = [];
  const aGuardar = [];
  [...document.querySelectorAll(".premio-cant")].forEach(inp => {
    const cant = Number(inp.value || 0);
    const monto = Number(inp.dataset.monto || 0);
    const desc  = inp.dataset.desc || "Premio";
    const existingIds = JSON.parse(inp.dataset.existingIds || "[]");
    if (cant <= 0) {
      aBorrar.push(...existingIds);
      return;
    }
    const [keepId, ...dupIds] = existingIds;
    aBorrar.push(...dupIds);
    aGuardar.push({
      id: keepId || "", jugadorId, jugadorNombre,
      montoFinal: monto * cant,
      etiqueta:   desc + (cant > 1 ? " x" + cant : ""),
      mes, partidoId
    });
  });
  if (!aBorrar.length && !aGuardar.length) { toast("Poné al menos una cantidad", "err"); return; }
  // El re-render de abajo reconstruye la tabla — nos guardamos lo que el usuario
  // tenía cargado sin grabar (rol, ajuste, motivo) para no hacérselo perder.
  const formPrevio = pjSnapshotFormPartido();
  setBtnState(btnId, "saving");
  try {
    for (const id of aBorrar) {
      const r = await Storage.deletePagoJugador(id);
      if (!r.ok) throw new Error(r.error || "Error");
      const idx = pagosJugadores.findIndex(p => p.id === id);
      if (idx >= 0) pagosJugadores.splice(idx, 1);
    }
    for (const p of aGuardar) {
      // partidosIncluidos sigue vacío: el partido de un premio va en su propia columna. Meterlo
      // acá haría que pjFilaPartido lo devuelva como si fuera el pago del partido.
      const campos = {
        jugadorId: p.jugadorId, jugadorNombre: p.jugadorNombre,
        partidosIncluidos: [], montoBase: p.montoFinal, ajuste: 0, motivoAjuste: "",
        montoFinal: p.montoFinal, estado: "pendiente", fechaPago: "", medioPago: "",
        etiqueta: p.etiqueta, movimientoId: "", mes: p.mes,
        tipo: "premio", partidoId: p.partidoId || ""
      };
      const r = await Storage.savePagoJugador({ id: p.id, ...campos });
      if (!r.ok) throw new Error(r.error || "Error");
      const fila = { id: r.id, ...campos };
      const idx = pagosJugadores.findIndex(x => x.id === r.id);
      if (idx >= 0) pagosJugadores[idx] = fila; else pagosJugadores.push(fila);
    }
    saveSnapshotToCache();
    setBtnState(btnId, "saved");
    toast("Premios actualizados ✓", "ok");
    closeModal();
    renderPagosJugadores();
    pjRestoreFormPartido(formPrevio);
  } catch(e) { handleSaveError(btnId, e); }
}

function renderTransferencias() {
  if (pjPartidosSel === null) {
    // Precarga: partidos que tienen al menos una fila pendiente.
    const idsConPendiente = new Set(
      pagosJugadores.filter(p => p.estado === "pendiente" && pjTipoFila(p) === "partido" && p.partidosIncluidos.length === 1)
        .map(p => p.partidosIncluidos[0])
    );
    pjPartidosSel = partidos.filter(p => idsConPendiente.has(p.id)).map(p => p.id);
  }
  const sorted = [...partidos].sort((a,b) => b.fecha.localeCompare(a.fecha));
  if (!sorted.length) return '<p class="note">Todavía no hay partidos cargados.</p>';

  const chips = sorted.map(p => {
    const fd = p.fecha ? p.fecha.slice(8)+"/"+p.fecha.slice(5,7) : "";
    const activo = pjPartidosSel.includes(p.id);
    return `<button class="pill ${activo?'active':''}" onclick="pjToggleChip('${p.id}')">${esc(p.rival)} · ${fd}</button>`;
  }).join("");

  const partidosSel = sorted.filter(p => pjPartidosSel.includes(p.id));

  // Jugadores relevantes: por-partido con fila en algún partido seleccionado, o cualquiera con
  // sueldo/premios pendientes. Los premios van aparte del resto: tienen checkbox propio.
  const filasPorJugador = {}; // idJugador -> { nombre, alias, porPartido, periodico, sueldo:[filas], premios:[filas] }
  configJugadores.forEach(cfg => {
    const porPartido = {};
    let tienePartido = false;
    if (cfg.frecuencia === "partido") {
      partidosSel.forEach(p => {
        const fila = pjFilaPartido(cfg.idJugador, p.id);
        if (fila) { porPartido[p.id] = fila; tienePartido = true; }
      });
    }
    // "sueldo" = lo periódico + los descuentos (montoFinal negativo, netean solos).
    const sueldo  = pjFilasSueldoPendiente(cfg.idJugador);
    const premios = pjPremiosPendientes(cfg.idJugador);
    if (tienePartido || sueldo.length || premios.length) {
      filasPorJugador[cfg.idJugador] = {
        nombre: cfg.nombre, alias: cfg.alias, porPartido,
        periodico: cfg.frecuencia !== "partido", sueldo, premios
      };
    }
  });

  const jugadorIds = Object.keys(filasPorJugador).sort((a,b) => filasPorJugador[a].nombre.localeCompare(filasPorJugador[b].nombre));

  const rows = jugadorIds.map(jid => {
    const info = filasPorJugador[jid];
    const sueldoNeto = info.sueldo.reduce((s,p) => s + Number(p.montoFinal||0), 0);
    // "base" = lo que arrastra el checkbox principal del jugador: los partidos pendientes de la
    // selección + su sueldo/descuentos. Los premios NO entran acá (ver premiosCell).
    let base = sueldoNeto;
    let cols;
    if (info.periodico) {
      cols = `<td class="mono" colspan="${partidosSel.length||1}">${fmtSigned(sueldoNeto)} <span class="pj-acumulado">acumulado</span></td>`;
    } else {
      cols = partidosSel.map(p => {
        const fila = info.porPartido[p.id];
        if (!fila) return `<td class="mono">—</td>`;
        if (fila.estado === "pendiente") base += Number(fila.montoFinal||0);
        return `<td class="mono">${fmt(fila.montoFinal)}${fila.estado==='pagado'?' <span class="pj-badge pj-badge-pagado" style="padding:1px 5px">✓</span>':''}</td>`;
      }).join("");
    }
    const hayBase = info.sueldo.length > 0 ||
      Object.values(info.porPartido).some(f => f.estado === "pendiente");
    // Un checkbox por premio: tildar al jugador para pagarle el partido no le tiene que arrastrar
    // los premios (antes se colaban solos y desaparecían de la pantalla sin que nadie los eligiera).
    const premiosCell = info.premios.length
      ? info.premios.map(p => `
          <label class="pj-premio-lbl">
            <input type="checkbox" class="pj-premio-cb" value="${p.id}" data-monto="${Number(p.montoFinal||0)}" onchange="pjTransfRecalc()">
            <span class="mono">${fmtSigned(p.montoFinal)}</span>
            <span>${esc(p.etiqueta || "Premio")}</span>
            <span class="pj-acumulado">${esc(pjPartidoLabel(p.partidoId))}</span>
          </label>`).join("")
      : "—";
    return `
    <tr data-jug="${jid}" data-alias="${esc(info.alias||"—")}" data-base="${base}" data-total="0">
      <td>${esc(info.nombre)}</td>
      ${cols}
      <td class="pj-premios-cell">${premiosCell}</td>
      <td class="mono pj-total-cell">${fmt(0)}</td>
      <td>${esc(info.alias || "—")}</td>
      <td style="text-align:center"><input type="checkbox" class="pj-transf-cb" value="${jid}" onchange="pjTransfRecalc()" ${hayBase?"checked":""} ${hayBase?"":"disabled"}></td>
      <td style="text-align:center"><button class="btn-sm pj-comp-btn" onclick="abrirComprobantePrevio('${jid}')" title="Generar el comprobante de lo tildado, sin confirmar el pago">🧾</button></td>
    </tr>`;
  }).join("");

  const partidoCols = partidosSel.map(p => `<th>${esc(p.rival)}<br>${p.fecha?p.fecha.slice(8)+"/"+p.fecha.slice(5,7):""}</th>`).join("");

  return `
    <div class="pj-chip-row">${chips}</div>
    <div class="sum-grid three">
      <div class="stat-card"><div class="stat-label">Jugadores a pagar</div><div class="stat-val acc" id="pj-jugadores-pagar">0</div></div>
      <div class="stat-card"><div class="stat-label">Total a transferir</div><div class="stat-val egr" id="pj-total-transferir">${fmt(0)}</div></div>
      <div class="stat-card"><div class="stat-label">Partidos incluidos</div><div class="stat-val">${partidosSel.length}</div></div>
    </div>
    ${jugadorIds.length ? `
      <div style="display:flex;gap:8px;margin-bottom:8px">
        <button class="btn-sm" onclick="pjMarcarTodos(true)">Tildar todos</button>
        <button class="btn-sm" onclick="pjMarcarTodos(false)">Destildar todos</button>
      </div>` : ""}
    <div class="pj-table-wrap">
      <table class="pj-table" id="pj-transf-table">
        <thead><tr><th>Jugador</th>${partidoCols || "<th>Monto</th>"}<th>Premios/Ajustes</th><th>Total</th><th>Alias/CBU</th><th>Incluir</th><th>Comprob.</th></tr></thead>
        <tbody>${rows || `<tr><td colspan="99" class="note">Sin jugadores pendientes para los partidos seleccionados</td></tr>`}</tbody>
      </table>
    </div>
    <button class="btn-export" style="margin-bottom:10px" onclick="exportarTransferencias()">📋 Exportar lista de transferencias</button>
    <button class="btn-main" id="btn-confirmar-transf" onclick="confirmarPagosSeleccionados()">Confirmar pagos seleccionados</button>
  `;
}

// Tilda o destilda todas las filas de la tabla de transferencias, incluidos los checkbox
// de premios. Ignora los deshabilitados (jugadores sin nada pendiente): esos no se pueden
// incluir en un pago.
function pjMarcarTodos(valor) {
  const cbs = [...document.querySelectorAll("#pj-transf-table .pj-transf-cb:not(:disabled), #pj-transf-table .pj-premio-cb:not(:disabled)")];
  cbs.forEach(cb => cb.checked = valor);
  pjTransfRecalc();
  if (!cbs.length) toast("No hay filas para " + (valor ? "tildar" : "destildar"), "err");
}

/** Recalcula el total de cada fila y los totales de arriba a partir de lo que está tildado.
 *  Los premios se eligen uno por uno, así que el monto a transferir depende de la selección
 *  y no se puede dejar fijo en el HTML (el CSV de transferencias sale de estos totales). */
function pjTransfRecalc() {
  let totalGeneral = 0, jugadores = 0;
  document.querySelectorAll("#pj-transf-table tbody tr[data-jug]").forEach(tr => {
    const main = tr.querySelector(".pj-transf-cb");
    let total = (main && main.checked && !main.disabled) ? Number(tr.dataset.base || 0) : 0;
    tr.querySelectorAll(".pj-premio-cb:checked").forEach(cb => total += Number(cb.dataset.monto || 0));
    tr.dataset.total = total;
    const cell = tr.querySelector(".pj-total-cell");
    if (cell) {
      cell.textContent = fmtSigned(total);
      cell.style.color = total < 0 ? "var(--red)" : "";
    }
    // Sin nada tildado no hay comprobante que emitir, y con neto negativo tampoco: ese pago no
    // se puede hacer (lo corta confirmarPagosJugadores), así que no hay que poder documentarlo.
    const btnComp = tr.querySelector(".pj-comp-btn");
    if (btnComp) btnComp.disabled = total <= 0;
    if (total !== 0) jugadores++;
    totalGeneral += total;
  });
  const elT = document.getElementById("pj-total-transferir");
  if (elT) elT.textContent = fmtSigned(totalGeneral);
  const elJ = document.getElementById("pj-jugadores-pagar");
  if (elJ) elJ.textContent = jugadores;
}

function pjToggleChip(partidoId) {
  if (pjPartidosSel.includes(partidoId)) pjPartidosSel = pjPartidosSel.filter(id => id !== partidoId);
  else pjPartidosSel = [...pjPartidosSel, partidoId];
  renderPagosJugadores();
}

// IDs de las filas de "Pagos Jugadores" que entran en el pago. El checkbox del jugador arrastra
// sus partidos pendientes y su sueldo/descuentos; los premios entran SÓLO si están tildados uno
// por uno, que es el punto de tener checkbox propio.
/**
 * Traduce lo tildado en pantalla a IDs de filas de "Pagos Jugadores".
 *
 * Separada de la lectura del DOM a propósito: acá vive la regla de negocio que arregló el bug
 * de que un premio se cobrara solo, y así se puede verificar sin navegador (ver spec/frontend.js).
 * `seleccion` es [{jugadorId, incluido, premiosIds}] — una entrada por fila de la tabla.
 */
function pjIdsDeSeleccion(seleccion) {
  const partidosSel = [...partidos].filter(p => pjPartidosSel.includes(p.id));
  const ids = [];
  (seleccion || []).forEach(sel => {
    if (sel.incluido) {
      const cfg = configJugadores.find(c => c.idJugador === sel.jugadorId);
      if (cfg && cfg.frecuencia === "partido") {
        partidosSel.forEach(p => {
          const fila = pjFilaPartido(sel.jugadorId, p.id);
          if (fila && fila.estado === "pendiente") ids.push(fila.id);
        });
      }
      pjFilasSueldoPendiente(sel.jugadorId).forEach(p => ids.push(p.id));
    }
    // Los premios entran SÓLO si están tildados uno por uno: tildar al jugador para pagarle el
    // partido no tiene que arrastrárselos. Van afuera del if a propósito — un jugador que sólo
    // tiene premios tiene el checkbox principal deshabilitado y aun así puede cobrarlos.
    (sel.premiosIds || []).forEach(id => ids.push(id));
  });
  return [...new Set(ids)];
}

/** Lee la tabla de transferencias y delega la regla en pjIdsDeSeleccion. */
function pjFilasSeleccionadas() {
  const seleccion = [...document.querySelectorAll("#pj-transf-table tbody tr[data-jug]")].map(tr => {
    const main = tr.querySelector(".pj-transf-cb");
    return {
      jugadorId:  tr.dataset.jug,
      incluido:   !!(main && main.checked && !main.disabled),
      premiosIds: [...tr.querySelectorAll(".pj-premio-cb:checked")].map(cb => cb.value)
    };
  });
  return pjIdsDeSeleccion(seleccion);
}

/** Primer jugador del lote cuyo neto (sueldo + premios − descuentos) da negativo, o null.
 *  Un neto negativo no es un egreso: es plata que el jugador le debe al club, y generar el
 *  movimiento igual rompería las sumas. El backend también lo corta, esto es para avisar antes. */
function pjJugadorConNetoNegativo(ids) {
  const porJugador = {};
  ids.forEach(id => {
    const p = pagosJugadores.find(x => x.id === id);
    if (!p) return;
    porJugador[p.jugadorId] = porJugador[p.jugadorId] || { nombre: p.jugadorNombre || "jugador", neto: 0 };
    porJugador[p.jugadorId].neto += Number(p.montoFinal || 0);
  });
  return Object.values(porJugador).find(g => g.neto < 0) || null;
}

function exportarTransferencias() {
  // Sale lo que efectivamente se va a transferir (data-total, que ya descuenta los premios
  // destildados), no todo lo pendiente del jugador.
  const filas = [...document.querySelectorAll("#pj-transf-table tbody tr[data-jug]")]
    .filter(tr => Number(tr.dataset.total || 0) !== 0);
  if (!filas.length) { toast("No hay filas seleccionadas para exportar", "err"); return; }
  const lineas = filas.map(tr => `${tr.dataset.alias},${tr.dataset.total}`);
  const texto = "Alias/CBU,Monto\n" + lineas.join("\n");
  const blob = new Blob([texto], { type:"text/csv;charset=utf-8" });
  const url  = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = "transferencias_jugadores.csv"; a.click();
  URL.revokeObjectURL(url);
  toast("Lista exportada ✓", "ok");
}

function confirmarPagosSeleccionados() {
  const ids = pjFilasSeleccionadas();
  if (!ids.length) { toast("No hay pagos pendientes seleccionados", "err"); return; }
  const negativo = pjJugadorConNetoNegativo(ids);
  if (negativo) {
    toast("Los descuentos de " + negativo.nombre + " superan lo que se le debe (" + fmtSigned(negativo.neto) + "). Ajustalo antes de confirmar.", "err");
    return;
  }
  abrirMedioPagoModalGenerico("Confirmar " + ids.length + " pago" + (ids.length!==1?"s":""), async (medioPago, cuenta, fechaPago) => {
    const r = await Storage.confirmarPagosJugadores(ids, fechaPago, medioPago, cuenta);
    if (!r.ok) throw new Error(r.error || "Error");
    ids.forEach(id => {
      const p = pagosJugadores.find(x => x.id === id);
      if (p) { p.estado = "pagado"; p.fechaPago = fechaPago; p.medioPago = medioPago; }
    });
    aplicarMovimientosCreados(r.movimientos);
    saveSnapshotToCache();
    renderPagosJugadores();
    mostrarConfirmacionPagosModal(r.movimientos);
  });
}

// ── Diagnóstico de arranque ──────────────────────────────────
// Las 12 consultas que hace initApp() están en dos Promise.all, así que en el navegador
// salen "en paralelo" — pero Apps Script serializa las ejecuciones de un mismo usuario y
// cada una vuelve a abrir la planilla, así que en el servidor se hacen una atrás de otra.
// Esto mide las dos cosas por separado: el costo individual de cada consulta y el costo
// real del lote entero, para distinguir "una consulta pesada" de "demasiadas idas y vueltas".
const DIAG_ACCIONES = [
  ["listMov",             () => Storage.listMov(),             "movimientos"],
  ["listJugadores",       () => Storage.listJugadores(),       "jugadores"],
  ["listGrupos",          () => Storage.listGrupos(),          "grupos"],
  ["listAdherentes",      () => Storage.listAdherentes(),      "adherentes"],
  ["listPagos",           () => Storage.listPagos(),           "pagos"],
  ["getConfig",           () => Storage.getConfig(),           "config"],
  ["listPartidos",        () => Storage.listPartidos(),        "partidos"],
  ["listReservas",        () => Storage.listReservas(),        "reservas"],
  ["listEventos",         () => Storage.listEventos(),         "eventos"],
  ["listConfigJugadores", () => Storage.listConfigJugadores(), "configJugadores"],
  ["listRoster",          () => Storage.listRoster(),          "roster"],
  ["listPagosJugadores",  () => Storage.listPagosJugadores(),  "pagosJugadores"],
];

async function runDiagArranque() {
  const btnId = "btn-diag-arranque";
  const box   = document.getElementById("diag-result");
  if (!getScriptUrl()) { toast("Configurá primero la URL del script", "err"); return; }
  setBtnState(btnId, "saving");
  box.innerHTML = `<p class="cfg-note">Midiendo…</p>`;
  try {
    // 1) Una consulta suelta primero, para separar el "cold start" de Apps Script (la primera
    //    llamada después de un rato despierta el proyecto y puede tardar varios segundos).
    const t0 = performance.now();
    await Storage.getConfig();
    const cold = performance.now() - t0;

    // 2) Cada acción por separado, en serie: da el costo real de una ida y vuelta.
    const filas = [];
    for (const [nombre, fn, clave] of DIAG_ACCIONES) {
      const t = performance.now();
      let ms, peso = 0, items = null, err = "";
      try {
        const r = await fn();
        ms   = performance.now() - t;
        peso = JSON.stringify(r || {}).length;
        const arr = r && r[clave];
        items = Array.isArray(arr) ? arr.length : null;
      } catch (e) { ms = performance.now() - t; err = e.message; }
      filas.push({ nombre, ms, peso, items, err });
    }

    // 3) El lote completo como lo hace initApp, para ver cuánto se gana (o no) en paralelo.
    const tLote = performance.now();
    await Promise.all(DIAG_ACCIONES.map(([, fn]) => fn().catch(() => null)));
    const lote = performance.now() - tLote;

    const suma = filas.reduce((s, f) => s + f.ms, 0);
    const pesoTotal = filas.reduce((s, f) => s + f.peso, 0);
    filas.sort((a, b) => b.ms - a.ms);
    const seg = ms => (ms / 1000).toFixed(2) + " s";
    const kb  = b  => (b / 1024).toFixed(0) + " KB";

    box.innerHTML = `
      <div class="modal-detail-row"><span class="modal-detail-lbl">Primera consulta (arranque en frío)</span><span class="modal-detail-val">${seg(cold)}</span></div>
      <div class="modal-detail-row"><span class="modal-detail-lbl">Las 12 consultas en serie</span><span class="modal-detail-val">${seg(suma)}</span></div>
      <div class="modal-detail-row"><span class="modal-detail-lbl">Las 12 juntas (como hace la app hoy)</span><span class="modal-detail-val"><b>${seg(lote)}</b></span></div>
      <div class="modal-detail-row"><span class="modal-detail-lbl">Datos descargados</span><span class="modal-detail-val">${kb(pesoTotal)}</span></div>
      <p class="cfg-note" style="margin-top:10px">Si el lote junto tarda casi lo mismo que las 12 en serie, el cuello de botella es la <b>cantidad</b> de consultas, no su peso: el servidor las atiende de a una.</p>
      <table class="pj-table" style="margin-top:8px">
        <thead><tr><th>Consulta</th><th>Tiempo</th><th>Filas</th><th>Peso</th></tr></thead>
        <tbody>${filas.map(f => `
          <tr>
            <td>${esc(f.nombre)}${f.err ? ` <span style="color:var(--red)">(${esc(f.err)})</span>` : ""}</td>
            <td class="mono" style="${f.ms > 2000 ? "color:var(--warn)" : ""}">${seg(f.ms)}</td>
            <td class="mono">${f.items === null ? "—" : f.items}</td>
            <td class="mono">${kb(f.peso)}</td>
          </tr>`).join("")}</tbody>
      </table>`;
    setBtnState(btnId, "saved");
  } catch (e) {
    setBtnState(btnId, "error");
    box.innerHTML = `<p class="cfg-note" style="color:var(--red)">Error: ${esc(e.message)}</p>`;
  }
}

    }
    // Agrupado por área, errores primero, para que se lea como una lista de tareas.

    }).join("");
    box.innerHTML = `

        <span style="color:var(--red)">● ${r.errores} error${r.errores!==1?"es":""}</span>
        &nbsp;·&nbsp;
        <span style="color:var(--warn)">▲ ${r.avisos} aviso${r.avisos!==1?"s":""}</span>
      </p>
      ${bloques}
      ${r.reparables ? `
        <div style="margin-top:14px;padding:10px;border:1px solid var(--warn);border-radius:8px">

  } catch(e) {
    hideOverlay();

// ── Auditoría de movimientos (Tarea 7) ───────────────────────────
function runAudit() {
  const rubrosByCod = {};
  for (const r of RUBROS) rubrosByCod[r.cod] = r;
  const nombresJug = new Set([...jugadores, ...grupos].map(j => j.nombre.toLowerCase().trim()));
  const nombresAdh = new Set(adherentes.map(a => a.nombre.toLowerCase().trim()));

  const problemas = []; // { id, fecha, concepto, motivo }
  for (const m of movimientos) {
    const motivos = [];
    const cat = rubrosByCod[m.codRubro];
    if (m.codRubro && (!cat || cat.nombre !== m.rubro)) motivos.push("Rubro fuera de catálogo o desincronizado con CodRubro");
    if (m.jugadorCT && !nombresJug.has(m.jugadorCT.toLowerCase().trim())) motivos.push("Jugador/CT no está en la lista");
    if (m.adherente && !nombresAdh.has(m.adherente.toLowerCase().trim())) motivos.push("Adherente no está en la lista");
    if (!m.tipo) motivos.push("Tipo vacío");
    else if (m.tipo === "INGRESO" && (m.egreso > 0 || !(m.ingreso > 0))) motivos.push("Tipo INGRESO incoherente con Egreso/Ingreso");
    else if (m.tipo === "EGRESO"  && (m.ingreso > 0 || !(m.egreso > 0))) motivos.push("Tipo EGRESO incoherente con Egreso/Ingreso");
    if (motivos.length) problemas.push({ id: m.id, fecha: m.fecha, concepto: m.concepto, motivos });
  }

  const el = document.getElementById("audit-result");
  if (!el) return;
  if (!problemas.length) { el.innerHTML = `<p class="note">✓ Sin inconsistencias detectadas</p>`; return; }
  el.innerHTML = `
    <p class="note" style="margin-bottom:8px"><b>${problemas.length}</b> movimientos con inconsistencias:</p>
    ${problemas.slice(0,100).map(p => `
      <div class="entity-item" style="flex-direction:column;align-items:stretch;gap:4px">
        <div style="display:flex;justify-content:space-between">
          <span class="entity-name">${esc(p.fecha)} — ${esc(p.concepto)||"—"}</span>
          <button class="btn-sm accent" onclick="editMovimiento('${p.id}')">Editar</button>
        </div>
        <div style="font-size:11px;color:var(--red)">${p.motivos.map(esc).join(" · ")}</div>
      </div>`).join("")}
    ${problemas.length > 100 ? `<p class="note">…y ${problemas.length-100} más</p>` : ""}
  `;
}

// ── Excel Export ──────────────────────────────────────────────
// Arma headers + filas para un array de movimientos, en el formato común
// usado por exportExcel() y exportExcelFiltrado()
function movimientosToExcelRows(data) {
  const headers = ["MES","Fecha","Cód. Rubro","Rubro","CONCEPTO",
                   "# EGRESOS","# INGRESOS","# MONTO FINAL","SALDO",
                   "CUENTA","CUENTA DESTINO","MODO PAGO","Jug/Ct","Adherente","Partido","Observacion","Comprobante"];
  let saldo = 0;
  const rows = data.map(m => {
    const ing = m.tipo==="INGRESO" ? m.ingreso : 0;
    const egr = m.tipo==="EGRESO"  ? m.egreso  : 0;
    if (m.tipo !== "INTERNO") saldo += ing - egr;
    const p = m.partidoId ? partidos.find(x => x.id === m.partidoId) : null;
    const partidoLbl = p ? `${p.numeroFecha} — ${p.rival}` : "";
    return [
      m.mes, m.fecha, m.codRubro, m.rubro, m.concepto,
      egr||"", ing||"", m.montoFinal||"", saldo,
      m.cuenta, m.tipo==="INTERNO" ? (m.cuentaDestino||"") : "", m.modoPago, m.jugadorCT||"", m.adherente||"",
      partidoLbl, m.observacion||"", m.comprobante||""
    ];
  });
  return { headers, rows };
}

// mes: "YYYY-MM" para exportar solo ese mes, o null/"" para exportar todo el histórico
function exportExcel(mes) {
  if (typeof XLSX === "undefined") { toast("SheetJS no cargó", "err"); return; }
  let data = mes
    ? movimientos.filter(m => getMes(m.fecha) === mes)
    : [...movimientos];
  data = data.sort((a,b) => a.fecha.localeCompare(b.fecha));

  const { headers, rows } = movimientosToExcelRows(data);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws["!cols"] = [8,12,8,30,30,12,12,12,12,12,14,14,20,20,24,20,14].map(w=>({wch:w}));

  XLSX.writeFile(wb, fname);

}

// ── Exportar pendientes de reintegro (rubro médico) ──────────────
// Para cada jugador que HOY tiene algo pendiente (todos los años, sin importar el año
// seleccionado en pantalla), vuelca todo su historial de rubro 21 — no solo lo pendiente —
// para que sirva de comprobante completo al reclamar. Los egresos que deberían tener
// reintegro y todavía no lo tienen se remarcan con "⚠ SIN REINTEGRO" en el concepto
// (SheetJS gratuito no permite colorear celdas al escribir el .xlsx).
function exportarPendientesReintegro() {
  if (typeof XLSX === "undefined") { toast("SheetJS no cargó", "err"); return; }
  const conPendiente = calcReintegrosPorJugador("").filter(r => r.pendiente > 0);
  if (!conPendiente.length) { toast("No hay jugadores con reintegros pendientes", "ok"); return; }
  const { porEgreso } = buildVinculosIndex();

  const headers = ["Jugador","Fecha","Movimiento","Monto","Abonado","Reintegrado"];
  const rows = [];
  for (const r of conPendiente) {
    const movsJugador = movimientos
      .filter(m => m.codRubro === "21" && (m.jugadorCT || "Sin jugador") === r.jugador && (m.tipo === "EGRESO" || m.tipo === "INGRESO"))
      .sort((a,b) => a.fecha.localeCompare(b.fecha));
    for (const m of movsJugador) {
      if (m.tipo === "EGRESO") {
        const vinculado  = porEgreso[m.id] || 0;
        const pendMov    = m.egreso - vinculado;
        const marcado    = m.seguroReintegro && pendMov > TOL;
        rows.push([
          r.jugador, m.fecha,
          (marcado ? "⚠ SIN REINTEGRO — " : "") + (m.concepto || ""),
          m.egreso, m.egreso, m.seguroReintegro ? vinculado : ""
        ]);
      } else {
        rows.push([r.jugador, m.fecha, m.concepto || "", m.ingreso, "", m.ingreso]);
      }
    }
  }

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws["!cols"] = [22,12,42,12,12,12].map(w => ({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws, "Pendientes reintegro");
  XLSX.writeFile(wb, "reintegros_pendientes_" + today() + ".xlsx");
  toast("Excel exportado ✓", "ok");
}

// ── Excel Import ──────────────────────────────────────────────
async function importExcel(event) {
  if (typeof XLSX === "undefined") { toast("SheetJS no cargó", "err"); return; }
  const file = event.target.files[0];
  if (!file) return;
  showOverlay("Importando…");
  try {
    const buf  = await file.arrayBuffer();
    const wb   = XLSX.read(buf);
    const ws   = wb.Sheets[wb.SheetNames[0]];
    const rows = XLSX.utils.sheet_to_json(ws, { header:1, defval:"" });
    if (rows.length < 2) { hideOverlay(); toast("El archivo está vacío", "err"); return; }

    const header = rows[0].map(h => String(h).trim().toUpperCase());
    const idxOf  = (names) => { for(const n of names){ const i=header.indexOf(n.toUpperCase()); if(i>=0) return i; } return -1; };
    const iMes   = idxOf(["MES"]);
    const iFecha = idxOf(["FECHA"]);
    const iCod   = idxOf(["CÓD. RUBRO","COD. RUBRO","CODIGO","COD"]);
    const iRubro = idxOf(["RUBRO"]);
    const iConc  = idxOf(["CONCEPTO"]);
    const iEgr   = idxOf(["# EGRESOS","EGRESOS","EGRESO"]);
    const iIng   = idxOf(["# INGRESOS","INGRESOS","INGRESO"]);
    const iMonto = idxOf(["# MONTO FINAL","MONTO FINAL","MONTO"]);
    const iCuenta= idxOf(["CUENTA"]);
    const iModo  = idxOf(["MODO PAGO","MODOPAGO"]);
    const iJug   = idxOf(["JUG/CT","JUGADOR"]);
    const iAdh   = idxOf(["ADHERENTE"]);
    const iObs   = idxOf(["OBSERVACION","OBSERVACIÓN"]);
    const iComp  = idxOf(["COMPROBANTE"]);

    const importedMovs = [];
    const sinRubro = [], sinJugador = [], sinAdherente = [];
    const jugNombres = new Set([...jugadores, ...grupos].map(j => j.nombre.toLowerCase().trim()));
    const adhNombres = new Set(adherentes.map(a => a.nombre.toLowerCase().trim()));

    for (let i = 1; i < rows.length; i++) {
      const r = rows[i];
      const egr   = parseFloat(r[iEgr]  || 0) || 0;
      const ing   = parseFloat(r[iIng]  || 0) || 0;
      const monto = parseFloat(r[iMonto]|| 0) || Math.max(egr, ing);
      const tipo  = ing > 0 ? "INGRESO" : egr > 0 ? "EGRESO" : "INTERNO";
      const fecha = iFecha >= 0 ? normFecha(String(r[iFecha]||"")) : today();
      const mes   = iMes >= 0 ? String(r[iMes]||"").replace("-","") : fecha.slice(0,7).replace("-","");
      let codRubro = iCod   >= 0 ? String(r[iCod]  ||"").trim() : "";
      let rubro    = iRubro >= 0 ? String(r[iRubro]||"").trim() : "";
      let categoria = "";
      if (!rubro && !ing && !egr) continue; // skip empty rows

      // Canonicalizar contra el catálogo: por cod si está, si no por nombre exacto.
      let catalogado = codRubro && RUBROS.find(x => x.cod === codRubro);
      if (!catalogado && rubro) catalogado = RUBROS.find(x => x.nombre.toLowerCase() === rubro.toLowerCase());
      if (catalogado) { codRubro = catalogado.cod; rubro = catalogado.nombre; categoria = catalogado.cat; }
      else if (rubro || codRubro) sinRubro.push({ fecha, codRubro, rubro, concepto: String(r[iConc]||"") });

      const jugadorCT = iJug >= 0 ? String(r[iJug]||"").trim() : "";
      if (jugadorCT && !jugNombres.has(jugadorCT.toLowerCase())) sinJugador.push({ fecha, jugadorCT });
      const adherente = iAdh >= 0 ? String(r[iAdh]||"").trim() : "";
      if (adherente && !adhNombres.has(adherente.toLowerCase())) sinAdherente.push({ fecha, adherente });

      importedMovs.push({
        id: uid(), mes, fecha,
        codRubro, rubro, categoria,
        concepto: iConc  >= 0 ? String(r[iConc] ||"") : "",
        egreso: egr, ingreso: ing, montoFinal: monto,
        cuenta:   iCuenta>= 0 ? String(r[iCuenta]||cuentas[0]||"") : (cuentas[0]||""),
        cuentaDestino: "",
        modoPago: iModo  >= 0 ? String(r[iModo] ||"") : "",
        jugadorCT, adherente,
        observacion: iObs>= 0 ? String(r[iObs]  ||"") : "",
        comprobante: iComp>=0 ? String(r[iComp] ||"") : "",
        tipo,
      });
    }

    if (!importedMovs.length) { hideOverlay(); toast("No se encontraron datos válidos", "err"); return; }

    // Save in batches
    let saved = 0;
    for (const mov of importedMovs) {
      await Storage.saveMov(mov);
      saved++;
    }
    // Reload
    const r = await Storage.listMov();
    if (r.ok) movimientos = (r.movimientos || []).map(m => ({ ...m, jugadorCT: stripGrpPrefix(m.jugadorCT) }));
    updateBadge();
    saveSnapshotToCache();
    hideOverlay();
    toast(`${saved} movimientos importados ✓`, "ok");
    renderConfig();
    if (sinRubro.length || sinJugador.length || sinAdherente.length) {
      showImportWarningsModal(sinRubro, sinJugador, sinAdherente);
    }
  } catch(e) {
    hideOverlay();
    toast("Error importando: " + e.message, "err");
  }
}

function showImportWarningsModal(sinRubro, sinJugador, sinAdherente) {
  const list = (arr, render) => arr.slice(0,30).map(render).join("") +
    (arr.length > 30 ? `<p class="note">…y ${arr.length-30} más</p>` : "");
  document.getElementById("modal-root").innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div style="text-align:center;font-size:14px;font-weight:600;margin-bottom:10px">⚠️ Filas a revisar</div>

// PWA — registro del service worker + aviso de nueva versión

// Lee SW_VERSION directamente del archivo sw.js (una sola fuente de verdad para el número
// de versión) y lo deja en appVersionActual para que Config lo muestre.
async function loadAppVersion() {
  try {
    const resp = await fetch("sw.js", { cache: "no-store" });
    const text = await resp.text();
    const m = text.match(/SW_VERSION\s*=\s*["']([^"']+)["']/);
    appVersionActual = m ? m[1] : "?";
  } catch (e) {
    appVersionActual = "?";
  }
  if (currentTab === "config") renderConfig();
}

function registerServiceWorker() {
  if (!("serviceWorker" in navigator)) return;
  navigator.serviceWorker.register("sw.js").then((reg) => {
    // Ya hay una versión nueva esperando (instalada mientras la app estaba cerrada)
    if (reg.waiting) showUpdateBanner(reg);
    reg.addEventListener("updatefound", () => {
      const nuevo = reg.installing;
      if (!nuevo) return;
      nuevo.addEventListener("statechange", () => {
        if (nuevo.state === "installed" && navigator.serviceWorker.controller) {
          showUpdateBanner(reg);
        }
      });
    });
    // Revisa si hay una versión nueva publicada cada vez que la app vuelve a primer plano
    document.addEventListener("visibilitychange", () => {
      if (document.visibilityState === "visible") reg.update();
    });
  }).catch(() => {});

  // Cuando el SW nuevo toma control, recargamos una sola vez para mostrar la versión actualizada
  let reloaded = false;
  navigator.serviceWorker.addEventListener("controllerchange", () => {
    if (reloaded) return;
    reloaded = true;
    window.location.reload();
  });
}

function showUpdateBanner(reg) {
  const root = document.getElementById("update-banner-root");
  if (!root) return;
  root.innerHTML = `
    <div class="update-banner">
      <span>🔄 Hay una versión nueva de la app</span>
      <button onclick="applyUpdate()">Actualizar</button>
    </div>`;
  window._pendingSwReg = reg;
}
async function applyUpdate() {
  const btn = document.querySelector(".update-banner button");
  if (btn?.disabled) return; // evita doble toque
  if (btn) { btn.disabled = true; btn.textContent = "Actualizando…"; }
  showOverlay("Actualizando la app…");
  try {
    // La referencia guardada puede haber quedado vieja: pedimos el registration actual
    let reg = window._pendingSwReg;
    if (!reg?.waiting) reg = await navigator.serviceWorker.getRegistration() || reg;
    if (!reg?.waiting) { try { await reg?.update(); } catch (e) { /* sin red: recargamos igual */ } }
    if (reg?.waiting) {
      reg.waiting.postMessage({ type: "SKIP_WAITING" });
      // El controllerchange de arriba recarga la app; si en 3s no pasó (SW trabado,
      // navegador viejo), recargamos a mano — index.html se sirve network-first,
      // así que la recarga trae la versión nueva igual.
      setTimeout(() => window.location.reload(), 3000);
    } else {
      // No hay SW esperando (ya se activó o el registration se perdió): recarga directa
      window.location.reload();
    }
  } catch (e) {
    hideOverlay();
    if (btn) { btn.disabled = false; btn.textContent = "Actualizar"; }
    toast("No se pudo actualizar: " + e.message, "err");
  }
}

// Chequeo manual desde ⚙️ Config: fuerza reg.update() y, si hay una versión nueva
// lista, la activa al instante (el controllerchange de arriba recarga la app).
async function checkAppUpdate() {
  const btn = document.getElementById("btn-buscar-update");
  if (btn?.disabled) return; // evita doble envío
  if (!("serviceWorker" in navigator)) { toast("Este navegador no soporta la app instalable", "err"); return; }
  if (btn) { btn.disabled = true; btn.dataset.label = btn.textContent; btn.textContent = "Buscando…"; }
  try {
    const reg = await navigator.serviceWorker.getRegistration();
    if (!reg) { toast("El service worker no está registrado todavía — recargá la app", "err"); return; }
    await reg.update();
    // Si encontró una versión nueva, esperamos a que termine de instalarse
    const nuevo = reg.installing;
    if (nuevo) {
      await new Promise((res) => nuevo.addEventListener("statechange", () => {
        if (nuevo.state !== "installing") res();
      }));
    }
    if (reg.waiting) {
      toast("Versión nueva encontrada — actualizando…", "ok");
      reg.waiting.postMessage({ type: "SKIP_WAITING" });
    } else {
      toast("Ya estás en la última versión ✓", "ok");
    }
  } catch (e) {
    toast(isNetworkError(e) ? "Sin conexión — no se pudo buscar actualizaciones" : "Error: " + e.message, "err");
  } finally {
    const b = document.getElementById("btn-buscar-update");
    if (b) { b.disabled = false; if (b.dataset.label) { b.textContent = b.dataset.label; delete b.dataset.label; } }
  }
}

document.addEventListener("keydown", (e) => {
  const tag = (document.activeElement && document.activeElement.tagName) || "";
  const typing = tag === "INPUT" || tag === "TEXTAREA" || tag === "SELECT";

  // Ctrl/Cmd + Enter guarda el movimiento desde cualquier campo del formulario "Nuevo"
  if ((e.ctrlKey || e.metaKey) && e.key === "Enter" && currentTab === "nuevo") {
    e.preventDefault();
    saveMovimiento();
    return;
  }
  // Escape cierra un modal abierto
  if (e.key === "Escape") {
    const modalRoot = document.getElementById("modal-root");
    if (modalRoot && modalRoot.innerHTML.trim()) { modalRoot.innerHTML = ""; return; }
  }
  // Navegación rápida entre pestañas con Ctrl+Alt+número. Se usa Ctrl+Alt (en vez de solo
  // Alt) para no chocar con atajos propios del navegador/sistema operativo que sí usan Alt+número.
  if ((e.ctrlKey || e.metaKey) && e.altKey && !typing) {
    const map = { "1":"nuevo", "2":"movimientos", "3":"resumen", "4":"entidades", "5":"config" };
    if (map[e.key]) { e.preventDefault(); goTab(map[e.key]); }
  }
});
