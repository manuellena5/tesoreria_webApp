    ${resumenSubTab === "adherentes" ? renderAdherentesResumen() : ""}
    ${resumenSubTab === "jugadoresRes" ? renderJugadoresResumen() : ""}
    ${resumenSubTab === "eventosRes" ? renderEventosResumen() : ""}
    ${resumenSubTab === "patrimonio" ? renderPatrimonio() : ""}
  `);
}

// ── Resumen > Por Partido — agrupa movimientos con partidoId por partido.
// "Otros Egr." es el catch-all de egresos que no son Buffet (rubro 2) ni
// Gastos Cancha (rubros 12/13/14b/36): antes se restaban en Total Neto sin
// mostrarse en ninguna columna, ahora quedan desglosados. ─────────────────
/** Suma `monto` (ya sea el total del movimiento o la porción imputada a un partido) al acumulador
 *  `pg` de un partido, clasificando por codRubro del movimiento — los ítems heredan el codRubro
 *  de su movimiento padre, no tienen uno propio. */
function sumarMontoAPartido(pg, m, monto, repartido) {
  // Se guarda además el movimiento con el monto realmente imputado a ESTE partido — que no es el
  // total del movimiento cuando viene prorrateado por itemsDetalle — para el detalle desplegable.
  // Al hacerlo acá, el detalle no puede desincronizarse de lo que suman las columnas.
  pg.movs.push({ ...m, montoAplicado: m.tipo === "INGRESO" ? monto : -monto, repartido: !!repartido });
  if (m.tipo === "INGRESO") {
    pg.ingresos += monto;
    if (m.codRubro === "2")                             pg.buffetIng   += monto;
    else if (["1","4"].includes(m.codRubro))             pg.entradas    += monto;
    else                                                 pg.otrosIng    += monto;
  } else {
    pg.egresos += monto;
    if (m.codRubro === "2")                              pg.buffetEgr    += monto;
    else if (["12","13","14b","36"].includes(m.codRubro)) {
      pg.gastosCancha += monto;
      // Desglose fino para la placa de redes (ver armarPlacaJson): la tabla muestra los gastos de
      // cancha en una sola columna, pero el flyer pide un renglón por servicio. El rubro 36 es uno
      // solo ("SERVICIO MEDICO Y AMBULANCIA | CANCHA"), así que se parte por el texto del concepto.
      if      (m.codRubro === "13")  pg.policia   += monto;
      else if (m.codRubro === "12")  pg.arbitros  += monto;
      else if (m.codRubro === "14b") pg.filmacion += monto;
      else if (normStr(m.concepto).includes("ambulancia")) pg.ambulancia += monto;
      else                                                 pg.enfermera  += monto;
    }
    else                                                  pg.otrosEgr     += monto;
  }
}

const PARTIDO_RES_CATS_EXCLUIDAS = ["Movilidad", "Jugadores y Cuerpo Técnico"];

// Público pagado del partido: damas + caballeros. Devuelve null —no 0— cuando no hay ningún dato
// cargado, para poder distinguir "todavía no lo anotamos" de "no vino nadie". Los partidos
// anteriores a que existiera el campo caen siempre en null, así que todo lo que promedie o sume
// asistencia tiene que filtrarlos en vez de tratarlos como cero y ensuciar el promedio.
function partidoEntradasTotal(p) {
  if (!p) return null;
  const d = p.entradasDamas, c = p.entradasCaballeros;
  const vacio = v => v === "" || v == null || !Number.isFinite(Number(v));
  if (vacio(d) && vacio(c)) return null;
  return (vacio(d) ? 0 : Number(d)) + (vacio(c) ? 0 : Number(c));
}

// Un movimiento apunta a un partido por su propio partidoId o por el de alguno de sus ítems.
function movTienePartido(m) {
  return !!(m.partidoId || (m.itemsDetalle||[]).some(it => it.partidoId));
}

// Partidos a los que apunta un movimiento. Si tiene desglose por ítems manda el desglose, igual
// que en la imputación de calcPartidoResumenRows; si no, el partidoId del movimiento.
function partidosDeMov(m) {
  const its = [...new Set((m.itemsDetalle||[]).filter(it => it.partidoId).map(it => it.partidoId))];
  return its.length ? its : (m.partidoId ? [m.partidoId] : []);
}

// Monto con signo de un movimiento que la tabla NO computa (no viene prorrateado por partido).
function montoMovNoComputado(m) {
  if (m.tipo === "INGRESO") return  Number(m.ingreso || 0);
  if (m.tipo === "EGRESO")  return -Number(m.egreso  || 0);
  return Number(m.montoFinal || 0);   // INTERNO / AJUSTE
}

function calcPartidoResumenRows() {
  const movsPartido = movimientos.filter(m =>
    (m.tipo === "INGRESO" || m.tipo === "EGRESO") &&
    !PARTIDO_RES_CATS_EXCLUIDAS.includes(m.categoria) &&
    movTienePartido(m)
  );
  // Movimientos que apuntan a un partido pero que esta tabla deja afuera: sueldos y premios
  // (Jugadores y Cuerpo Técnico), Movilidad, y los internos/ajustes. No entran en ninguna columna,
  // así que al abrir el detalle se listan aparte marcados como no computados — es la pregunta que
  // aparece siempre al mirar un total del partido y no encontrarle todos los gastos.
  const movsNoComputados = movimientos.filter(m =>
    movTienePartido(m) &&
    (!(m.tipo === "INGRESO" || m.tipo === "EGRESO") || PARTIDO_RES_CATS_EXCLUIDAS.includes(m.categoria))
  );
  const noComputadosMap = {};
  for (const m of movsNoComputados) {
    for (const pid of partidosDeMov(m)) (noComputadosMap[pid] || (noComputadosMap[pid] = [])).push(m);
  }
  const partidoMap = {};
  // policia/arbitros/enfermera/ambulancia/filmacion son el desglose de gastosCancha (su suma lo iguala):
  // no los usa la tabla, sólo la placa de redes.
  const partidoPg = id => partidoMap[id] || (partidoMap[id] = { ingresos:0, egresos:0, buffetIng:0, buffetEgr:0, gastosCancha:0, entradas:0, otrosIng:0, otrosEgr:0,
                                                                policia:0, arbitros:0, enfermera:0, ambulancia:0, filmacion:0, movs:[] });

  for (const m of movsPartido) {
    const total = m.tipo === "INGRESO" ? m.ingreso : m.egreso;
    const itemsConPartido = (m.itemsDetalle||[]).filter(it => it.partidoId);

    if (!itemsConPartido.length) {
      // Movimiento histórico o cargado a mano: sin desglose por partido, todo a m.partidoId (fallback de siempre).
      sumarMontoAPartido(partidoPg(m.partidoId), m, total);
      continue;
    }

    // Movimiento con desglose (ej. pago de jugador que cubrió varios partidos + premios): cada
    // ítem con partido va al suyo, y los ítems sin partido (premios/ajustes) se prorratean entre
    // los partidos presentes en el mismo movimiento — la suma imputada siempre cierra con `total`.
    const partidosDelMov  = [...new Set(itemsConPartido.map(it => it.partidoId))];
    const sumaConPartido  = itemsConPartido.reduce((s, it) => s + Number(it.monto||0), 0);
    const resto           = total - sumaConPartido; // premios/ajustes sin partido de este movimiento
    const porPartido = {};
    partidosDelMov.forEach(pid => porPartido[pid] = 0);
    itemsConPartido.forEach(it => porPartido[it.partidoId] += Number(it.monto||0));
    if (resto !== 0) {
      if (sumaConPartido !== 0) {
        partidosDelMov.forEach(pid => porPartido[pid] += resto * (porPartido[pid] / sumaConPartido));
      } else {
        partidosDelMov.forEach(pid => porPartido[pid] += resto / partidosDelMov.length);
      }
    }
    partidosDelMov.forEach(pid => sumarMontoAPartido(partidoPg(pid), m, porPartido[pid], true));
  }

  return partidos
    .filter(p => partidoMap[p.id])
    .map(p => {
      const pg = partidoMap[p.id];
      return { p, pg, netoBuffet: pg.buffetIng - pg.buffetEgr, totalNeto: pg.ingresos - pg.egresos,
               noComputados: noComputadosMap[p.id] || [] };
    });
}

function partidoResLabel(p) { return `${p.numeroFecha} — ${p.rival}`; }

function partidoResOrdenValor(r, col) {
  switch (col) {
    case "fecha":        return r.p.fecha;
    // Los partidos sin asistencia cargada van al fondo en el orden descendente (el default), en vez
    // de mezclarse con los que efectivamente no tuvieron público.
    case "publico":       return partidoEntradasTotal(r.p) ?? -1;
    case "buffet":        return r.pg.buffetIng;
    case "buffetEgr":     return r.pg.buffetEgr;
    case "gastosCancha":  return r.pg.gastosCancha;
    case "otrosEgr":      return r.pg.otrosEgr;
    case "entradas":      return r.pg.entradas;
    case "otrosIng":      return r.pg.otrosIng;
    case "netoBuffet":    return r.netoBuffet;
    case "totalNeto":     return r.totalNeto;
    default:              return 0;
  }
}

function ordenarPartidoRes(rows) {
  const col = partidoResOrdenCol, dir = partidoResOrdenDir;
  return [...rows].sort((a, b) => {
    const va = partidoResOrdenValor(a, col), vb = partidoResOrdenValor(b, col);
    const cmp = typeof va === "string" ? va.localeCompare(vb, "es", { sensitivity: "base" }) : va - vb;
    return cmp * dir;
  });
}

// Click en un header de columna: primer clic ordena de mayor a menor (o más
// reciente primero, para fecha); un segundo clic sobre la misma la invierte
// — misma convención que setJugadorResOrden.
function setPartidoResOrden(col) {
  if (partidoResOrdenCol === col) partidoResOrdenDir *= -1;
  else { partidoResOrdenCol = col; partidoResOrdenDir = -1; }
  document.getElementById("partido-res-body").innerHTML = renderPartidoResumenBody();
}

function setPartidoResFiltroTorneo(v) {
  partidoResFiltroTorneo = v;
  document.getElementById("partido-res-body").innerHTML = renderPartidoResumenBody();
}

function setPartidoResFiltroPartido(v) {
  partidoResFiltroPartidoId = v;
  document.getElementById("partido-res-body").innerHTML = renderPartidoResumenBody();
}

function togglePartidoResDetalle(id) {
  if (partidoResExpandido.has(id)) partidoResExpandido.delete(id);
  else partidoResExpandido.add(id);
  document.getElementById("partido-res-body").innerHTML = renderPartidoResumenBody();
}

// Segundo nivel de la tabla: los movimientos del partido, con el mismo componente de detalle
// (filtro, orden y selector de columnas) que usan Adherentes, Jugadores y Eventos.
function renderPartidoResDetalle(r) {
  const detItem = (m, monto, extra) => {
    const mesRaw = mesFromRecord(m);
    return {
      fechaRaw: m.fecha || "",
      fechaD:   m.fecha ? m.fecha.slice(8)+"/"+m.fecha.slice(5,7)+"/"+m.fecha.slice(0,4) : "",
      mesRaw, mesTxt: mesLabel(mesRaw),
      concepto: m.concepto || "", monto,
      rubro: m.rubro || "", categoria: m.categoria || "",
      entidad: m.jugadorCT || m.adherente || m.cuenta || "",
      extra
    };
  };
  const porFecha = (a, b) => (a.fecha||"").localeCompare(b.fecha||"");

  // Primero lo que la tabla sí suma, con el monto imputado a este partido.
  const items = [...r.pg.movs].sort(porFecha).map(m =>
    detItem(m, m.montoAplicado, m.repartido ? "parte de un pago repartido entre varios partidos" : ""));

  // Después lo que apunta al partido pero queda fuera de las columnas, marcado como tal: así el
  // detalle explica por qué el Total Neto no incluye, por ejemplo, los sueldos de la fecha.
  for (const m of [...r.noComputados].sort(porFecha)) {
    items.push(detItem(m, montoMovNoComputado(m), "⊘ no computado en esta tabla"));
  }
  return renderDetTabla(`par_${escJs(r.p.id)}`, items);
}

function thOrdenPartidoRes(col, label) {
  const active = partidoResOrdenCol === col;
  const arrow = active ? `<span class="rt-arrow">${partidoResOrdenDir===1?"▲":"▼"}</span>` : "";
  return `<th class="rt-sortable" onclick="setPartidoResOrden('${col}')">${label}${arrow}</th>`;
}

function partidoResFiltrarYOrdenar() {
  let rows = calcPartidoResumenRows();
  if (partidoResFiltroTorneo)    rows = rows.filter(r => r.p.torneo === partidoResFiltroTorneo);
  if (partidoResFiltroPartidoId) rows = rows.filter(r => r.p.id === partidoResFiltroPartidoId);
  return ordenarPartidoRes(rows);
}

function renderPartidoResumenBody() {
  const rows = partidoResFiltrarYOrdenar();
  if (!rows.length) return `<p class="note">Sin partidos para estos filtros</p>`;

  let totBuffetIng=0, totBuffetEgr=0, totGastosCancha=0, totOtrosEgr=0, totEntradas=0, totOtrosIng=0, totNeto=0;
  let totPublico=0;

  const partidoRows = rows.map(r => {
    const {p, pg, netoBuffet, totalNeto} = r;
    const publico = partidoEntradasTotal(p);
    if (publico !== null) totPublico += publico;
    totBuffetIng    += pg.buffetIng;
    totBuffetEgr    += pg.buffetEgr;
    totGastosCancha += pg.gastosCancha;
    totOtrosEgr     += pg.otrosEgr;
    totEntradas     += pg.entradas;
    totOtrosIng     += pg.otrosIng;
    totNeto         += totalNeto;
    const netoClass  = totalNeto >= 0 ? "neto-pos" : "neto-neg";
    const netoSign   = totalNeto >= 0 ? "+" : "−";
    const isExp      = partidoResExpandido.has(p.id);
    const nNoComp    = r.noComputados.length;
    return `<tr class="reint-row" onclick="togglePartidoResDetalle('${esc(escJs(p.id))}')">
      <td><span style="color:var(--text3)">${isExp?"▾":"▸"}</span> ${esc(partidoResLabel(p))}${
        nNoComp ? ` <span style="color:var(--text3);font-size:11px" title="${nNoComp} movimiento${nNoComp!==1?"s":""} de este partido que la tabla no computa">⊘${nNoComp}</span>` : ""}</td>
      <td title="${publico===null?"Asistencia no cargada":esc((p.entradasCaballeros||0)+" caballeros · "+(p.entradasDamas||0)+" damas")}">${publico===null?`<span style="color:var(--text3)">—</span>`:publico}</td>
      <td>${pg.buffetIng ? fmt(pg.buffetIng) : ""}</td>
      <td class="egr">${pg.buffetEgr ? fmt(pg.buffetEgr) : ""}</td>
      <td class="egr">${pg.gastosCancha ? fmt(pg.gastosCancha) : ""}</td>
      <td class="egr">${pg.otrosEgr ? fmt(pg.otrosEgr) : ""}</td>
      <td>${pg.entradas ? fmt(pg.entradas) : ""}</td>
      <td>${pg.otrosIng ? fmt(pg.otrosIng) : ""}</td>
      <td class="${netoBuffet>=0?"ing":"egr"}">${netoBuffet!==0?(netoBuffet>=0?"+":"−")+fmt(netoBuffet):""}</td>
      <td class="${netoClass}">${netoSign}${fmt(totalNeto)}</td>
      <td><button class="btn-sm" title="JSON para la placa de redes" onclick="event.stopPropagation();openPlacaModal('${esc(escJs(p.id))}')">🖼️</button></td>
    </tr>${isExp ? `
    <tr><td colspan="11" style="padding:0;border-bottom:none">${renderPartidoResDetalle(r)}</td></tr>` : ""}`;
  }).join("");

  const totNetoClass = totNeto >= 0 ? "neto-pos" : "neto-neg";
  const totRows = `<tr>
    <td>TOTALES</td>
    <td>${totPublico || ""}</td>
    <td>${fmt(totBuffetIng)}</td>
    <td class="egr">${fmt(totBuffetEgr)}</td>
    <td class="egr">${fmt(totGastosCancha)}</td>
    <td class="egr">${fmt(totOtrosEgr)}</td>
    <td>${fmt(totEntradas)}</td>
    <td>${fmt(totOtrosIng)}</td>
    <td class="${(totBuffetIng-totBuffetEgr)>=0?"ing":"egr"}">${(totBuffetIng-totBuffetEgr)>=0?"+":"−"}${fmt(totBuffetIng-totBuffetEgr)}</td>
    <td class="${totNetoClass}">${totNeto>=0?"+":"−"}${fmt(totNeto)}</td>
    <td></td>
  </tr>`;

  return `
    <div style="overflow-x:auto;margin-bottom:8px">
      <table class="partido-table">
        <thead><tr>
          ${thOrdenPartidoRes("fecha","Partido")}
          ${thOrdenPartidoRes("publico","Público")}
          ${thOrdenPartidoRes("buffet","Buffet")}
          ${thOrdenPartidoRes("buffetEgr","G.Buffet")}
          ${thOrdenPartidoRes("gastosCancha","G.Cancha")}
          ${thOrdenPartidoRes("otrosEgr","Otros Egr.")}
          ${thOrdenPartidoRes("entradas","Entradas")}
          ${thOrdenPartidoRes("otrosIng","Otros Ing.")}
          ${thOrdenPartidoRes("netoBuffet","Neto Buffet")}
          ${thOrdenPartidoRes("totalNeto","Total Neto")}
          <th></th>
        </tr></thead>
        <tbody>${partidoRows}${totRows}</tbody>
      </table>
    </div>`;
}

function exportPartidoResExcel() {
  if (typeof XLSX === "undefined") { toast("SheetJS no cargó", "err"); return; }

  const rows = partidoResFiltrarYOrdenar();
  if (!rows.length) { toast("No hay datos para exportar con estos filtros", "err"); return; }

  const headers = ["Partido","Torneo","Caballeros","Damas","Público","Buffet","G.Buffet","G.Cancha","Otros Egr.","Entradas","Otros Ing.","Neto Buffet","Total Neto"];
  const dataRows = rows.map(({p, pg, netoBuffet, totalNeto}) => [
    partidoResLabel(p), p.torneo || "",
    p.entradasCaballeros ?? "", p.entradasDamas ?? "", partidoEntradasTotal(p) ?? "",
    pg.buffetIng || "", pg.buffetEgr || "", pg.gastosCancha || "", pg.otrosEgr || "",
    pg.entradas || "", pg.otrosIng || "", netoBuffet || "", totalNeto || ""
  ]);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([headers, ...dataRows]);
  ws["!cols"] = [28,12,10,12,10,12,12,12,12,12,12,12,12].map(w => ({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws, "Por Partido");

  const torneoPart  = partidoResFiltroTorneo || "todos";
  const partidoPart = partidoResFiltroPartidoId ? "1partido" : "todos";
  XLSX.writeFile(wb, `por_partido_${torneoPart}_${partidoPart}_${today()}.xlsx`);
  toast("Excel exportado ✓", "ok");
}

// ── JSON para el generador de placas de redes ─────────────────────────────
// El flyer del balance de la fecha se arma en Placas_Recaudacion.html, que recibe el balance
// pegado como JSON en su cuadro "Importar / exportar datos". Este bloque genera ese JSON desde
// la misma agregación que alimenta la tabla Por Partido, así el saldo de la placa cuadra con la
// columna Total Neto por construcción y no hay dos cálculos que mantener en sincronía.
//
// Del contrato del generador: los egresos van con `m` negativo; `neg` es redundante ahí pero se
// manda igual porque es lo único que distingue un ingreso de un egreso cuando el monto es 0. Los
// renglones que comparten `g` se colapsan en la placa en una línea con el subtotal. `neto` es la
// etiqueta del total del bloque, no un número: el generador suma los items. El saldo final
// (suma de los netos) también lo calcula el generador, por eso no se emite.
const PLACA_G_SEGURIDAD = "Policía y árbitros";
const PLACA_G_SERVICIOS = "Enfermera, filmación y ambulancia";

function armarPlacaJson({p, pg}) {
  const r = n => Math.round(n || 0);  // montos al peso, sin decimales ni separadores: número JSON plano
  const fechaDMY = p.fecha ? p.fecha.slice(8)+"/"+p.fecha.slice(5,7)+"/"+p.fecha.slice(0,4) : "";
  return {
    fecha:   String(p.numeroFecha || ""),   // número de fecha del torneo, no una fecha calendario
    titulo:  "RECAUDACIÓN",
    sub:     "vs. " + (p.rival || "") + (fechaDMY ? " · " + fechaDMY : ""),
    final:   "SALDO FINAL",
    pie:     "@cdmitre · Fútbol Mayor",
    asisTit: "ASISTENCIA",
    // Se precarga con lo cargado en el partido. Si no hay dato va [] — exactamente lo de antes de
    // que existiera el campo — así que el generador sigue recibiendo lo que ya sabía manejar y el
    // caso "sin cargar" no cambia de comportamiento. El JSON es editable en el modal antes de
    // copiarlo, así que se puede corregir a mano igual que siempre.
    // Ojo: acá la clave del número es `n`, no `m`. Los renglones de los bloques usan `m`, pero el
    // generador lee la asistencia con `n` (ver readAsis/renderAsis en Placas_Recaudacion.html).
    // Con `m` la placa importa los conceptos y los deja todos en cero, sin avisar de nada.
    asistencia: partidoEntradasTotal(p) === null ? [] : [
      { c: "Caballeros", n: Number(p.entradasCaballeros || 0) },
      { c: "Damas",      n: Number(p.entradasDamas      || 0) },
    ],
    bloques: [
      { nombre: "BUFFET", neto: "NETO BUFFET", items: [
        { c: "Ingresos buffet (local + visitante)", m:  r(pg.buffetIng), g: "", neg: false },
        { c: "Gastos buffet",                       m: -r(pg.buffetEgr), g: "", neg: true  },
      ]},
      { nombre: "CANCHA", neto: "NETO CANCHA", items: [
        { c: "Venta entradas y tribuna", m:  r(pg.entradas),   g: "", neg: false },
        { c: "Otros ingresos (Sorteo)",  m:  r(pg.otrosIng),   g: "", neg: false },
        { c: "Policía",                  m: -r(pg.policia),    g: PLACA_G_SEGURIDAD, neg: true },
        { c: "Árbitros",                 m: -r(pg.arbitros),   g: PLACA_G_SEGURIDAD, neg: true },
        { c: "Enfermera",                m: -r(pg.enfermera),  g: PLACA_G_SERVICIOS, neg: true },
        { c: "Filmación",                m: -r(pg.filmacion),  g: PLACA_G_SERVICIOS, neg: true },
        { c: "Ambulancia",               m: -r(pg.ambulancia), g: PLACA_G_SERVICIOS, neg: true },
        { c: "Otros gastos (limpieza)",  m: -r(pg.otrosEgr),   g: "", neg: true },
      ]},
    ]
  };
}

// Suma de todos los items de todos los bloques = el saldo final que va a mostrar la placa.
// Se calcula acá sólo para contrastarlo contra el Total Neto de la tabla en el modal.
function placaSaldoFinal(json) {
  return json.bloques.reduce((s, b) => s + b.items.reduce((si, it) => si + it.m, 0), 0);
}

// Devuelve { json, totalNeto, label } del partido, o null si no tiene movimientos imputados.
function placaDatosDePartido(partidoId) {
  const row = calcPartidoResumenRows().find(r => r.p.id === partidoId);
  if (!row) return null;
  return { json: armarPlacaJson(row), totalNeto: row.totalNeto, label: partidoResLabel(row.p) };
}

// Estado del modal mientras está abierto: el JSON que se está editando más el Total Neto del
// partido, para poder contrastarlos. Se pisa en cada apertura.
let placaEdit = null;

// Una fila por renglón de la placa: el concepto es fijo (lo define el mapeo de rubros) y el monto
// es editable, siempre en positivo — el signo lo da `neg`, igual que en el resto de la app, donde
// los montos se guardan sin signo y el tipo decide. Espeja los renglones del generador de placas.
function renderPlacaCampos() {
  const j = placaEdit.json;
  const bloques = j.bloques.map((b, bi) => `
    <div style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--border);padding-bottom:4px">
        <span style="font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.07em">${esc(b.nombre)}</span>
        <span style="font-size:11px;color:var(--text3)">${esc(b.neto)}: <b id="placa-neto-${bi}"></b></span>
      </div>
      ${b.items.map((it, ii) => `
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
          <span style="flex:1;font-size:12.5px;color:var(--text2)">
            <span class="${it.neg ? "egr" : "ing"}">${it.neg ? "−" : "+"}</span> ${esc(it.c)}
          </span>
          <input class="inp" type="number" min="0" step="any" inputmode="decimal" placeholder="0"
                 style="flex:0 0 118px;text-align:right;padding:6px 9px;font-size:13px"
                 value="${Math.abs(it.m) || ""}" oninput="setPlacaMonto(${bi},${ii},this.value)">
        </div>`).join("")}
    </div>`).join("");

  // Asistencia: se precarga con lo cargado en el partido, pero se puede escribir acá para los
  // partidos viejos o para los que no se anotó en el momento. Editarla no toca el partido — es un
  // dato sólo para esta placa; para que quede guardado hay que cargarlo en el partido.
  const asistencia = `
    <div style="margin-top:12px">
      <div style="display:flex;justify-content:space-between;align-items:baseline;border-bottom:1px solid var(--border);padding-bottom:4px">
        <span style="font-size:11px;font-weight:600;color:var(--accent);letter-spacing:.07em">${esc(j.asisTit || "ASISTENCIA")}</span>
        <span style="font-size:11px;color:var(--text3)">TOTAL: <b id="placa-asis-total"></b></span>
      </div>
      ${["Caballeros", "Damas"].map(cat => `
        <div style="display:flex;align-items:center;gap:8px;margin-top:6px">
          <span style="flex:1;font-size:12.5px;color:var(--text2)">${cat}</span>
          <input class="inp" type="number" min="0" step="1" inputmode="numeric" placeholder="0"
                 style="flex:0 0 118px;text-align:right;padding:6px 9px;font-size:13px"
                 value="${placaEdit.asis[cat] || ""}" oninput="setPlacaAsistencia('${cat}',this.value)">
        </div>`).join("")}
      <p class="note" style="margin-top:6px">${placaEdit.asisDelPartido
        ? "Cargada en el partido."
        : "Este partido no tiene la asistencia cargada — lo que escribas acá va sólo a esta placa."}</p>
    </div>`;

  return `
    <div style="display:flex;gap:8px;margin-top:10px">
      <div class="field" style="flex:0 0 96px">
        <label>Fecha Nº</label>
        <input class="inp" type="text" style="padding:6px 9px;font-size:13px"
               value="${esc(j.fecha)}" oninput="setPlacaCampo('fecha',this.value)">
      </div>
      <div class="field" style="flex:1">
        <label>Bajada</label>
        <input class="inp" type="text" style="padding:6px 9px;font-size:13px"
               value="${esc(j.sub)}" oninput="setPlacaCampo('sub',this.value)">
      </div>
    </div>

}

function setPlacaAsistencia(cat, v) {
  placaEdit.asis[cat] = Math.max(0, Math.round(Number(v) || 0));
  aplicarAsistenciaPlaca();
  refrescarPlacaJson();
}

// Sólo van al JSON las categorías con gente. Si quedaron las dos en cero se emite [], que es lo que
// el generador ya sabía manejar desde antes de que existiera el campo: mandar "Caballeros 0" haría
// que la placa publique un cero que nadie contó.
function aplicarAsistenciaPlaca() {
  placaEdit.json.asistencia = ["Caballeros", "Damas"]
    .map(c => ({ c, n: placaEdit.asis[c] || 0 }))   // `n`, no `m` — ver armarPlacaJson
    .filter(a => a.n > 0);
}

function setPlacaMonto(bi, ii, v) {
  const it = placaEdit.json.bloques[bi].items[ii];
  const n  = Math.round(Math.abs(Number(v) || 0));   // al peso, sin signo: el signo lo fija `neg`
  it.m = it.neg ? -n : n;
  refrescarPlacaJson();
}

function setPlacaCampo(campo, v) {
  placaEdit.json[campo] = v;
  refrescarPlacaJson();
}

// Repinta sólo lo derivado (netos, saldo, cuadre y el JSON), nunca los inputs: si se re-renderizara
// el bloque de campos en cada tecla, el input en foco lo perdería en el medio de la escritura.
function refrescarPlacaJson() {
  const saldo = placaSaldoFinal(placaEdit.json);
  placaEdit.json.bloques.forEach((b, bi) => {
    const el = document.getElementById("placa-neto-" + bi);
    if (el) el.textContent = fmtSigned(b.items.reduce((s, it) => s + it.m, 0));
  });
  const elSaldo = document.getElementById("placa-saldo");
  if (elSaldo) elSaldo.textContent = fmtSigned(saldo);
  const elAsis = document.getElementById("placa-asis-total");
  if (elAsis) {
    const tot = (placaEdit.asis.Caballeros || 0) + (placaEdit.asis.Damas || 0);
    elAsis.textContent = tot ? String(tot) : "—";
  }
  // El prorrateo de pagos multipartido deja decimales y cada renglón se redondea al peso, así que
  // puede haber diferencia aun sin editar nada. Se informa, no se maquilla.
  const dif = saldo - placaEdit.totalNeto;
  const elCuadre = document.getElementById("placa-cuadre");
  if (elCuadre) elCuadre.innerHTML = dif === 0
    ? `<span class="ing">✓ coincide con el Total Neto de la app</span>`
    : `<span class="egr">⚠ difiere en ${fmtSigned(dif)} del Total Neto de la app</span>`;
  const ta = document.getElementById("placa-json");
  if (ta) ta.value = JSON.stringify(placaEdit.json, null, 2);
}

function openPlacaModal(partidoId) {
  const d = placaDatosDePartido(partidoId);
  if (!d) { toast("Ese partido no tiene movimientos", "err"); return; }
  placaEdit = d;
  // La asistencia se edita como dos números sueltos y recién al final se vuelca al array del JSON:
  // manipular el array directamente obligaría a crear y borrar elementos según se vacíe cada campo.
  placaEdit.asis = { Caballeros: 0, Damas: 0 };
  for (const a of (d.json.asistencia || [])) {
    if (a && Object.prototype.hasOwnProperty.call(placaEdit.asis, a.c)) placaEdit.asis[a.c] = Number(a.n) || 0;
  }
  placaEdit.asisDelPartido = (d.json.asistencia || []).length > 0;

  document.getElementById("modal-root").innerHTML = `

        </div>
      </div>

  refrescarPlacaJson();   // pinta netos, saldo, cuadre y el JSON inicial
}

function copiarPlacaJson() {
  const ta = document.getElementById("placa-json");
  if (!ta) return;
  const fallback = () => {
    // Safari viejo / contextos sin permiso de portapapeles: seleccionar y copiar a la vieja usanza.
    try {
      ta.removeAttribute("readonly");
      ta.select();
      ta.setSelectionRange(0, ta.value.length);
      const ok = document.execCommand("copy");
      ta.setAttribute("readonly", "readonly");
      toast(ok ? "JSON copiado ✓" : "No se pudo copiar — copialo del cuadro", ok ? "ok" : "err");
    } catch (e) {
      ta.setAttribute("readonly", "readonly");
      toast("No se pudo copiar — copialo del cuadro", "err");
    }
  };
  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(ta.value).then(() => toast("JSON copiado ✓", "ok"), fallback);
  } else {
    fallback();
  }
}

// ── Reportes: tabla jerárquica Categoría → Rubro → Movimiento, con filtros
// combinables (meses multi-selección, cuentas multi-selección, jugador/CT,
// adherente, búsqueda libre). Estado persistente en reportesState. ──────

// Movimientos filtrados por todos los criterios de reportesState (AND entre sí).
// meses/cuentas vacíos = sin filtro (todos). Solo INGRESO/EGRESO entran en la agregación
// por categoría/rubro (mismo criterio que la tabla por categoría de Mensual).
function getMovimientosReportes() {
  return movimientos
    .filter(m => m.tipo === "INGRESO" || m.tipo === "EGRESO")
    .filter(m => !reportesState.meses.length  || reportesState.meses.includes(mesFromRecord(m)))
    .filter(m => !reportesState.cuentas.length || reportesState.cuentas.includes(m.cuenta))
    .filter(m => !reportesState.categoria || m.categoria === reportesState.categoria)
    .filter(m => !reportesState.rubroCod  || m.codRubro === reportesState.rubroCod)
    .filter(m => !reportesState.jugadorCT || normStr(m.jugadorCT).includes(normStr(reportesState.jugadorCT)))
    .filter(m => !reportesState.adherente || normStr(m.adherente).includes(normStr(reportesState.adherente)))
    .filter(m => {
      const q = normStr(reportesState.search);
      return !q || normStr(m.concepto).includes(q) || normStr(m.observacion).includes(q);
    });
}

// Agrupa movimientos ya filtrados en Categoría → Rubro → lista de movimientos.
function buildReportesJerarquia(movs) {
  const catMap = {};
  for (const m of movs) {
    const cat = m.categoria || "(sin categoría)";
    if (!catMap[cat]) catMap[cat] = { ing:0, egr:0, count:0, rubros:{} };
    const cd = catMap[cat];
    cd.count++;
    const rubroKey = m.codRubro || m.rubro || "(sin rubro)";
    if (!cd.rubros[rubroKey]) {
      const rubroNombre = m.rubro || RUBROS.find(r => r.cod === m.codRubro)?.nombre || "(sin rubro)";
      cd.rubros[rubroKey] = { nombre: rubroNombre, ing:0, egr:0, count:0, movs:[] };
    }
    const rd = cd.rubros[rubroKey];
    rd.count++;
    rd.movs.push(m);
    if (m.tipo === "INGRESO") { cd.ing += m.ingreso; rd.ing += m.ingreso; }
    else { cd.egr += m.egreso; rd.egr += m.egreso; }
  }
  return Object.entries(catMap)
    .map(([cat, v]) => ({
      cat, ing: v.ing, egr: v.egr, count: v.count,
      rubros: Object.entries(v.rubros).map(([key, r]) => ({ key, ...r })).sort((a,b) => b.egr - a.egr),
    }))
    .sort((a,b) => b.egr - a.egr);
}

function renderReportesBody() {
  const movs = getMovimientosReportes();
  if (!movs.length) {
    return `<p class="note">Sin movimientos para estos filtros</p>`;
  }

  const jerarquia = buildReportesJerarquia(movs);
  const totIng = movs.filter(m => m.tipo === "INGRESO").reduce((s,m) => s+m.ingreso, 0);
  const totEgr = movs.filter(m => m.tipo === "EGRESO" ).reduce((s,m) => s+m.egreso,  0);
  const totNeto = totIng - totEgr;

  const rows = jerarquia.map(cat => {
    const catNeto = cat.ing - cat.egr;
    const catExp  = reportesState.catExpandido.has(cat.cat);
    let rubroRows = "";
    if (catExp) {
      rubroRows = cat.rubros.map(r => {
        const rKey  = cat.cat + "||" + r.key;
        const rExp  = reportesState.rubroExpandido.has(rKey);
        const rNeto = r.ing - r.egr;
        let movRows = "";
        if (rExp) {
          const sortedMovs = [...r.movs].sort((a,b) => b.fecha.localeCompare(a.fecha));
          movRows = `<tr class="sum-table-detail-row"><td colspan="4" style="padding:0">
            <table class="sum-table" style="margin:0 0 0 20px;width:calc(100% - 20px)">
              <thead><tr><th>Fecha</th><th>Concepto</th><th style="text-align:right">Monto</th><th>Cuenta</th></tr></thead>
              <tbody>${sortedMovs.map(m => {
                const fechaD = m.fecha ? m.fecha.slice(8,10)+"/"+m.fecha.slice(5,7)+"/"+m.fecha.slice(0,4) : "";
                const montoClass = m.tipo === "INGRESO" ? "ing" : "egr";
                const montoVal   = m.tipo === "INGRESO" ? m.ingreso : m.egreso;
                const montoSign  = m.tipo === "INGRESO" ? "+" : "−";
                return `<tr>
                  <td style="font-size:11px">${esc(fechaD)}</td>
                  <td style="font-size:11px">${esc(m.concepto) || '<span style="color:var(--text3)">Sin concepto</span>'}</td>
                  <td class="${montoClass}" style="font-size:11px">${montoSign}${fmt(montoVal)}</td>
                  <td style="font-size:11px">${esc(m.cuenta)}</td>
                </tr>`;
              }).join("")}</tbody>
            </table>
          </td></tr>`;
        }
        return `<tr class="sum-table-row-toggle" onclick="toggleReportesRubro('${esc(escJs(rKey))}')">
          <td style="padding-left:20px">${rExp?"▾":"▸"} ${esc(r.nombre)} <span class="note" style="font-size:10px">(${r.count})</span></td>
          <td class="ing">${r.ing?fmt(r.ing):""}</td>
          <td class="egr">${r.egr?fmt(r.egr):""}</td>
          <td class="net ${rNeto>=0?"":"egr"}">${rNeto>=0?"+":"−"}${fmt(rNeto)}</td>
        </tr>${movRows}`;
      }).join("");
    }
    return `<tr class="sum-table-row-toggle" onclick="toggleReportesCat('${esc(escJs(cat.cat))}')">

  return `

// Exporta exactamente la jerarquía Categoría → Rubro → Movimiento visible en pantalla,
// ya filtrada por reportesState (meses/cuentas/jugador/adherente/búsqueda).
function exportReportesExcel() {
  if (typeof XLSX === "undefined") { toast("SheetJS no cargó", "err"); return; }
  const movs = getMovimientosReportes();
  if (!movs.length) { toast("No hay movimientos para exportar con estos filtros", "err"); return; }

  const jerarquia = buildReportesJerarquia(movs);
  const headers = ["Categoría","Rubro","Fecha","Concepto","Ingreso","Egreso","Cuenta"];
  const rows = [];
  let totIng = 0, totEgr = 0;
  for (const cat of jerarquia) {
    rows.push([cat.cat, "", "", "", cat.ing || "", cat.egr || "", ""]);
    for (const r of cat.rubros) {
      rows.push(["", r.nombre, "", "", r.ing || "", r.egr || "", ""]);
      const sorted = [...r.movs].sort((a,b) => a.fecha.localeCompare(b.fecha));
      for (const m of sorted) {
        rows.push(["", "", m.fecha, m.concepto || "",
          m.tipo==="INGRESO" ? m.ingreso : "", m.tipo==="EGRESO" ? m.egreso : "", m.cuenta || ""]);
      }
    }
    totIng += cat.ing; totEgr += cat.egr;
  }
  rows.push(["TOTAL PERÍODO FILTRADO", "", "", "", totIng, totEgr, ""]);

  const wb = XLSX.utils.book_new();
  const ws = XLSX.utils.aoa_to_sheet([headers, ...rows]);
  ws["!cols"] = [26,26,10,30,12,12,16].map(w=>({wch:w}));
  XLSX.utils.book_append_sheet(wb, ws, "Reportes");
  XLSX.writeFile(wb, `tesoreria_reportes_${today()}.xlsx`);
  toast("Excel exportado ✓", "ok");
}

// ── Patrimonio: saldo de cuentas + valor de granos en stock ──────
function renderPatrimonio() {
  const saldos = calcSaldosCuentas(movimientos);
  const totalCuentas = Object.values(saldos).reduce((s,v) => s+v, 0);
  const valorGranos = valorTotalGranos();
  const patrimonioTotal = totalCuentas + valorGranos;

  const cuentasHtml = cuentas.map(c => {
    const s = saldos[c] || 0;
    return `<div class="cuenta-item">
      <span class="cuenta-nombre">${esc(c)}</span>
      <span class="cuenta-saldo ${s>0?"pos":s<0?"neg":"zer"}">${s<0?"-":""}${fmt(s)}</span>
    </div>`;
  }).join("");

  // ⚠️ Diagnóstico: cuentas "huérfanas" — nombres de cuenta usados en movimientos
  // que no coinciden con ninguna de la lista configurada (`cuentas`). Su saldo
  // entra en totalCuentas pero no se ve en la lista de arriba, lo que puede
  // explicar por qué la suma visible no coincide con el total mostrado.
  const cuentasConocidas = new Set(cuentas);
  const huerfanas = Object.keys(saldos).filter(k => !cuentasConocidas.has(k) && saldos[k] !== 0);
  const huerfanasHtml = huerfanas.length ? `
    <div class="cfg-title" style="margin:14px 0 8px;color:var(--red)">⚠️ Cuentas no reconocidas</div>
    <p class="note" style="margin-bottom:8px">
      Estos nombres de cuenta aparecen en movimientos pero no están en la lista de cuentas
      configurada. Su saldo se suma al total de Patrimonio aunque no se muestra en "Cuentas".
      Revisá esos movimientos (puede ser un typo, una cuenta renombrada o eliminada).
    </p>
    ${huerfanas.map(k => {
      const s = saldos[k] || 0;
      const movsCount = movimientos.filter(m => m.cuenta === k || m.cuentaDestino === k).length;
      return `<div class="cuenta-item">
        <span class="cuenta-nombre">${esc(k || "(vacío)")} <span class="note" style="font-size:11px">(${movsCount} mov.)</span></span>
        <span class="cuenta-saldo ${s>0?"pos":s<0?"neg":"zer"}">${s<0?"-":""}${fmt(s)}</span>
      </div>`;
    }).join("")}
  ` : "";

  const stock = calcStockGranos();
  const granosHtml = Object.keys(stock).sort().map(g => {
    const kg = stock[g] || 0;
    const valor = (kg/1000) * (preciosGranos[g]||0);
    return `<div class="cuenta-item">
      <span class="cuenta-nombre">${esc(g)} (${fmtKg(kg)} kg)</span>
      <span class="cuenta-saldo pos">${fmt(valor)}</span>
    </div>`;
  }).join("");

  return `
    <div class="sum-grid three">
      <div class="stat-card">
        <div class="stat-label">Cuentas</div>
        <div class="stat-val ${totalCuentas>=0?"ing":"egr"}">${fmt(totalCuentas)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Granos</div>
        <div class="stat-val ing">${fmt(valorGranos)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Patrimonio total</div>
        <div class="stat-val ${patrimonioTotal>=0?"ing":"egr"}">${fmt(patrimonioTotal)}</div>
      </div>
    </div>
    <div class="cfg-title" style="margin:14px 0 8px">🏦 Cuentas</div>
    ${cuentasHtml}
    ${huerfanasHtml}
    <div class="cfg-title" style="margin:14px 0 8px">🌾 Granos en stock</div>
    ${granosHtml || '<p class="note">Sin stock registrado</p>'}
  `;
}

function calcSaldosCuentas(movs) {
  const saldos = {};
  for (const c of cuentas) saldos[c] = 0;
  for (const m of movs) {
    if (m.tipo === "INGRESO") {
      saldos[m.cuenta] = (saldos[m.cuenta] || 0) + m.ingreso;
    } else if (m.tipo === "EGRESO") {
      saldos[m.cuenta] = (saldos[m.cuenta] || 0) - m.egreso;
    } else if (m.tipo === "INTERNO") {
      saldos[m.cuenta]        = (saldos[m.cuenta]        || 0) - m.montoFinal;
      saldos[m.cuentaDestino] = (saldos[m.cuentaDestino] || 0) + m.montoFinal;
    } else if (m.tipo === "AJUSTE") {
      saldos[m.cuenta] = (saldos[m.cuenta] || 0) + m.montoFinal;
    }
  }
  return saldos;
}

// Recorre TODOS los ingresos de rubro médico (sin filtrar por año — un reintegro puede
// llegar en un año distinto al del gasto) y arma cuánto quedó vinculado a cada egreso,
// y cuánto de cada ingreso todavía no se asignó a ningún egreso.
function buildVinculosIndex() {
  const porEgreso  = {}; // egresoId -> monto total vinculado desde ingresos
  const porIngreso = {}; // ingresoId -> monto total ya asignado a egresos
  for (const m of movimientos) {
    if (m.codRubro !== "21" || m.tipo !== "INGRESO" || !m.vinculos || !m.vinculos.length) continue;
    let asignado = 0;
    for (const v of m.vinculos) {
      const monto = Number(v.monto) || 0;
      asignado += monto;
      porEgreso[v.egresoId] = (porEgreso[v.egresoId] || 0) + monto;
    }
    porIngreso[m.id] = asignado;
  }
  return { porEgreso, porIngreso };
}

const TOL = 1; // tolerancia de redondeo en pesos

// anio: string "YYYY" para filtrar los EGRESOS mostrados, o "" para todos los años.
// Los vínculos se calculan siempre contra el historial completo (buildVinculosIndex),
// porque un reintegro puede llegar meses después y en otro año que el gasto original.
function calcReintegrosPorJugador(anio) {
  const { porEgreso, porIngreso } = buildVinculosIndex();
  const movs21 = movimientos.filter(m => m.codRubro === "21" && (m.tipo === "EGRESO" || m.tipo === "INGRESO"));
  const map = {};
  const getBucket = (key) => {
    if (!map[key]) map[key] = { jugador: key, abonado: 0, sinReintegro: 0, reintegrado: 0, diferencia: 0, pendiente: 0, sinVincular: 0, movs: [], egresosDetalle: [], ingresosSinVincular: [] };
    return map[key];
  };
  for (const m of movs21) {
    if (m.tipo === "EGRESO" && (!anio || m.fecha.slice(0,4) === anio)) {
      const key = m.jugadorCT || "Sin jugador";
      const b = getBucket(key);
      b.abonado += m.egreso;
      b.movs.push(m);
      if (!m.seguroReintegro) { b.sinReintegro += m.egreso; continue; }
      const vinculado = porEgreso[m.id] || 0;
      const pendienteRaw = m.egreso - vinculado;
      let estado;
      if (Math.abs(pendienteRaw) <= TOL) { estado = "OK"; }
      else if (pendienteRaw < 0) { estado = "SALDO_FAVOR"; b.diferencia += Math.abs(pendienteRaw); }
      else { estado = vinculado > 0 ? "PARCIAL" : "SIN"; b.pendiente += pendienteRaw; }
      // Reintegrado = toda la plata que efectivamente volvió (incluye el excedente cuando el
      // reintegro fue mayor a lo abonado) — no se limita al monto del egreso.
      b.reintegrado += vinculado;
      b.egresosDetalle.push({ ...m, vinculado, pendiente: Math.max(pendienteRaw,0), estadoVinculo: estado });
    } else if (m.tipo === "INGRESO") {
      // Los ingresos entran en el balance del jugador aunque hayan sido cargados en otro año,
      // así el jugador no "pierde" el reintegro solo porque cambió el año en pantalla.
      const key = m.jugadorCT || "Sin jugador";
      const b = getBucket(key);
      b.movs.push(m);
      const asignado   = porIngreso[m.id] || 0;
      const disponible = m.ingreso - asignado;
      if (disponible > TOL) {
        b.sinVincular += disponible;
        b.ingresosSinVincular.push({ ...m, disponible });
      }
    }
  }
  return Object.values(map).map(r => {
    const pendiente = Math.round(r.pendiente) === 0 ? 0 : r.pendiente;
    const estado = pendiente > 0
      ? (r.reintegrado > 0 ? "PARCIAL" : "SIN")
      : (r.diferencia > TOL || r.sinVincular > TOL ? "DIF" : "OK");
    return { ...r, pendiente, estado };
  // Pendiente más grande primero. Los que ya están en $0 quedan al final (aunque tengan
  // saldo a favor o ingresos sin vincular, eso se ve aparte, no hace subir el orden).
  }).sort((a,b) => b.pendiente - a.pendiente || (b.sinVincular||0) - (a.sinVincular||0));
}

function renderReintegrosMedicos() {
  const movs21All = movimientos.filter(m => m.codRubro === "21" && (m.tipo === "EGRESO" || m.tipo === "INGRESO"));
  const anios = [...new Set(movs21All.map(m => m.fecha.slice(0,4)))].filter(Boolean).sort().reverse();
  if (reintegroAnio !== "" && !anios.includes(reintegroAnio)) {
    reintegroAnio = anios[0] || String(new Date().getFullYear());
  }

  const rows = calcReintegrosPorJugador(reintegroAnio);

  const anioOptions = `<option value="" ${reintegroAnio===""?"selected":""}>Todos los años</option>` +
    anios.map(a => `<option value="${a}" ${reintegroAnio===a?"selected":""}>${a}</option>`).join("");

  const viewToggle = `
    <div class="reint-view-toggle">
      <button class="reint-view-btn ${reintegroVista==='tabla'?'active':''}" onclick="setReintegroVista('tabla')">⊞ Tabla</button>
      <button class="reint-view-btn ${reintegroVista==='cards'?'active':''}" onclick="setReintegroVista('cards')">▤ Cards</button>
    </div>`;

  const body = !rows.length
    ? `<p class="note" style="text-align:center;padding:16px 0">Sin movimientos de rubro médico</p>`
    : reintegroVista === "cards" ? renderReintegrosCards(rows) : renderReintegrosTabla(rows);

  return `
    <div class="reint-section">
      <button class="btn-secondary" style="margin-bottom:8px" onclick="openVincularReintegros('')">🔗 Vincular reintegros con sus egresos</button>
      <button class="btn-export" style="margin-bottom:12px" onclick="exportarPendientesReintegro()">📥 Exportar pendientes de reintegro</button>
      <div style="display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap">
        <div style="display:flex;align-items:center;gap:8px;flex:1;min-width:150px">
          <label style="font-size:11px;color:var(--text3);white-space:nowrap">Año:</label>
          <select class="inp" style="flex:1" onchange="setReintegroAnio(this.value)">${anioOptions}</select>
        </div>
        ${viewToggle}
      </div>
      ${body}
    </div>`;
}

function estadoCorto(estado, diferencia, sinVincular) {
  if (estado === "DIF") {
    const partes = [];
    if (diferencia > TOL)   partes.push("saldo a favor " + fmt(diferencia));
    if (sinVincular > TOL)  partes.push(fmt(sinVincular) + " sin vincular");
    return "🔵 " + (partes.join(" · ") || "Diferencia");
  }
  return estado==="OK"      ? "✅ OK"
    : estado==="PARCIAL" ? "⚠️ Parcial"
    : "🔴 Pendiente";
}

function renderReintegrosTabla(rows) {
  const isMobile = window.matchMedia("(max-width:599px)").matches;

  let totAbonado=0, totReintegrado=0, totPendiente=0, totSinReintegro=0;
  const bodyRows = rows.map(r => {
    totAbonado      += r.abonado;
    totReintegrado  += r.reintegrado;
    totPendiente    += Math.max(r.pendiente,0);
    totSinReintegro += r.sinReintegro;
    const isExp = reintegroExpandido.has(r.jugador);
    const detalle = isExp ? renderReintegroDetalle(r) : "";
    const rowClass = r.pendiente <= 0 ? "reint-row row-ok" : "reint-row";
    const reintegradoCell = isMobile ? "" : `<td style="text-align:right;font-family:var(--mono)">${fmt(r.reintegrado)}</td>`;
    return `
    <tr class="${rowClass}" onclick="toggleReintegroDetalle('${esc(escJs(r.jugador))}')">

      <td style="text-align:right;font-family:var(--mono)">${fmt(r.abonado)}</td>
      ${reintegradoCell}
      <td style="text-align:right;font-family:var(--mono)" class="${r.pendiente>0?'egr':'ing'}">${fmt(Math.max(r.pendiente,0))}</td>

    </tr>${isExp ? `
    <tr><td colspan="${isMobile?5:6}" style="padding:0;border-bottom:none">${detalle}</td></tr>` : ""}`;
  }).join("");

  const totReintegradoCell = isMobile ? "" : `<td style="text-align:right;font-family:var(--mono)">${fmt(totReintegrado)}</td>`;
  const totRow = `<tr class="reint-tot-row">
    <td class="jugador-col">TOTALES</td>

    ${totReintegradoCell}
    <td style="text-align:right;font-family:var(--mono)" class="${totPendiente>0?'egr':'ing'}">${fmt(totPendiente)}</td>
    <td style="text-align:right;font-family:var(--mono)">${fmt(totSinReintegro)}</td>

  return `
    <div class="reint-table-wrap">
      <table class="sum-table reint-table ${isMobile?'reint-table-mobile':''}">
        <thead><tr>
          <th class="jugador-col">Jugador</th>

        </tr></thead>
        <tbody>${bodyRows}${totRow}</tbody>
      </table>
    </div>
    ${footnote}`;
}

function renderReintegrosCards(rows) {
  // Con pendiente > 0 primero, de mayor a menor. Los que ya están en $0 (aunque tengan
  // saldo a favor o ingresos sin vincular) quedan colapsados abajo y más apagados.
  const conPendiente = rows.filter(r => r.pendiente > 0).sort((a,b) => b.pendiente - a.pendiente);
  const sinPendiente  = rows.filter(r => r.pendiente <= 0);

  const cardsHtml = conPendiente.map(renderReintegroCard).join("");

  const alDiaKey  = "__aldia__";
  const alDiaOpen = reintegroExpandido.has(alDiaKey);
  const alDiaHtml = sinPendiente.length ? `
    <button class="reint-aldia-toggle" onclick="toggleReintegroDetalle('${alDiaKey}')">
      Ver jugadores sin pendiente (${sinPendiente.length}) ${alDiaOpen ? "▲" : "▼"}
    </button>
    ${alDiaOpen ? `<div style="opacity:.55">${sinPendiente.map(renderReintegroCard).join("")}</div>` : ""}` : "";

  return `${cardsHtml}${alDiaHtml}`;
}

// Agrupa los movimientos de un jugador en "grupos vinculados": cada grupo es un conjunto
// de egresos + ingresos conectados entre sí por vinculos (unión de componentes conexas).
// Un egreso o ingreso sin ningún vínculo queda solo en su propio grupo — eso es justamente
// lo que se ve vacío del otro lado en la vista de dos columnas.
function buildGruposVinculo(r) {
  const egresosBase = r.movs.filter(m => m.tipo === "EGRESO" && m.seguroReintegro);
  const ingresos    = r.movs.filter(m => m.tipo === "INGRESO");
  const egresosMap  = {}; // id -> movimiento (incluye egresos "externos" traídos por un vínculo, ej. de otro año)
  for (const e of egresosBase) egresosMap[e.id] = e;

  const parent = {};
  const find = id => { while (parent[id] !== id) id = parent[id]; return id; };
  const union = (a,b) => { const ra = find(a), rb = find(b); if (ra !== rb) parent[ra] = rb; };
  for (const e of egresosBase) parent[e.id] = e.id;
  for (const i of ingresos) {
    parent[i.id] = i.id;
    for (const v of (i.vinculos||[])) {
      if (!(v.egresoId in parent)) {
        const ext = movimientos.find(m => m.id === v.egresoId);
        if (ext) { parent[v.egresoId] = v.egresoId; egresosMap[v.egresoId] = ext; }
      }
      if (v.egresoId in parent) union(i.id, v.egresoId);
    }
  }

  const grupos = {};
  for (const id of Object.keys(egresosMap)) {
    const root = find(id);
    (grupos[root] = grupos[root] || { egresos: [], ingresos: [] }).egresos.push(egresosMap[id]);
  }
  for (const i of ingresos) {
    const root = find(i.id);
    (grupos[root] = grupos[root] || { egresos: [], ingresos: [] }).ingresos.push(i);
  }

  return Object.values(grupos).map(g => {
    const abonado   = g.egresos.reduce((s,e) => s + e.egreso, 0);
    const vinculado = g.ingresos.reduce((s,i) => s + (i.vinculos||[]).reduce((s2,v) => s2 + (Number(v.monto)||0), 0), 0);
    const diff = vinculado - abonado;
    let estado;
    if (!g.egresos.length)        estado = "SINASIGNAR"; // ingreso(s) sin ningún egreso vinculado
    else if (!g.ingresos.length)  estado = "SIN";          // egreso sin ningún reintegro
    else if (Math.abs(diff) <= TOL) estado = "OK";
    else if (diff < 0)            estado = "PARCIAL";
    else                          estado = "FAVOR";
    const fechaOrden = [...g.egresos, ...g.ingresos].map(m => m.fecha).sort()[0] || "";
    return { ...g, abonado, vinculado, diff, estado, fechaOrden };
  }).sort((a,b) => a.fechaOrden.localeCompare(b.fechaOrden));
}

function renderMovGrupoRow(m, tipo, tieneVinculo) {
  const fechaD = m.fecha ? m.fecha.slice(8)+"/"+m.fecha.slice(5,7) : "";
  const montoVal = tipo === "INGRESO" ? m.ingreso : m.egreso;
  const montoCls = tipo === "INGRESO" ? "ing" : "egr";
  let nota = "";
  if (tipo === "INGRESO") {
    const asignado    = (m.vinculos||[]).reduce((s,v) => s + (Number(v.monto)||0), 0);
    const disponible  = m.ingreso - asignado;
    if (disponible > TOL) nota = `<div style="font-size:11px;color:var(--warn)">+ ${fmt(disponible)} sin asignar</div>`;
  }
  const btn = tieneVinculo
    ? `<button class="btn-sm" style="align-self:flex-start;margin-top:2px" onclick="verVinculosMovimiento('${m.id}')">Ver / cambiar vínculo</button>` : "";
  return `
    <div class="reint-grupo-mov">
      <div class="top"><span style="color:var(--text3)">${fechaD}</span><span class="${montoCls}">${fmt(montoVal)}</span></div>
      <div>${esc(m.concepto)||"—"}</div>
      ${nota}
      ${btn}
    </div>`;
}

function renderGrupoVinculo(g, porEgreso) {
  const claseEstado = {
    OK: "estado-ok", PARCIAL: "estado-parcial", SIN: "estado-sin",
    FAVOR: "estado-favor", SINASIGNAR: "estado-sinasignar"
  }[g.estado];

  const resumen = g.egresos.length && g.ingresos.length
    ? `Abonado ${fmt(g.abonado)} · Reintegrado ${fmt(g.vinculado)}` +
      (g.estado === "FAVOR" ? ` · saldo a favor ${fmt(g.diff)}` : g.estado === "PARCIAL" ? ` · falta ${fmt(-g.diff)}` : "")
    : g.egresos.length
      ? `Abonado ${fmt(g.abonado)} · sin reintegro`
      : `Reintegro ${fmt(g.ingresos.reduce((s,i) => s+i.ingreso, 0))} · sin egreso vinculado`;

  const egresosHtml = g.egresos.length
    ? g.egresos.map(e => renderMovGrupoRow(e, "EGRESO", (porEgreso[e.id]||0) > TOL)).join("")
    : `<div class="reint-grupo-col-empty">— sin egreso asociado —</div>`;
  const ingresosHtml = g.ingresos.length
    ? g.ingresos.map(i => renderMovGrupoRow(i, "INGRESO", (i.vinculos||[]).length > 0)).join("")
    : `<div class="reint-grupo-col-empty">— sin ingreso asociado —</div>`;

  return `
    <div class="reint-grupo ${claseEstado}">
      <div class="reint-grupo-header">${resumen}</div>
      <div class="reint-grupo-cols">
        <div class="reint-grupo-col">${egresosHtml}</div>
        <div class="reint-grupo-col">${ingresosHtml}</div>
      </div>
    </div>`;
}

function renderReintegroDetalle(r) {
  const { porEgreso } = buildVinculosIndex();
  const grupos = buildGruposVinculo(r);
  const gruposHtml = grupos.map(g => renderGrupoVinculo(g, porEgreso)).join("");

  // Gastos médicos que nunca se marcaron con reintegro de seguro (checkbox "Tiene reintegro
  // del seguro" destildado) — no participan de los vínculos, así que van aparte, en una sola
  // columna, sin la parte de "ingreso asociado" porque no corresponde que la tengan.
  const sinReintegro = r.movs
    .filter(m => m.tipo === "EGRESO" && !m.seguroReintegro)
    .sort((a,b) => a.fecha.localeCompare(b.fecha));
  const sinReintegroHtml = sinReintegro.length ? `
    <div class="reint-grupo estado-neutral">
      <div class="reint-grupo-header">Gastos médicos sin reintegro esperado</div>
      <div class="reint-grupo-col">
        ${sinReintegro.map(e => renderMovGrupoRow(e, "EGRESO", false)).join("")}
      </div>
    </div>` : "";

  return `
    <div style="padding:2px 0 4px">
      ${gruposHtml}
      ${sinReintegroHtml}
      <button class="btn-sm accent" style="margin-top:4px" onclick="event.stopPropagation(); openVincularReintegros('${esc(escJs(r.jugador))}')">🔗 Vincular movimientos de ${esc(r.jugador)}</button>
    </div>`;
}

// ── Ver / cambiar / desvincular el o los vínculos de un movimiento puntual ────
// Los vínculos siempre se guardan en el array `vinculos` del INGRESO (aunque se esté
// mirando desde un EGRESO), así que hay que buscar en ambos sentidos.
let vincDetalleMovId = null;

function verVinculosMovimiento(movId) {
  vincDetalleMovId = movId;
  renderVinculosMovimientoModal();
}

function paresVinculadosDe(movId) {
  const mov = movimientos.find(m => m.id === movId);
  if (!mov) return [];
  const pares = [];
  if (mov.tipo === "EGRESO") {
    for (const i of movimientos) {
      if (i.tipo !== "INGRESO" || !i.vinculos) continue;
      for (const v of i.vinculos) {
        if (v.egresoId === mov.id) pares.push({ ingresoId: i.id, ingreso: i, egresoId: mov.id, egreso: mov, monto: Number(v.monto)||0 });
      }
    }
  } else if (mov.tipo === "INGRESO") {
    for (const v of (mov.vinculos||[])) {
      pares.push({ ingresoId: mov.id, ingreso: mov, egresoId: v.egresoId, egreso: movimientos.find(m => m.id === v.egresoId), monto: Number(v.monto)||0 });
    }
  }
  return pares.sort((a,b) => (a.egreso?a.egreso.fecha:"").localeCompare(b.egreso?b.egreso.fecha:""));
}

function renderVinculosMovimientoModal() {
  const mov = movimientos.find(m => m.id === vincDetalleMovId);
  if (!mov) { closeModal(); return; }
  const pares = paresVinculadosDe(vincDetalleMovId);
  const rows = pares.map((p,i) => `
    <div class="entity-item" style="flex-direction:column;align-items:stretch;gap:8px">
      <div>
        <div class="entity-sub">Egreso: ${p.egreso ? fechaCorta(p.egreso.fecha)+" · "+esc(p.egreso.concepto||"—")+" (total "+fmt(p.egreso.egreso)+")" : "⚠️ no encontrado"}</div>
        <div class="entity-sub">Ingreso: ${fechaCorta(p.ingreso.fecha)} · ${esc(p.ingreso.concepto||"—")} (total ${fmt(p.ingreso.ingreso)})</div>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        <label style="font-size:11px;color:var(--text3)">Monto vinculado</label>
        <input class="inp" type="number" style="width:130px" id="vinc-edit-${i}" value="${p.monto}">
        <button class="btn-sm accent" onclick="guardarEdicionVinculo(this, '${p.ingresoId}','${p.egresoId}', document.getElementById('vinc-edit-${i}').value)">Guardar</button>
        <button class="btn-sm danger" onclick="desvincularDesdeModal(this, '${p.ingresoId}','${p.egresoId}')">Desvincular</button>
      </div>
    </div>`).join("");

  setModalHtml(`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-card" onclick="event.stopPropagation()" style="max-width:640px">
        <div class="modal-handle"></div>
        <div class="modal-title">🔗 Vínculos de este movimiento</div>
        <p class="cfg-note" style="margin-bottom:10px">${esc(mov.jugadorCT||"Sin jugador")} · ${fechaCorta(mov.fecha)} · ${esc(mov.concepto)||"—"}</p>
        ${pares.length ? rows : '<p class="note">Este movimiento no tiene vínculos.</p>'}
        <div class="modal-footer">
          <button class="btn-secondary" style="flex:1" onclick="closeModal()">Cerrar</button>
        </div>
      </div>
    </div>`);
}

// Actualiza (o si nuevoMonto es null/0, elimina) la entrada de vinculo egresoId↔ingresoId.
// El array vinculos vive siempre en el movimiento de tipo INGRESO.
async function actualizarVinculoEntry(ingresoId, egresoId, nuevoMonto) {
  const ing = movimientos.find(m => m.id === ingresoId);
  if (!ing) return false;
  let vinculos = [...(ing.vinculos||[])];
  if (nuevoMonto == null || Number(nuevoMonto) <= TOL) {
    vinculos = vinculos.filter(v => v.egresoId !== egresoId);
  } else {
    const idx = vinculos.findIndex(v => v.egresoId === egresoId);
    if (idx >= 0) vinculos[idx] = { egresoId, monto: Number(nuevoMonto) };
    else vinculos.push({ egresoId, monto: Number(nuevoMonto) });
  }
  try {
    const r = await Storage.setVinculos(ingresoId, vinculos);
    if (!r.ok) throw new Error(r.error || "Error");
    ing.vinculos = vinculos;
    saveSnapshotToCache();
    return true;
  } catch(e) {
    toast(isNetworkError(e) ? "Sin conexión — no se pudo actualizar, probá de nuevo" : "Error: " + e.message, "err");
    return false;
  }
}

async function guardarEdicionVinculo(btn, ingresoId, egresoId, nuevoMonto) {
  if (btn.disabled) return; // evita doble envío
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = "Guardando…";
  const ok = await actualizarVinculoEntry(ingresoId, egresoId, Number(nuevoMonto));
  if (ok) {
    toast("Vínculo actualizado ✓", "ok");
    renderVinculosMovimientoModal(); // re-renderiza el modal entero con botones nuevos, ya habilitados
    if (currentTab === "resumen") renderResumen();
  } else {
    btn.disabled = false; btn.textContent = original;
  }
}

async function desvincularDesdeModal(btn, ingresoId, egresoId) {
  if (btn.disabled) return; // evita doble envío
  const original = btn.textContent;
  btn.disabled = true; btn.textContent = "Desvinculando…";
  const ok = await actualizarVinculoEntry(ingresoId, egresoId, null);
  if (ok) {
    toast("Movimiento desvinculado", "ok");
    renderVinculosMovimientoModal();
    if (currentTab === "resumen") renderResumen();
  } else {
    btn.disabled = false; btn.textContent = original;
  }
}

// ── Vincular reintegros (ingresos) con sus egresos ────────────────
// jugadorFiltro: "" = todos los jugadores con movimientos de rubro médico.
function openVincularReintegros(jugadorFiltro) {
  vincJugadorFiltro = jugadorFiltro || "";
  vincExpandedIngresoId = null;
  vincAsignaciones = {};
  renderVincularModal();
}

function closeVincularModal() {
  document.getElementById("modal-root").innerHTML = "";
}

// Reemplaza el contenido de #modal-root preservando el scroll del modal actual —
// sin esto, cada vez que se re-renderiza (ej. al tildar un checkbox) el modal saltaba
// arriba del todo y había que volver a bajar. El elemento que scrollea puede ser el
// modal-card entero o, en los modales tipo "asociar" (asoc-list), un hijo interno.
const MODAL_SCROLL_SELECTOR = ".asoc-list, .modal-card";
function setModalHtml(html) {
  const root = document.getElementById("modal-root");
  const prevEl = root.querySelector(MODAL_SCROLL_SELECTOR);
  const prevScroll = prevEl?.scrollTop || 0;
  root.innerHTML = html;
  const nextEl = root.querySelector(MODAL_SCROLL_SELECTOR);
  if (nextEl) nextEl.scrollTop = prevScroll;
}

// Egresos con reintegro aún no cubierto e ingresos de reintegro aún no asignados a ningún
// egreso, opcionalmente filtrados a un jugador. Se recalcula siempre contra buildVinculosIndex()
// (todo el historial), no contra un año en particular.
function getPendientesYSinVincular(jugadorFiltro) {
  const { porEgreso, porIngreso } = buildVinculosIndex();
  const egresos = movimientos
    .filter(m => m.codRubro === "21" && m.tipo === "EGRESO" && m.seguroReintegro && (!jugadorFiltro || m.jugadorCT === jugadorFiltro))
    .map(m => ({ ...m, vinculado: porEgreso[m.id] || 0, pendiente: m.egreso - (porEgreso[m.id] || 0) }))
    .filter(m => m.pendiente > TOL)
    .sort((a,b) => a.fecha.localeCompare(b.fecha));
  const ingresos = movimientos
    .filter(m => m.codRubro === "21" && m.tipo === "INGRESO" && (!jugadorFiltro || m.jugadorCT === jugadorFiltro))
    .map(m => ({ ...m, asignado: porIngreso[m.id] || 0, disponible: m.ingreso - (porIngreso[m.id] || 0) }))
    .filter(m => m.disponible > TOL)
    .sort((a,b) => a.fecha.localeCompare(b.fecha));
  return { egresos, ingresos };
}

// Egresos pendientes del MISMO jugador que un ingreso dado (match exacto de jugadorCT,
// incluso si está vacío) — son los candidatos que se ofrecen al vincular ese ingreso.
function candidatosParaIngreso(ing) {
  const { porEgreso } = buildVinculosIndex();
  return movimientos
    .filter(m => m.codRubro === "21" && m.tipo === "EGRESO" && m.seguroReintegro && m.jugadorCT === ing.jugadorCT)
    .map(m => ({ ...m, vinculado: porEgreso[m.id] || 0, pendiente: m.egreso - (porEgreso[m.id] || 0) }))
    .filter(m => m.pendiente > TOL)
    .sort((a,b) => a.fecha.localeCompare(b.fecha));
}

function renderVincularModal() {
  const { egresos, ingresos } = getPendientesYSinVincular(vincJugadorFiltro);
  const jugadoresConMovs = [...new Set(movimientos.filter(m => m.codRubro === "21").map(m => m.jugadorCT || "Sin jugador"))].sort();
  const filtroOptions = `<option value="">Todos los jugadores</option>` +
    jugadoresConMovs.map(j => `<option value="${esc(j)}" ${vincJugadorFiltro===j?"selected":""}>${esc(j)}</option>`).join("");

  const ingresosHtml = ingresos.length
    ? ingresos.map(renderVincIngresoRow).join("")
    : `<p class="note" style="padding:8px 0">No hay ingresos de reintegro sin vincular${vincJugadorFiltro?` para ${esc(vincJugadorFiltro)}`:""}.</p>`;

  const egresosHtml = egresos.length
    ? egresos.map(e => `
      <div class="entity-item">
        <div style="flex:1;min-width:0">
          <span class="entity-name">${fechaCorta(e.fecha)} · ${esc(e.jugadorCT||"Sin jugador")}</span>
          <div class="entity-sub">${esc(e.concepto)||"—"} · Pendiente: ${fmt(e.pendiente)} de ${fmt(e.egreso)}</div>
        </div>
      </div>`).join("")
    : `<p class="note" style="padding:8px 0">Sin egresos pendientes de reintegro${vincJugadorFiltro?` para ${esc(vincJugadorFiltro)}`:""}.</p>`;

  setModalHtml(`
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-card" onclick="event.stopPropagation()" style="max-width:900px">
        <div class="modal-handle"></div>
        <div class="modal-title">🔗 Vincular reintegros</div>
        <div class="field" style="margin-bottom:10px">
          <label>Jugador</label>
          <select class="inp" onchange="vincJugadorFiltro=this.value; vincExpandedIngresoId=null; vincAsignaciones={}; renderVincularModal()">${filtroOptions}</select>
        </div>
        <button class="btn-secondary" style="margin-bottom:12px" onclick="sugerirVinculosAutomaticos()">✨ Sugerir vínculos automáticos</button>
        <p class="cfg-note" style="margin-bottom:10px">Los montos de las listas de abajo son los reales (lo que falta cobrar de cada egreso, lo que falta asignar de cada ingreso). Al abrir un ingreso para vincularlo, el monto que aparece junto a cada egreso candidato es una <b>propuesta editable</b> — no se guarda nada hasta que tocás "Confirmar vínculo".</p>
        <div class="sec-hdr"><span class="sec-title">Ingresos sin vincular (${ingresos.length})</span></div>
        ${ingresosHtml}
        <div class="divider"></div>
        <div class="sec-hdr"><span class="sec-title">Egresos pendientes de reintegro (${egresos.length})</span></div>
        ${egresosHtml}
        <div class="modal-footer">
          <button class="btn-secondary" style="flex:1" onclick="closeVincularModal()">Cerrar</button>
        </div>
      </div>
    </div>`);
}

function renderVincIngresoRow(ing) {
  const isExp = vincExpandedIngresoId === ing.id;
  let expandedHtml = "";
  if (isExp) {
    const candidatos = candidatosParaIngreso(ing);
    if (!candidatos.length) {
      expandedHtml = `<p class="note" style="padding:8px 0">No hay egresos pendientes de reintegro para ${esc(ing.jugadorCT||"Sin jugador")}.</p>`;
    } else {
      const rows = candidatos.map(e => {
        const checked = vincAsignaciones[e.id] != null;
        const monto = checked ? vincAsignaciones[e.id] : "";
        return `
        <div class="grupo-jug-item" style="justify-content:space-between" onclick="event.stopPropagation()">
          <label style="display:flex;align-items:center;gap:8px;flex:1;min-width:0;cursor:pointer">
            <input type="checkbox" ${checked?"checked":""} onchange="toggleVincAsignacion('${e.id}', ${e.pendiente})">
            <span style="font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${fechaCorta(e.fecha)} · ${esc(e.concepto)||"—"} (pendiente real ${fmt(e.pendiente)})</span>
          </label>
          ${checked ? `<input class="inp" type="number" style="width:110px" title="Monto propuesto, editable" value="${monto}" oninput="vincAsignaciones['${e.id}']=Number(this.value)||0">` : ""}
        </div>`;
      }).join("");
      const totalAsignado = Object.values(vincAsignaciones).reduce((s,v) => s + (Number(v)||0), 0);
      expandedHtml = `
        <div style="background:var(--bg3);border-radius:var(--rs);padding:10px;margin-top:6px" onclick="event.stopPropagation()">
          ${rows}
          <div style="margin-top:8px;font-size:12px;color:var(--text2)">A aplicar (propuesto, editable arriba): ${fmt(totalAsignado)} de ${fmt(ing.disponible)} disponibles</div>
          <button class="btn-main" style="margin-top:8px" id="btn-confirmar-vinculo" onclick="confirmarVinculo('${ing.id}')">Confirmar vínculo</button>
        </div>`;
    }
  }
  const yaAsignado = ing.ingreso - ing.disponible;
  return `
    <div class="entity-item" style="flex-direction:column;align-items:stretch;gap:4px;cursor:pointer" onclick="toggleVincIngreso('${ing.id}')">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span class="entity-name">${fechaCorta(ing.fecha)} · ${esc(ing.jugadorCT||"Sin jugador")}</span>
        <span class="monto ing">${fmt(ing.disponible)}</span>
      </div>
      <div class="entity-sub">${esc(ing.concepto)||"—"}${yaAsignado > TOL ? ` · ya asignado ${fmt(yaAsignado)}` : ""}</div>
      ${expandedHtml}
    </div>`;
}

function toggleVincIngreso(ingresoId) {
  if (vincExpandedIngresoId === ingresoId) {
    vincExpandedIngresoId = null;
    vincAsignaciones = {};
  } else {
    vincExpandedIngresoId = ingresoId;
    vincAsignaciones = {};
    const ing = movimientos.find(m => m.id === ingresoId);
    if (ing) {
      const { porIngreso } = buildVinculosIndex();
      let restante = ing.ingreso - (porIngreso[ing.id] || 0);
      // Autocompleta del egreso pendiente más viejo al más nuevo hasta agotar el disponible;
      // el usuario puede destildar o ajustar el monto de cada uno antes de confirmar.
      for (const e of candidatosParaIngreso(ing)) {
        if (restante <= TOL) break;
        const monto = Math.min(e.pendiente, restante);
        vincAsignaciones[e.id] = monto;
        restante -= monto;
      }
    }
  }
  renderVincularModal();
}

function toggleVincAsignacion(egresoId, pendienteDefault) {
  if (vincAsignaciones[egresoId] != null) delete vincAsignaciones[egresoId];
  else vincAsignaciones[egresoId] = pendienteDefault;
  renderVincularModal();
}

async function confirmarVinculo(ingresoId) {
  const btnId = "btn-confirmar-vinculo";
  if (document.getElementById(btnId)?.disabled) return; // evita doble envío
  const ing = movimientos.find(m => m.id === ingresoId);
  if (!ing) return;
  const nuevas = Object.entries(vincAsignaciones)
    .filter(([,monto]) => Number(monto) > TOL)
    .map(([egresoId,monto]) => ({ egresoId, monto: Number(monto) }));
  if (!nuevas.length) { toast("Seleccioná al menos un egreso y un monto", "err"); return; }
  const { porIngreso } = buildVinculosIndex();
  const disponible = ing.ingreso - (porIngreso[ing.id] || 0);
  const totalNuevo = nuevas.reduce((s,v) => s+v.monto, 0);
  if (totalNuevo > disponible + TOL) { toast("El total asignado supera el disponible del ingreso", "err"); return; }
  const vinculosFinal = [...(ing.vinculos||[]), ...nuevas];
  setBtnState(btnId, "saving");
  try {
    const r = await Storage.setVinculos(ingresoId, vinculosFinal);
    if (!r.ok) throw new Error(r.error || "Error");
    ing.vinculos = vinculosFinal;
    saveSnapshotToCache();
    toast("Vínculo guardado ✓", "ok");
    vincExpandedIngresoId = null;
    vincAsignaciones = {};
    renderVincularModal();
    if (currentTab === "resumen") renderResumen();
  } catch(e) {
    handleSaveError(btnId, e);
  }
}

// ── Sugerencias automáticas de vínculo (para poner al día el historial) ──────
// Empareja por jugador, del egreso/ingreso más viejo al más nuevo (FIFO). No aplica nada
// solo: junta las propuestas para que el usuario las revise y confirme en bloque.
function calcularSugerenciasAutomaticas(jugadorFiltro) {
  const { egresos, ingresos } = getPendientesYSinVincular(jugadorFiltro);
  const porJugador = {};
  for (const e of egresos) {
    const k = e.jugadorCT || "Sin jugador";
    (porJugador[k] = porJugador[k] || { egresos: [], ingresos: [] }).egresos.push({ ...e });
  }
  for (const i of ingresos) {
    const k = i.jugadorCT || "Sin jugador";
    (porJugador[k] = porJugador[k] || { egresos: [], ingresos: [] }).ingresos.push({ ...i });
  }
  const sugerencias = [];
  for (const k of Object.keys(porJugador)) {
    const { egresos: egs, ingresos: ings } = porJugador[k];
    let egIdx = 0;
    for (const ing of ings) {
      let restante = ing.disponible;
      while (restante > TOL && egIdx < egs.length) {
        const e = egs[egIdx];
        if (e.pendiente <= TOL) { egIdx++; continue; }
        const monto = Math.min(e.pendiente, restante);
        sugerencias.push({
          jugador: k, ingresoId: ing.id, ingresoFecha: ing.fecha, ingresoConcepto: ing.concepto,
          egresoId: e.id, egresoFecha: e.fecha, egresoConcepto: e.concepto, monto
        });
        e.pendiente -= monto; restante -= monto;
        if (e.pendiente <= TOL) egIdx++;
      }
    }
  }
  return sugerencias;
}

function sugerirVinculosAutomaticos() {
  vincSugerenciasPendientes = calcularSugerenciasAutomaticas(vincJugadorFiltro).map(s => ({ ...s, selected: true }));

// ── Adherentes — aportes vs. compromiso (rubro 6) ────────────────
function setAdherenteAnio(v) {

}

function setAdherenteVista(v) {

function toggleAdherenteDetalle(key) {

  else adherenteExpandido.add(key);

// Rubros que se consideran aportes de adherentes: [6] ADHERENTES | COLABORADORES y [5] PUBLICIDAD - Lonas y otros
const ADH_RUBROS = ["5", "6", "42"];

// Un movimiento es aporte de adherente si tiene un adherente asignado (cualquier rubro),
// o si es de rubro 5/6/42 aunque no tenga adherente (para preservar "⛽ Combustible" / "Sin adherente")
function esAporteAdherente(m) {
  return m.tipo === "INGRESO" && ((m.adherente && m.adherente.trim() !== "") || ADH_RUBROS.includes(m.codRubro));
}

// anio: string "YYYY" para filtrar, o "" para todos los años
function calcAdherentesPorAnio(anio) {
  const movs6 = movimientos.filter(m =>
    esAporteAdherente(m) && (!anio || m.fecha.slice(0,4) === anio)
  );
  const map = {};
  for (const a of adherentes) {
    map[a.nombre] = { adherente: a.nombre, cuotaMensual: a.cuotaMensual||0, cuotasAnuales: a.cuotasAnuales||0, totalAportado: 0, movs: [] };
  }
  for (const m of movs6) {
    // Aportes de combustible (rubro 42) sin adherente asignado se agrupan como "⛽ Combustible"
    const key = m.adherente || (m.codRubro === "42" ? "⛽ Combustible" : "Sin adherente");
    if (!map[key]) map[key] = { adherente: key, cuotaMensual: 0, cuotasAnuales: 0, totalAportado: 0, movs: [] };
    map[key].totalAportado += m.ingreso;
    map[key].movs.push(m);
  }
  return Object.values(map)
    .filter(r => r.totalAportado > 0 || (r.cuotaMensual > 0 && r.cuotasAnuales > 0))
    .map(r => {
      const compromisoAnual = r.cuotaMensual * r.cuotasAnuales;
      // pagosCount = cantidad real de movimientos (2 pagos en el mismo mes cuentan 2)
      const pagosCount = r.movs.length;
      // porMes: monto sumado por mes (celda de la planilla); el detalle por movimiento
      // sigue disponible en r.movs al expandir la fila
      const porMes = {};
      for (const m of r.movs) {
        const k = mesFromRecord(m);
        porMes[k] = (porMes[k] || 0) + m.ingreso;
      }
      let diferencia = null, estado = null;
      if (compromisoAnual > 0) {
        diferencia = r.totalAportado - compromisoAnual;
        estado = diferencia >= 0 ? "OK" : (r.totalAportado > 0 ? "PARCIAL" : "SIN");
      }
      return { ...r, compromisoAnual, pagosCount, porMes, diferencia, estado };
    });
}

// Independiente del filtro de año de la pantalla: cuánto aportó (o le falta aportar) cada
// adherente en el mes EN CURSO, para el KPI y el marcado en rojo de "pendiente este mes".
function calcPendientesMesActual() {
  const mesActual = nowMes();
  const aportadoPorNombre = {};
  for (const m of movimientos) {
    if (!esAporteAdherente(m)) continue;
    if (mesFromRecord(m) !== mesActual) continue;
    const key = m.adherente || (m.codRubro === "42" ? "⛽ Combustible" : "Sin adherente");
    aportadoPorNombre[key] = (aportadoPorNombre[key] || 0) + m.ingreso;
  }
  let totalPendiente = 0;
  const pendientePorNombre = {};
  for (const a of adherentes) {
    const aportado = aportadoPorNombre[a.nombre] || 0;
    const cuota = a.cuotaMensual || 0;
    if (cuota > 0) {
      const pend = Math.max(cuota - aportado, 0);
      pendientePorNombre[a.nombre] = pend > TOL;
      totalPendiente += pend;
    } else {
      // Sin cuota mensual definida: no hay un monto concreto que reclamar, pero igual
      // sirve marcarlo si no aportó nada este mes.
      pendientePorNombre[a.nombre] = aportado <= TOL;
    }
  }
  return { mesActual, pendientePorNombre, totalPendiente };
}

// Igual criterio que calcPendientesMesActual() (cuota mensual pendiente si está definida,
// o "no aportó nada este mes" si no hay cuota configurada), pero para un mes arbitrario y
// con el universo de nombres ampliado: como muchos clubes no cargan una lista formal de
// "adherentes" (la entidad puede estar vacía), el nombre del adherente sale del propio
// movimiento (m.adherente) — sin esto, cualquier club sin entidades registradas vería
// siempre "sin adherentes" en Resumen > Mensual aunque tenga aportes reales cargados.
function calcPendientesEnMes(mes) {
  const aportadoPorNombre = {};
  const nombres = new Set(adherentes.map(a => a.nombre));
  for (const m of movimientos) {
    if (!esAporteAdherente(m)) continue;
    const key = m.adherente || (m.codRubro === "42" ? "⛽ Combustible" : "Sin adherente");
    nombres.add(key);
    if (mesFromRecord(m) === mes) aportadoPorNombre[key] = (aportadoPorNombre[key] || 0) + m.ingreso;
  }
  const cuotaPorNombre = {};
  for (const a of adherentes) cuotaPorNombre[a.nombre] = a.cuotaMensual || 0;

  const pendientes = [];
  for (const nombre of nombres) {
    const aportado = aportadoPorNombre[nombre] || 0;
    const cuota = cuotaPorNombre[nombre] || 0;
    const estaPendiente = cuota > 0 ? (cuota - aportado) > TOL : aportado <= TOL;
    if (estaPendiente) pendientes.push(nombre);
  }
  pendientes.sort((a,b) => a.localeCompare(b));
  return { pendientes, totalCount: nombres.size, pagadosCount: nombres.size - pendientes.length };
}

    adherenteAnio = anios[0];
  }

  const pendMes = calcPendientesMesActual();
  let rows = calcAdherentesPorAnio(adherenteAnio)
    .map(r => ({ ...r, pendienteEsteMes: !!pendMes.pendientePorNombre[r.adherente] }));
  if (adhResumenSoloPendientesMes) rows = rows.filter(r => r.pendienteEsteMes);

  // Meses a mostrar como columnas: unión de todos los adherentes del año seleccionado,
  // solo los que tengan al menos un pago (sin meses futuros vacíos)
  const movs6Anio = movs6All.filter(m => !adherenteAnio || m.fecha.slice(0,4) === adherenteAnio);
  const meses = [...new Set(movs6Anio.map(m => mesFromRecord(m)))].filter(Boolean).sort();

  const viewToggle = `
