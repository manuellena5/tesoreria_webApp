// ── Rubro Searchable Select ───────────────────────────────────
let ssRubroActiveIndex = -1;

function initRubroSelect() {
  const input = document.getElementById("ss-rubro-input");
  const drop  = document.getElementById("ss-rubro-drop");
  if (!input || !drop) return;

  input.oninput = function() { filterRubros(this.value); drop.style.display = "block"; };
  input.onfocus = function() {
    if (F.rubro) input.select(); else input.value = "";
    filterRubros(input.value);
    drop.style.display = "block";
  };
  input.onblur = function() {
    setTimeout(() => {
      drop.style.display = "none";
      if (!F.rubro) input.value = "";
      else input.value = "[" + F.codRubro + "] " + F.rubro;
    }, 200);
  };
  input.onkeydown = function(e) {
    if (drop.style.display === "none") return;
    const items = [...drop.querySelectorAll(".ss-item[data-cod]")];
    if (!items.length) return;
    if (e.key === "ArrowDown") {
      e.preventDefault();
      ssRubroActiveIndex = (ssRubroActiveIndex + 1) % items.length;
      highlightRubroItem(items);
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      ssRubroActiveIndex = (ssRubroActiveIndex - 1 + items.length) % items.length;
      highlightRubroItem(items);
    } else if (e.key === "Escape") {
      drop.style.display = "none";
      input.blur();
    } else if (e.key === "Enter" || e.key === "Tab") {
      // Selecciona el ítem resaltado, o el primero si todavía no se navegó con flechas
      const item = items[ssRubroActiveIndex >= 0 ? ssRubroActiveIndex : 0];
      if (e.key === "Enter") {
        e.preventDefault(); // evita submit accidental
        selectRubroItem(item, input, drop, true);
      } else {
        // Tab: no forzamos blur ni preventDefault, así el navegador mueve el foco
        // de forma nativa al siguiente campo (Concepto) después de seleccionar.
        selectRubroItem(item, input, drop, false);
      }
    }
  };
  drop.onmousedown = function(e) {
    const item = e.target.closest("[data-cod]");
    if (!item) return;
    e.preventDefault(); // Previene que el input pierda el foco
    selectRubroItem(item, input, drop, true);
  };
  filterRubros("");
}

function highlightRubroItem(items) {
  items.forEach((it, i) => it.classList.toggle("active", i === ssRubroActiveIndex));
  const active = items[ssRubroActiveIndex];
  if (active) active.scrollIntoView({ block: "nearest" });
}

// ── Cobro dividido ────────────────────────────────────────────────────────
// Un cobro que entró repartido entre varias cuentas (típico: la recaudación de un partido, parte
// en efectivo y parte en Mercado Pago). Emite un movimiento por fila en vez de uno solo con dos
// cuentas, porque `cuenta` es único y el saldo por cuenta depende de eso.
//
// Sólo en altas nuevas: editando, cada movimiento ya es una fila independiente y se toca por
// separado. Mezclar los dos modos obligaría a decidir qué pasa si al editar un reparto de 2 filas
// lo dejás en 1 (¿se borra el otro movimiento?), y no vale la pena para lo que resuelve.
function repartoDisponible() {
  return !editId && (F.tipo === "INGRESO" || F.tipo === "EGRESO");
}

function toggleReparto(on) {
  if (!repartoDisponible()) return;
  // Al activarlo arranca con dos filas —repartir en una sola no es repartir— y la primera hereda
  // el monto y la cuenta que ya venían cargados, para no hacer retipear lo que estaba puesto.
  F.reparto = on ? [{ monto: F.monto || "", cuenta: F.cuenta, modoPago: F.modoPago }, nuevaFilaReparto()] : null;
  renderNuevo();
}

function addFilaReparto()  { if (F.reparto) { F.reparto.push(nuevaFilaReparto()); renderNuevo(); } }
function delFilaReparto(i) { if (F.reparto && F.reparto.length > 2) { F.reparto.splice(i, 1); renderNuevo(); } }

function setRepartoCampo(i, campo, valor) {
  if (!F.reparto || !F.reparto[i]) return;
  F.reparto[i][campo] = valor;
  if (campo === "monto") updateRepartoTotal();
}

function repartoTotal() {
  return (F.reparto || []).reduce((s, f) => s + (parseFloat(f.monto) || 0), 0);
}

function updateRepartoTotal() {
  const el = document.getElementById("reparto-total");
  if (el) el.textContent = fmt(repartoTotal());
}

// Filas con monto cargado. Las vacías se ignoran en silencio al guardar: dejar una fila de más
// sin completar es lo más normal del mundo y no tiene por qué ser un error.
function repartoFilasValidas() {
  return (F.reparto || []).filter(f => f.monto !== "" && parseFloat(f.monto) > 0);
}

function renderRepartoBlock() {
  const filas = F.reparto || [];
  const rows = filas.map((f, i) => {
    const cuentaOpts = cuentas.map(c => `<option value="${esc(c)}" ${f.cuenta===c?"selected":""}>${esc(c)}</option>`).join("");
    const metodoOpts = metodos.map(m => `<option value="${esc(m)}" ${f.modoPago===m?"selected":""}>${esc(m)}</option>`).join("");
    return `<div style="display:flex;gap:6px;margin-bottom:6px;align-items:center">
      <input class="inp ${F.tipo==='INGRESO'?'monto-ing':'monto-egr'}" type="number" min="0" step="any" inputmode="decimal"
             placeholder="0" style="flex:1;min-width:80px" value="${esc(String(f.monto))}"
             oninput="setRepartoCampo(${i},'monto',this.value)">
      <select class="inp" style="flex:1;min-width:90px" onchange="setRepartoCampo(${i},'cuenta',this.value)">${cuentaOpts}</select>
      <select class="inp" style="flex:1;min-width:90px" onchange="setRepartoCampo(${i},'modoPago',this.value)">${metodoOpts}</select>
      <button class="btn-sm" title="Quitar esta fila" ${filas.length<=2?"disabled":""}
              style="${filas.length<=2?"opacity:.35":""}" onclick="delFilaReparto(${i})">✕</button>
    </div>`;
  }).join("");
  return `
    <div class="field">
      <label>Cobro dividido — se guarda un movimiento por fila</label>
      ${rows}
      <div style="display:flex;justify-content:space-between;align-items:center;margin-top:4px">
        <button class="btn-sm" onclick="addFilaReparto()">+ Agregar cuenta</button>
        <span style="font-size:13px;color:var(--text2)">Total: $<span id="reparto-total">${fmt(repartoTotal())}</span></span>
      </div>
    </div>`;
}

// ── Atajo de entradas vendidas en el form de movimientos ──────────────────
// El dato vive en el partido (PAR_COLS), no en el movimiento: un partido puede tener varios
// movimientos de entradas y no habría forma de saber cuál lleva el número bueno. Pero el momento
// natural para anotarlo es al cargar la recaudación, así que se ofrece acá y se escribe sobre el
// partido. Sólo aparece cuando el movimiento apunta a un partido y el rubro es de entradas.
const ENTRADAS_RUBROS = ["1", "4"];

function entradasRowAplica() {
  return !!F.partidoId && ENTRADAS_RUBROS.includes(F.codRubro);
}

// Muestra u oculta la fila y la precarga con lo que ya tiene el partido. Se llama cada vez que
// cambia el partido o el rubro, que son las dos cosas de las que depende.
function syncEntradasPartidoRow() {
  const row = document.getElementById("entradas-partido-row");
  if (!row) return;
  const aplica = entradasRowAplica();
  row.style.display = aplica ? "" : "none";
  if (!aplica) return;
  const p = partidos.find(x => x.id === F.partidoId);
  const set = (id, v) => { const el = document.getElementById(id); if (el) el.value = (v === "" || v == null) ? "" : String(v); };
  set("f-ent-caballeros", p ? p.entradasCaballeros : "");
  set("f-ent-damas",      p ? p.entradasDamas      : "");
}

// Persiste las entradas sobre el partido. Se llama después de guardar el movimiento y falla en
// silencio a propósito: el movimiento (que es la plata) ya se guardó bien, y hacer fallar todo el
// alta por un dato de asistencia sería peor que perderlo. Si falla, avisa y el número se puede
// cargar después desde el modal de partido.
async function guardarEntradasDelPartido(partidoId, damasRaw, caballerosRaw) {
  const p = partidos.find(x => x.id === partidoId);
  if (!p) return;
  const norm = v => { const s = String(v ?? "").trim(); return s === "" ? "" : Number(s); };
  const entradasDamas = norm(damasRaw), entradasCaballeros = norm(caballerosRaw);
  if (entradasDamas !== "" && (!Number.isFinite(entradasDamas) || entradasDamas < 0)) return;
  if (entradasCaballeros !== "" && (!Number.isFinite(entradasCaballeros) || entradasCaballeros < 0)) return;
  const igual = v => (v === "" ? "" : Number(v));
  if (igual(p.entradasDamas) === entradasDamas && igual(p.entradasCaballeros) === entradasCaballeros) return;
  try {
    const r = await Storage.savePartido({
      id: p.id, fecha: p.fecha, rival: p.rival, numeroFecha: p.numeroFecha,
      condicion: p.condicion, torneo: p.torneo, entradasDamas, entradasCaballeros
    });
    if (!r.ok) throw new Error(r.error || "Error");
    p.entradasDamas = entradasDamas;
    p.entradasCaballeros = entradasCaballeros;
    saveSnapshotToCache();
  } catch (e) {
    toast("El movimiento se guardó, pero no se pudieron guardar las entradas. Cargalas desde el partido.", "err");
  }
}

function selectRubroItem(item, input, drop, blurAfter) {
  if (!item) return;
  F.codRubro  = item.dataset.cod;
  F.rubro     = item.dataset.nombre;
  F.categoria = item.dataset.cat;
  input.value = "[" + F.codRubro + "] " + F.rubro;
  drop.style.display = "none";
  if (blurAfter) input.blur(); // Forzamos el blur después de seleccionar (clic / Enter)
  // Auto-set tipo to INTERNO if rubro 49
  if (F.codRubro === "49" && F.tipo !== "INTERNO") { F.tipo = "INTERNO"; renderNuevo(); return; }
  // Re-render for rubro 21 to show/hide conditional checkbox
  if (F.codRubro === "21" || F.codRubro === "49") { renderNuevo(); return; }
  // Highlight adherente row
  const adhRow = document.getElementById("adherente-row");
  if (adhRow) {
    if (F.rubro.toUpperCase().includes("ADHERENTE")) adhRow.classList.add("highlighted");
    else adhRow.classList.remove("highlighted");
  }
  syncEntradasPartidoRow();
}

function filterRubros(query) {
  const drop = document.getElementById("ss-rubro-drop");
  if (!drop) return;
  ssRubroActiveIndex = -1;
  const q = normStr(query);
  const cats = [...new Set(RUBROS.filter(r => !r.legacy).map(r => r.cat))];
  let html = "";
  for (const cat of cats) {
    const items = RUBROS.filter(r => r.cat === cat && !r.legacy && (!q ||
      normStr(r.nombre).includes(q) ||
      normStr(r.cod).includes(q)
    ));
    if (!items.length) continue;
    html += `<div class="ss-group">${esc(cat)}</div>`;
    for (const r of items) {
      html += `<div class="ss-item" data-cod="${r.cod}" data-nombre="${esc(r.nombre)}" data-cat="${esc(r.cat)}">[${r.cod}] ${esc(r.nombre)}</div>`;
    }
  }
  drop.innerHTML = html || `<div class="ss-empty">Sin resultados</div>`;
  // Resalta el primer resultado para que Enter/Tab lo seleccione directamente al tipear
  if (q) {
    ssRubroActiveIndex = 0;
    highlightRubroItem([...drop.querySelectorAll(".ss-item[data-cod]")]);
  }
}

// ── Save ─────────────────────────────────────────────────────
// Evita modificar datos en vivo mientras se está mirando una copia histórica de
// solo lectura (Config > Backups locales) — un guardado/edición ahí operaría
// sobre el servidor real con un estado local que no es el actual.
function bloqueadoPorVistaHistorica() {
  if (!viendoSnapshotHistorico) return false;
  toast("Estás viendo una copia local del " + viendoSnapshotHistorico + " — volvé a datos actuales antes de guardar o borrar", "err");
  return true;
}

async function saveMovimiento() {
  const btn = document.getElementById("btn-guardar-mov");
  if (btn && btn.disabled) return; // evita doble envío (doble tap / doble Enter)
  if (bloqueadoPorVistaHistorica()) return;

  const url = getScriptUrl();
  if (!url) { toast("Configurá la URL del script primero", "err"); goTab("config"); return; }
  if (!F.cuenta) { toast("Seleccioná una cuenta", "err"); return; }
  if (!F.fecha || isNaN(new Date(F.fecha + "T00:00:00").getTime())) { toast("Ingresá una fecha válida", "err"); return; }

  let mov;
  // Cobro dividido: se resuelve acá arriba porque cambia qué se valida (no hay un F.monto único) y
  // de dónde salen cuenta/método del movimiento principal.
  const usaReparto = !!F.reparto && repartoDisponible();
  const filasRep   = usaReparto ? repartoFilasValidas() : [];

  if (F.tipo === "AJUSTE") {
    if (F.saldoReal === "" || isNaN(+F.saldoReal)) { toast("Ingresá el saldo real de la cuenta", "err"); return; }
    const saldoReal      = parseFloat(F.saldoReal);
    // Excluir el ajuste que se está editando para no contar doble
    const movsBase       = editId ? movimientos.filter(m => m.id !== editId) : movimientos;
    const saldoCalculado = calcSaldosCuentas(movsBase)[F.cuenta] || 0;
    const diferencia     = saldoReal - saldoCalculado;
    if (diferencia === 0) { toast("El saldo ya coincide — no hay diferencia", "ok"); return; }
    const mes        = F.fecha.slice(0,7).replace("-","");
    const nombreMes  = mesLabel(F.fecha.slice(0,7));
    mov = {
      id: F.id, mes, fecha: F.fecha,
      codRubro: "99", rubro: "AJUSTE DE CONCILIACIÓN", categoria: "Otros / Internos",
      concepto: "Ajuste de saldo " + F.cuenta + " — " + nombreMes,
      egreso:     diferencia < 0 ? Math.abs(diferencia) : 0,
      ingreso:    diferencia > 0 ? diferencia : 0,
      montoFinal: diferencia,
      cuenta: F.cuenta, cuentaDestino: "",
      modoPago: "",
      jugadorCT: "", adherente: "",
      observacion: F.observacion || "", comprobante: "",
      seguroReintegro: 0,
      tipo: "AJUSTE"
    };
  } else {
    if (!F.rubro)   { toast("Seleccioná un rubro", "err"); return; }
    if (!F.concepto || !F.concepto.trim()) { toast("Ingresá un concepto", "err"); return; }
    if (usaReparto) {
      if (filasRep.length < 2) { toast("Cargá el monto en al menos dos cuentas, o destildá el cobro dividido", "err"); return; }
      // Dos filas a la misma cuenta serían dos movimientos idénticos: casi siempre es un descuido,
      // y si de verdad fueran dos cobros distintos van como dos altas separadas.
      const usadas = filasRep.map(f => f.cuenta);
      if (new Set(usadas).size !== usadas.length) { toast("Hay dos filas con la misma cuenta — juntalas en una", "err"); return; }
    } else {
      if (!F.monto || isNaN(+F.monto) || +F.monto <= 0) { toast("Ingresá un monto válido", "err"); return; }
    }
    if (F.tipo === "INTERNO") {
      if (!F.cuentaDestino) { toast("Seleccioná cuenta destino", "err"); return; }
      if (F.cuentaDestino === F.cuenta) { toast("La cuenta destino debe ser distinta a la de origen", "err"); return; }
    }
    const monto = usaReparto ? Math.abs(parseFloat(filasRep[0].monto)) : Math.abs(parseFloat(F.monto));
    const mes   = F.fecha.slice(0,7).replace("-","");
    mov = {
      id: F.id, mes, fecha: F.fecha,
      codRubro: F.codRubro, rubro: F.rubro, categoria: F.categoria,
      concepto: F.concepto.trim(),
      egreso:     F.tipo === "EGRESO"  ? monto : (F.tipo === "INTERNO" ? monto : 0),
      ingreso:    F.tipo === "INGRESO" ? monto : 0,
      montoFinal: monto,
      cuenta: usaReparto ? filasRep[0].cuenta : F.cuenta,
      cuentaDestino: F.cuentaDestino || "",
      modoPago: usaReparto ? filasRep[0].modoPago : F.modoPago,
      jugadorCT: F.jugadorCT || "", jugadorId: entidadIdPorNombre(F.jugadorCT),
      adherente: F.adherente || "", adherenteId: adherenteIdPorNombre(F.adherente),
      observacion: F.observacion || "", comprobante: F.comprobante || "",
      seguroReintegro: F.seguroReintegro || 0,
      tipo: F.tipo,
      partidoId: F.partidoId || "",
      eventoId: F.eventoId || "",
      vinculos: [],
    };
  }

  // Las entradas se leen del DOM ahora, antes de cualquier await: resetF() y el re-render posterior
  // vacían los inputs, así que después del guardado ya no estarían.
  const entradasPend = entradasRowAplica()
    ? { partidoId: F.partidoId,
        damas:      document.getElementById("f-ent-damas")?.value      ?? "",
        caballeros: document.getElementById("f-ent-caballeros")?.value ?? "" }
    : null;

  // Fecha llamativamente en el futuro: probablemente un error de tipeo, confirmamos antes de guardar.
  if (F.fecha > today() && !editId) {
    if (!confirm("La fecha (" + F.fecha + ") es posterior a hoy. ¿Confirmás que es correcta?")) return;
  }

  const wasEdit = !!editId;

  // Las filas 2..N del reparto: clones del movimiento principal que sólo difieren en monto, cuenta
  // y método. Comparten concepto, rubro, fecha, partido y evento, así que en cualquier reporte
  // agrupado (por partido, por rubro, por mes) suman como una sola cosa, que es lo que son.
  const movsExtra = usaReparto ? filasRep.slice(1).map(f => {
    const m = Math.abs(parseFloat(f.monto));
    return { ...mov, id: uid(),
             egreso:  F.tipo === "EGRESO"  ? m : 0,
             ingreso: F.tipo === "INGRESO" ? m : 0,
             montoFinal: m, cuenta: f.cuenta, modoPago: f.modoPago };
  }) : [];

  // Marca de alta. En un alta nueva es ahora; editando se conserva la original
  // para que el movimiento no se mueva de lugar en el orden de carga.
  if (wasEdit) {
    const prev = movimientos.find(m => m.id === mov.id);
    mov.timestamp = (prev && prev.timestamp) || "";
    mov.orden     = prev && prev.orden !== undefined ? prev.orden : 0;
  } else {
    mov.timestamp = nowTimestamp();
    // Al final de la lista hasta el próximo refresco desde la hoja
    mov.orden = movimientos.reduce((mx, m) => Math.max(mx, m.orden || 0), 0) + 1;
    // Órdenes consecutivos para que las filas del reparto queden juntas y en el orden en que se
    // cargaron, en vez de intercaladas con lo que venga después.
    movsExtra.forEach((me, i) => { me.timestamp = mov.timestamp; me.orden = mov.orden + i + 1; });
  }

  setSaveBtnState("saving");
  showOverlay(navigator.onLine ? "Guardando…" : "Guardando (sin conexión)…");
  // Si la conexión se corta en medio de un reparto, el principal puede haber entrado y una fila
  // posterior no. Sin esta marca, el catch offline volvería a encolar el principal y terminaría
  // duplicado en la hoja.
  let principalGuardado = false;
  try {
    const r = editId
      ? await Storage.updateMov(mov)
      : await Storage.saveMov(mov);
    if (!r.ok) throw new Error(r.error || "Error al guardar");
    // saveMov puede devolver un ID distinto al enviado si detectó una colisión
    // (reintento con F.id viejo, etc.) — usamos siempre el que confirmó el backend.
    if (r.id) mov.id = r.id;

    // Update local state
    if (editId) {
      const idx = movimientos.findIndex(m => m.id === mov.id);
      if (idx >= 0) movimientos[idx] = mov;
    } else {
      movimientos.push(mov);
    }
    principalGuardado = true;

    // Filas 2..N del reparto, una por una: el backend serializa las escrituras con un lock, así
    // que mandarlas en paralelo sólo haría que se peleen por él. Si una falla, las anteriores ya
    // quedaron guardadas — se avisa cuáles entraron para que la diferencia se vea en el momento y
    // no al conciliar el mes.
    for (const me of movsExtra) {
      const rx = await Storage.saveMov(me);
      if (!rx.ok) throw new Error("Se guardó " + mov.cuenta + " pero falló " + me.cuenta + ": " + (rx.error || "error"));
      if (rx.id) me.id = rx.id;
      movimientos.push(me);
    }
    // Refresh pagos in background — non-blocking, no second wait
    if (mov.adherente && mov.rubro.toUpperCase().includes("ADHERENTE")) {
      Storage.listPagos().then(rPag => { if (rPag.ok) pagos = rPag.pagos || []; });
    }
    // Asistencia del partido: va aparte del movimiento y sin bloquear el alta (ver la función).
    if (entradasPend) guardarEntradasDelPartido(entradasPend.partidoId, entradasPend.damas, entradasPend.caballeros);
    updateBadge();
    saveSnapshotToCache();
    resetF();
    hideOverlay();        // ocultar spinner antes del re-render
    renderNuevo();
    setSaveBtnState("saved");
    showMovSavedModal(mov, wasEdit, movsExtra);
  } catch(e) {
    hideOverlay();
    if (isNetworkError(e)) {
      // Sin conexión: guardamos localmente y encolamos para sincronizar después.
      if (!principalGuardado) {
        mov._pending = true;
        if (wasEdit) {
          const idx = movimientos.findIndex(m => m.id === mov.id);
          if (idx >= 0) movimientos[idx] = mov;
        } else {
          movimientos.push(mov);
        }
        addPendingMov(mov, wasEdit);
      }
      // Las filas del reparto que todavía no se guardaron van a la misma cola. Se filtran las que
      // ya entraron antes de que se cortara la conexión, para no encolarlas dos veces.
      for (const me of movsExtra) {
        if (movimientos.some(m => m.id === me.id)) continue;
        me._pending = true;
        movimientos.push(me);
        addPendingMov(me, false);
      }
      saveSnapshotToCache();
      updateBadge();
      resetF();
      renderNuevo();
      renderOfflineBanner();
      setSaveBtnState("saved");
      toast("Sin conexión — guardado localmente, se sincroniza al reconectar", "ok");
    } else {
      setSaveBtnState("error");
      toast("Error: " + e.message, "err");
    }
  }
}

// Refleja visualmente el estado del envío en un botón Guardar/Agregar para que quede
// claro que el toque se registró y evitar reenvíos accidentales. Genérico: recibe el id
// del botón (movimientos y todos los ABM de entidades usan la misma función).
function setBtnState(btnId, state) {
  const btn = document.getElementById(btnId);
  if (!btn) return;
  if (state === "saving") {
    btn.disabled = true;
    btn.classList.add("is-saving");
    btn.dataset.label = btn.textContent;
    btn.textContent = "Guardando…";
  } else if (state === "saved") {
    // Si el flujo re-renderizó el botón, textContent ya es el rótulo original;
    // si no (modales que siguen abiertos), lo recuperamos de dataset.label.
    const original = btn.dataset.label || btn.textContent;
    delete btn.dataset.label;
    btn.classList.remove("is-saving");
    btn.classList.add("is-saved");
    btn.textContent = "✓ Guardado";
    btn.disabled = false;
    setTimeout(() => {
      btn.classList.remove("is-saved");
      if (document.getElementById(btnId) === btn) btn.textContent = original;
    }, 1200);
  } else {
    btn.disabled = false;
    btn.classList.remove("is-saving");
    if (btn.dataset.label) { btn.textContent = btn.dataset.label; delete btn.dataset.label; }
  }
}
function setSaveBtnState(state) { setBtnState("btn-guardar-mov", state); }

// Error handler común de los guardados de entidades: rehabilita el botón y distingue
// error de red (estas pantallas no tienen cola offline) de error de la app.
function handleSaveError(btnId, e) {
  setBtnState(btnId, "error");
  toast(isNetworkError(e) ? "Sin conexión — no se pudo guardar, probá de nuevo" : "Error: " + e.message, "err");
}

// Mismo criterio que handleSaveError, pero para botones de eliminar (vuelven a mostrar "✕").
function handleDeleteError(btnId, e) {
  const btn = document.getElementById(btnId);
  if (btn) { btn.disabled = false; btn.textContent = "✕"; delete btn.dataset.confirm; }
  toast(isNetworkError(e) ? "Sin conexión — no se pudo eliminar, probá de nuevo" : "Error: " + e.message, "err");
}

// ══════════════════════════════════════════════════════════════
// TAB 2 — MOVIMIENTOS DEL MES
// ══════════════════════════════════════════════════════════════

// Saldo acumulado del año en curso (Enero → mes seleccionado), respetando el filtro de cuenta activo.
// Mismo criterio que el saldo del mes: INGRESO/EGRESO suman siempre; los INTERNO sólo impactan
// cuando hay una cuenta puntual filtrada (transferencia real hacia/desde esa cuenta).
function calcSaldoAcumuladoAnio(cuentaFiltro) {
  const anioSel = sharedMes.slice(0,4);
  const mesNumSel = mesToNum(sharedMes);
  const movAcc = movimientos
    .filter(m => m.fecha && m.fecha.slice(0,4) === anioSel && mesToNum(mesFromRecord(m)) <= mesNumSel)
    .filter(m => !cuentaFiltro || m.cuenta === cuentaFiltro || m.cuentaDestino === cuentaFiltro);
  let ingAcc = movAcc.filter(m => m.tipo === "INGRESO").reduce((s,m) => s + m.ingreso, 0);
  let egrAcc = movAcc.filter(m => m.tipo === "EGRESO" ).reduce((s,m) => s + m.egreso,  0);
  if (cuentaFiltro) {
    for (const m of movAcc) {
      if (m.tipo !== "INTERNO") continue;
      if (m.cuenta === cuentaFiltro)        egrAcc += m.montoFinal;
      if (m.cuentaDestino === cuentaFiltro) ingAcc += m.montoFinal;
    }
  }
  return ingAcc - egrAcc;
}

    <div class="sum-grid">

      <div class="stat-card">

      <div class="stat-card">

    <div class="filter-row" style="gap:8px">

        <input class="inp ss-filter-input" id="fil-rubro" list="dl-rubros" placeholder="Rubro…"

      <div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap">
        <span class="sec-title" id="mov-count"></span>

          <label style="font-size:11px;color:var(--text3);white-space:nowrap">Orden:</label>
          <select class="inp" id="mov-orden-sel" style="padding:5px 8px;font-size:11px;width:auto" onchange="setMovOrden(this.value)">
            <option value="fecha_desc" ${movOrden==='fecha_desc'?'selected':''}>Más reciente primero</option>
            <option value="fecha_asc"  ${movOrden==='fecha_asc' ?'selected':''}>Más antiguo primero</option>
            <option value="monto_desc" ${movOrden==='monto_desc'?'selected':''}>Mayor monto primero</option>
            <option value="monto_asc"  ${movOrden==='monto_asc' ?'selected':''}>Menor monto primero</option>
          </select>
        </div>
        <div class="reint-view-toggle">
          <button class="reint-view-btn ${movVista==='tabla'?'active':''}" onclick="setMovVista('tabla')">⊞ Tabla</button>
          <button class="reint-view-btn ${movVista==='cards'?'active':''}" onclick="setMovVista('cards')">▤ Cards</button>

function setMovOrden(v) {
  movOrden = v;
  localStorage.setItem("clubfm_orden_mov", v);
  renderMovList();
}

function setMovVista(v) {
  movVista = v;
  localStorage.setItem("movimientos_vista", v);
  renderMovList();
}

// Columnas de la vista tabla de Movimientos (variante propia de DT_COLS: sin "Mes"
// porque la pantalla ya muestra un solo mes a la vez, y con Cuenta/Partido propios).
// "acciones" es "pinned": no se puede ocultar desde el selector de columnas.
const MOV_TABLE_COLS = [
  { key:"acciones",  label:"",                  sortable:false, pinned:true,
    render: it => `<button class="btn-sm accent dt-edit-btn" onclick="openMovModal('${escJs(it.id)}')">✏️</button>` },
  { key:"fecha",     label:"Fecha",             sortable:true },
  { key:"concepto",  label:"Concepto",          sortable:true, cls:"jd-concepto" },
  { key:"monto",     label:"Monto",             sortable:true },
  { key:"rubro",     label:"Rubro",             sortable:true },
  { key:"categoria", label:"Categoría",         sortable:true },
  { key:"cuenta",    label:"Cuenta",            sortable:true },
  { key:"entidad",   label:"Jugador/Adherente", sortable:true },
  { key:"partido",   label:"Partido",           sortable:true },
];

function renderMovTabla(movMes) {
  const cuentaFiltro = listFiltros.cuenta;
  const items = movMes.map(m => {
    // INTERNO: sin filtro de cuenta (o filtrando por la cuenta de origen) se ve como
    // egreso (sale de esa cuenta); si se filtra justo por la cuenta DESTINO, es un
    // ingreso real para esa cuenta y debe verse en verde, no en rojo.
    const monto = m.tipo==="INGRESO" ? m.ingreso
                : m.tipo==="EGRESO"  ? -m.egreso
                : m.tipo==="AJUSTE"  ? m.montoFinal
                : (cuentaFiltro && m.cuentaDestino === cuentaFiltro) ? m.montoFinal : -m.montoFinal;
    return {
      id: m.id,
      fechaRaw: m.fecha || "",
      // Desempate de la columna Fecha: orden de carga (ver detTablaRenderInner)
      cargaMs: movTsMs(m),
      cargaOrden: m.orden || 0,
      fechaD: m.fecha ? m.fecha.slice(8,10)+"/"+m.fecha.slice(5,7)+"/"+m.fecha.slice(0,4) : "",
      concepto: m.concepto || "",
      monto,
      rubro: m.rubro || "",
      categoria: m.categoria || "",
      cuenta: m.tipo==="INTERNO" ? `${m.cuenta||""} → ${m.cuentaDestino||""}` : (m.cuenta||""),
      entidad: m.jugadorCT || m.adherente || "",
      partido: m.partidoId ? partidoLabel(m.partidoId) : "",
    };
  });
  return renderDetTabla("movlist", items, MOV_TABLE_COLS);
}

// Movimientos del mes seleccionado con todos los filtros de listFiltros aplicados
// (usado tanto por renderMovList como por exportExcelFiltrado, para no duplicar la lógica)
function getMovimientosFiltrados() {
  return movimientos
    .filter(m => mesFromRecord(m) === sharedMes)
    .filter(m => !listFiltros.rubro  || normStr(m.rubro).includes(normStr(listFiltros.rubro)))
    .filter(m => !listFiltros.cat    || normStr(m.categoria).includes(normStr(listFiltros.cat)))
    .filter(m => !listFiltros.cuenta || m.cuenta === listFiltros.cuenta || m.cuentaDestino === listFiltros.cuenta)
    .filter(m => !listFiltros.tipo      || m.tipo        === listFiltros.tipo)
    .filter(m => !listFiltros.adherente || normStr(m.adherente).includes(normStr(listFiltros.adherente)))
    .filter(m => !listFiltros.jugadorCT || normStr(m.jugadorCT).includes(normStr(listFiltros.jugadorCT)))
    .filter(m => {
      if (!listFiltros.partido) return true;
      if (listFiltros.partido === "__sin__") return !m.partidoId;
      return m.partidoId === listFiltros.partido;
    })
    .filter(m => {
      if (!listFiltros.evento) return true;
      if (listFiltros.evento === "__sin__") return !m.eventoId;
      return m.eventoId === listFiltros.evento;
    })
    .filter(m => {
      const q = normStr(listFiltros.search);
      return !q || normStr(m.concepto).includes(q) || normStr(m.observacion).includes(q);
    });
}

function listFiltrosActive() {
  return !!(listFiltros.rubro || listFiltros.cat || listFiltros.cuenta || listFiltros.tipo ||
    listFiltros.adherente || listFiltros.jugadorCT || listFiltros.partido || listFiltros.evento || listFiltros.search);
}

function renderMovList() {
  const movMes = getMovimientosFiltrados();

  // KPIs sobre el subtotal filtrado (igual al total del mes cuando no hay filtros extra)
  // Nota: las transferencias INTERNAS no suman al total general del club (no
  // entra ni sale plata, sólo cambia de cuenta), pero cuando el usuario filtra
  // por una cuenta puntual sí representan un movimiento real para esa cuenta:
  // egreso si la cuenta es el origen, ingreso si es el destino.
  const cuentaFiltro = listFiltros.cuenta;
  let ingTotal = movMes.filter(m => m.tipo === "INGRESO").reduce((s,m) => s + m.ingreso, 0);
  let egrTotal = movMes.filter(m => m.tipo === "EGRESO" ).reduce((s,m) => s + m.egreso,  0);
  if (cuentaFiltro) {
    for (const m of movMes) {
      if (m.tipo !== "INTERNO") continue;
      if (m.cuenta === cuentaFiltro)        egrTotal += m.montoFinal;
      if (m.cuentaDestino === cuentaFiltro) ingTotal += m.montoFinal;
    }
  }
  const saldo = ingTotal - egrTotal;
  const kpiIng = document.getElementById("kpi-ing");
  const kpiEgr = document.getElementById("kpi-egr");
  const kpiSaldo = document.getElementById("kpi-saldo");
  if (kpiIng) kpiIng.textContent = fmt(ingTotal);
  if (kpiEgr) kpiEgr.textContent = fmt(egrTotal);
  if (kpiSaldo) {
    kpiSaldo.textContent = (saldo<0?"-":"") + fmt(saldo);
    kpiSaldo.className = "stat-val " + (saldo>=0?"ing":"egr");
  }
  const kpiSaldoAcc = document.getElementById("kpi-saldo-acc");
  if (kpiSaldoAcc) {
    const saldoAcc = calcSaldoAcumuladoAnio(cuentaFiltro);
    kpiSaldoAcc.textContent = (saldoAcc<0?"-":"") + fmt(saldoAcc);
    kpiSaldoAcc.className = "stat-val " + (saldoAcc>=0?"ing":"egr");
    const lblAcc = kpiSaldoAcc.previousElementSibling;
    if (lblAcc) lblAcc.textContent = `Saldo acum. ${sharedMes.slice(0,4)}`;
  }
  const filtersActive = listFiltrosActive();
  const noteEl = document.getElementById("kpi-filter-note");
  if (noteEl) {
    const notaCuenta = cuentaFiltro
      ? ` · Incluye transferencias internas hacia/desde ${esc(cuentaFiltro)}`
      : "";
    noteEl.innerHTML = filtersActive
      ? `Mostrando subtotal filtrado${notaCuenta} · <a href="#" onclick="clearListFilters();return false;" style="color:var(--accent)">Ver mes completo</a>`
      : "";
  }
  const exportBtn = document.getElementById("mov-export-btn");
  if (exportBtn) exportBtn.innerHTML = `📥 Exportar ${mesLabel(sharedMes)}${filtersActive ? ' (filtrado)' : ''} a Excel`;

  // Orden, aplicado después de filtrar. Por fecha se desempata por orden de carga
  // (ver cmpMovFecha), así los movimientos del mismo día quedan como se ingresaron.
  movMes.sort((a,b) => {
    if (movOrden === "fecha_asc")  return  cmpMovFecha(a,b);
    if (movOrden === "monto_desc") return Math.abs(b.montoFinal) - Math.abs(a.montoFinal);
    if (movOrden === "monto_asc")  return Math.abs(a.montoFinal) - Math.abs(b.montoFinal);
    return -cmpMovFecha(a,b); // fecha_desc (default)
  });

  const cnt = document.getElementById("mov-count");
  if (cnt) cnt.textContent = movMes.length + " movimiento" + (movMes.length!==1?"s":"");

  const el = document.getElementById("mov-list");
  if (!el) return;
  if (!movMes.length) {
    el.innerHTML = `<div class="empty"><div class="ico">📋</div><p>Sin movimientos${listFiltros.search ? " para esa búsqueda" : " en este mes"}</p></div>`;
    return;
  }

  if (movVista === "tabla") {
    el.innerHTML = `<div class="mov-table-breakout">${renderMovTabla(movMes)}</div>`;
    return;
  }

  el.innerHTML = movMes.map(m => {
    const montoClass = m.tipo==="INGRESO" ? "ing" : m.tipo==="EGRESO" ? "egr" : m.tipo==="AJUSTE" ? "adj" : "int";
    const montoVal   = m.tipo==="INGRESO" ? m.ingreso : m.tipo==="AJUSTE" ? Math.abs(m.montoFinal) : m.egreso || m.montoFinal;
    const montoSign  = m.tipo==="INGRESO" ? "+" : m.tipo==="EGRESO" ? "−" : m.tipo==="AJUSTE" ? (m.montoFinal>=0?"⊙+":"⊙−") : "⇄";
    const tagsHtml = `
          ${m._pending ? `<span class="tag" style="color:var(--warn);background:var(--warn-bg)">⏳ pendiente de sincronizar</span>` : ""}
          <span class="tag tag-cuenta">${esc(m.cuenta)}</span>
          ${m.jugadorCT ? `<span class="tag tag-jug">${esc(m.jugadorCT)}</span>` : ""}
          ${m.adherente ? `<span class="tag tag-adh">${esc(m.adherente)}</span>` : ""}
          ${m.partidoId ? `<span class="tag tag-partido">⚽ ${esc(partidoLabel(m.partidoId))}</span>` : ""}
          ${m.tipo==="INTERNO" ? `<span class="tag tag-int">→ ${esc(m.cuentaDestino||"?")}</span>` : ""}
          ${m.tipo==="AJUSTE" ? `<span class="tag tag-adj">⊙ ajuste</span>` : ""}`;
    return `
    <div class="mov-card" onclick="openMovModal('${m.id}')">
      <div class="mov-card-row1">
        <span class="mov-card-fecha-big">${fechaCorta(m.fecha)}</span>
        <span class="monto ${montoClass} mov-card-monto">${montoSign}${fmt(montoVal)}</span>
      </div>
      <div class="mov-card-rubro-full">${esc(m.rubro)}</div>
      <div class="mov-card-row3">
        <span class="mov-card-concepto">${esc(m.concepto) || '<span style="color:var(--text3)">Sin concepto</span>'}</span>
        <span class="mov-card-modo">${esc(m.modoPago)}</span>
      </div>
      ${tagsHtml.trim() ? `<div class="mov-card-tags">${tagsHtml}</div>` : ""}
    </div>`;
  }).join("");
}

function setListFilter(key, val) {
  if (listFiltros[key] === val) listFiltros[key] = "";
  else listFiltros[key] = val;
  renderMovimientos();
}
function clearListFilters() {
  listFiltros = { rubro: "", cat:"", cuenta:"", tipo:"", adherente:"", jugadorCT:"", partido:"", evento:"", search:"" };
  renderMovimientos();
}
function changeMes(delta) {
  sharedMes = delta < 0 ? prevMes(sharedMes) : nextMes(sharedMes);
  if (currentTab === "movimientos") renderMovimientos();
  else if (currentTab === "resumen") {
    catResExpandido.clear();
    adhResumenOpen = false;
    renderResumen();
  }
}

function openMovModal(id) {
  const m = movimientos.find(x => x.id === id);
  if (!m) return;
  const montoClass = m.tipo==="INGRESO" ? "ing" : m.tipo==="EGRESO" ? "egr" : m.tipo==="AJUSTE" ? "adj" : "int";
  const montoVal   = m.tipo==="INGRESO" ? m.ingreso : m.tipo==="AJUSTE" ? Math.abs(m.montoFinal) : m.egreso || m.montoFinal;
  const montoSign  = m.tipo==="INGRESO" ? "+" : m.tipo==="EGRESO" ? "−" : m.tipo==="AJUSTE" ? (m.montoFinal>=0?"⊙+":"⊙−") : "⇄";
  const rows = [
    ["Tipo",        m.tipo],
    ["Fecha",       m.fecha],
    ["Mes",         mesLabel(m.mes ? m.mes.slice(0,4)+"-"+m.mes.slice(4) : "")],
    ["Rubro",       "["+m.codRubro+"] "+m.rubro],
    ["Categoría",   m.categoria],
    ["Concepto",    m.concepto || "—"],
    ["Cuenta",      m.cuenta + (m.cuentaDestino ? " → "+m.cuentaDestino : "")],
    ["Método pago", m.modoPago],
    ["Jugador/CT",  m.jugadorCT || "—"],
    ["Adherente",   m.adherente || "—"],
    ["Partido",     m.partidoId ? partidoLabel(m.partidoId) : "—"],
    (m.codRubro === "21" && m.tipo === "EGRESO") ? ["Reintegro", m.seguroReintegro ? "SÍ" : "NO"] : null,
    ["Observación", m.observacion || "—"],
    ["Comprobante", m.comprobante || "—"],
    ["Cargado",     fmtTimestamp(m.timestamp)],
  ].filter(r => r && r[1] && r[1] !== "—").map(([l,v]) =>
    `<div class="modal-detail-row"><span class="modal-detail-lbl">${l}</span><span class="modal-detail-val">${esc(v)}</span></div>`
  ).join("");

  document.getElementById("modal-root").innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div class="modal-monto-big ${montoClass}">${montoSign}${fmt(montoVal)}</div>
        ${rows}
        <div class="modal-footer">
          <button class="btn-secondary" style="flex:1" onclick="abrirComprobanteModal('${id}')">🧾 Comprobante</button>
          <button class="btn-secondary" style="flex:1" onclick="editMovimiento('${id}')">✏️ Editar</button>
          <button class="btn-sm danger" style="padding:12px 16px" id="del-btn-${id}" onclick="confirmDelete('${id}')">🗑</button>
        </div>
      </div>
    </div>`;
}

function confirmDelete(id) {
  const btn = document.getElementById("del-btn-"+id);
  if (!btn) return;
  if (btn.dataset.confirm) {
    deleteMovimiento(id);
  } else {
    btn.dataset.confirm = "1";
    btn.textContent = "¿Eliminar?";
    btn.style.color = "var(--red)";
    setTimeout(() => { if(btn){ btn.dataset.confirm=""; btn.textContent="🗑"; btn.style.color=""; }}, 3000);
  }
}

async function deleteMovimiento(id) {
  if (bloqueadoPorVistaHistorica()) return;
  closeModal();
  const mov = movimientos.find(m => m.id === id);
  // Cargado offline y todavía no sincronizado con el backend: no existe allá
  // todavía, así que Storage.deleteMov devolvería "no encontrado". Lo sacamos
  // directo de la cola local en vez de pegarle al servidor.
  if (mov && mov._pending) {
    movimientos = movimientos.filter(m => m.id !== id);
    removePendingMov(id);
    updateBadge();
    saveSnapshotToCache();
    toast("Movimiento eliminado", "ok");
    renderMovimientos();
    return;
  }
  // Si el movimiento es la contrapartida de pagos ya confirmados, borrarlo los devuelve a
  // pendiente (el backend lo hace en cascada). Avisamos antes con nombre y apellido, porque
  // deshace bastante más de lo que se ve en la fila que el usuario está mirando.
  const pjAfectados  = (pagosJugadores || []).filter(p => p.movimientoId === id);
  const cuotasAfect  = (pagos || []).filter(p => p.movimientoId === id);
  if (pjAfectados.length || cuotasAfect.length) {
    const partes = [];
    if (pjAfectados.length) {
      const nombres = [...new Set(pjAfectados.map(p => p.jugadorNombre).filter(Boolean))];
      partes.push(`${pjAfectados.length} pago${pjAfectados.length!==1?"s":""} a jugadores (${nombres.join(", ")})`);
    }
    if (cuotasAfect.length) {
      const nombres = [...new Set(cuotasAfect.map(p => p.adherenteNombre).filter(Boolean))];
      partes.push(`${cuotasAfect.length} cuota${cuotasAfect.length!==1?"s":""} de adherentes (${nombres.join(", ")})`);
    }
    if (!confirm(
      "Este movimiento respalda " + partes.join(" y ") + ".\n\n" +
      "Si lo borrás, todo eso vuelve a quedar PENDIENTE y lo vas a poder incluir de nuevo en una transferencia.\n\n" +
      "¿Confirmás?"
    )) return;
  }

  showOverlay("Eliminando…");
  try {
    const r = await Storage.deleteMov(id);
    // El backend no lo tiene: puede ser un "fantasma" que quedó en un cache local
    // viejo/contaminado (ver refreshData, que ahora limpia ese cache) pero que
    // en la hoja real ya no existe. Sacarlo de la vista es lo correcto acá —
    // insistir con el mismo error para siempre solo confunde, porque nunca va
    // a poder "borrarse de nuevo" algo que el servidor ya no tiene.
    if (!r.ok && /no encontrado/i.test(r.error || "")) {
      movimientos = movimientos.filter(m => m.id !== id);
      removePendingMov(id);
      updateBadge();
      saveSnapshotToCache();
      toast("Ese movimiento ya no existía en el servidor — se quitó de la vista", "ok");
      renderMovimientos();
      return;
    }
    if (!r.ok) throw new Error(r.error || "Error al eliminar");
    movimientos = movimientos.filter(m => m.id !== id);
    removePendingMov(id); // por las dudas quedara encolado de una edición offline previa

    // Espejo local de lo que el backend revirtió, para que Transferencias y el estado de
    // cuotas queden al día sin tener que recargar todo.
    const rev = r.revertido || { jugadores: [], cuotas: [] };
    if ((rev.jugadores || []).length) {
      pagosJugadores.forEach(p => {
        if (p.movimientoId === id) { p.estado = "pendiente"; p.fechaPago = ""; p.medioPago = ""; p.movimientoId = ""; }
      });
    }
    if ((rev.cuotas || []).length) {
      pagos.forEach(p => {
        if (p.movimientoId === id) { p.estado = "PENDIENTE"; p.movimientoId = ""; }
      });
    }
    updateBadge();
    saveSnapshotToCache();
    const nJ = (rev.jugadores || []).length, nC = (rev.cuotas || []).length;
    const detalle = [
      nJ ? `${nJ} pago${nJ!==1?"s":""} a jugadores` : "",
      nC ? `${nC} cuota${nC!==1?"s":""}` : ""
    ].filter(Boolean).join(" y ");
    toast(detalle ? `Movimiento eliminado — ${detalle} volvió a pendiente` : "Movimiento eliminado", "ok");
    renderMovimientos();
  } catch(e) { toast("Error: " + e.message, "err"); }
  finally { hideOverlay(); }
}

function editMovimiento(id) {
  const m = movimientos.find(x => x.id === id);
  if (!m) return;
  F.id          = m.id;
  F.tipo        = m.tipo;
  F.fecha       = m.fecha;
  F.codRubro    = m.codRubro;
  F.rubro       = m.rubro;
  F.categoria   = m.categoria;
  F.concepto    = m.concepto;
  F.monto       = String(m.tipo === "INGRESO" ? m.ingreso : m.egreso || m.montoFinal);
  F.cuenta      = m.cuenta;
  F.cuentaDestino = m.cuentaDestino || "";
  F.modoPago    = m.modoPago;
  F.jugadorCT   = m.jugadorCT || "";
  F.adherente   = m.adherente || "";
  F.observacion = m.observacion || "";
  F.comprobante = m.comprobante || "";
  F.seguroReintegro = m.seguroReintegro || 0;
  F.saldoReal = "";
  F.partidoId = m.partidoId || "";
  F.eventoId  = m.eventoId || "";
  editId = id;
  closeModal();
  goTab("nuevo");
}

function closeModal(e) {
  if (e && e.target !== document.querySelector(".modal-overlay")) return;
  document.getElementById("modal-root").innerHTML = "";
}

// `hermanos` son las otras filas de un cobro dividido (vacío en un movimiento común). Cuando hay,
// el número grande pasa a ser el total del cobro —que es lo que se contrasta contra la planilla de
// caja— y el desglose por cuenta reemplaza a las filas de Cuenta y Método, que mostraban sólo las
// de la primera fila y hacían parecer que se había guardado de menos.
function showMovSavedModal(mov, wasEdit, hermanos) {
  compMovPendiente = mov; // por si todavía no está en el array de movimientos
  const partes     = [mov, ...(hermanos || [])];
  const esReparto  = partes.length > 1;
  const montoDe    = m => m.tipo==="INGRESO" ? m.ingreso : m.tipo==="AJUSTE" ? Math.abs(m.montoFinal) : m.egreso || m.montoFinal;
  const montoClass = mov.tipo==="INGRESO" ? "ing" : mov.tipo==="EGRESO" ? "egr" : mov.tipo==="AJUSTE" ? "adj" : "int";
  const montoVal   = partes.reduce((s, m) => s + montoDe(m), 0);
  const montoSign  = mov.tipo==="INGRESO" ? "+" : mov.tipo==="EGRESO" ? "\u2212" : mov.tipo==="AJUSTE" ? (mov.montoFinal>=0?"\u229a+":"\u229a\u2212") : "\u21c4";
  const detalles = [
    ["Tipo",      mov.tipo],
    ["Fecha",     mov.fecha],
    ["Rubro",     "["+mov.codRubro+"] "+mov.rubro],
    ["Concepto",  mov.concepto || null],
    esReparto ? null : ["Cuenta",    mov.cuenta + (mov.cuentaDestino ? " \u2192 "+mov.cuentaDestino : "")],
    esReparto ? null : ["M\u00e9todo",    mov.modoPago],
    mov.jugadorCT ? ["Jugador/CT", mov.jugadorCT] : null,
    mov.adherente ? ["Adherente",  mov.adherente]  : null,
    (mov.codRubro === "21" && mov.tipo === "EGRESO") ? ["Reintegro", mov.seguroReintegro ? "S\u00cd" : "NO"] : null,
    mov.observacion ? ["Observaci\u00f3n", mov.observacion] : null,
  ].filter(r => r && r[1]).map(([l,v]) =>
    `<div class="modal-detail-row"><span class="modal-detail-lbl">${l}</span><span class="modal-detail-val">${esc(v)}</span></div>`
  ).join("");
  // Una fila por cuenta, con lo que efectivamente entró en cada una. Va después de los datos
  // comunes (rubro, concepto) porque es lo que cambia entre las filas, no lo que comparten.
  const desglose = !esReparto ? "" :
    `<div class="modal-detail-row"><span class="modal-detail-lbl">Entró en ${partes.length} cuentas</span><span class="modal-detail-val"></span></div>` +
    partes.map(m => `<div class="modal-detail-row"><span class="modal-detail-lbl">${esc(m.cuenta)}${m.modoPago ? " · " + esc(m.modoPago) : ""}</span><span class="modal-detail-val ${montoClass}">${montoSign}${fmt(montoDe(m))}</span></div>`).join("");
  document.getElementById("modal-root").innerHTML = `
    <div class="modal-overlay" onclick="closeModal(event)">
      <div class="modal-card" onclick="event.stopPropagation()">
        <div class="modal-handle"></div>
        <div style="text-align:center;font-size:12px;font-weight:600;color:var(--green);letter-spacing:.05em;margin-bottom:2px">
          ${wasEdit ? "\u270f\ufe0f MOVIMIENTO ACTUALIZADO" : "\u2713 MOVIMIENTO GUARDADO"}
        </div>
        <div class="modal-monto-big ${montoClass}">${montoSign}${fmt(montoVal)}</div>
        ${esReparto ? `<div style="text-align:center;font-size:11px;color:var(--text3);margin:-4px 0 6px">total del cobro</div>` : ""}
        ${detalles}
        ${desglose}
        <div class="modal-footer">
          <button class="btn-secondary" style="flex:1" onclick="abrirComprobanteModal('${mov.id}')">🧾 Generar comprobante</button>
          <button class="btn-main" style="flex:1" onclick="document.getElementById('modal-root').innerHTML=''">Aceptar</button>
        </div>
      </div>
    </div>`;
}

function renderResumen() {
  const mesNum = mesToNum(sharedMes);
  const movMes = movimientos.filter(m => getMes(m.fecha) === sharedMes);
  const movHasta = movimientos.filter(m => mesToNum(getMes(m.fecha)) <= mesNum);

  const ingMes  = movMes.filter(m => m.tipo==="INGRESO").reduce((s,m) => s+m.ingreso, 0);
  const egrMes  = movMes.filter(m => m.tipo==="EGRESO" ).reduce((s,m) => s+m.egreso,  0);
  const saldoMes = ingMes - egrMes;

  const ingAcc  = movHasta.filter(m => m.tipo==="INGRESO").reduce((s,m) => s+m.ingreso, 0);
  const egrAcc  = movHasta.filter(m => m.tipo==="EGRESO" ).reduce((s,m) => s+m.egreso,  0);
  const saldoAcc = ingAcc - egrAcc;

  // Saldo por cuenta (todos los movimientos)
  const saldosCuentas = calcSaldosCuentas(movHasta);

  // Categorías del mes (egresos), con desglose por rubro dentro de cada una
  const catMap = {};
  for (const m of movMes) {
    if (m.tipo !== "EGRESO" && m.tipo !== "INGRESO") continue;
    if (!catMap[m.categoria]) catMap[m.categoria] = { ing:0, egr:0, rubros:{} };
    const cd = catMap[m.categoria];
    const rubroKey = m.codRubro || m.rubro || "(sin rubro)";
    if (!cd.rubros[rubroKey]) {
      const rubroNombre = m.rubro || RUBROS.find(r => r.cod === m.codRubro)?.nombre || "(sin rubro)";
      cd.rubros[rubroKey] = { nombre: rubroNombre, ing:0, egr:0 };
    }
    if (m.tipo === "INGRESO") { cd.ing += m.ingreso; cd.rubros[rubroKey].ing += m.ingreso; }
    else { cd.egr += m.egreso; cd.rubros[rubroKey].egr += m.egreso; }
  }
  const catItems = Object.entries(catMap)
    .map(([cat, v]) => ({ cat, ing:v.ing, egr:v.egr, rubros: Object.values(v.rubros).sort((a,b) => b.egr - a.egr) }))
    .filter(d => d.egr > 0 || d.ing > 0)
    .sort((a,b) => b.egr - a.egr);

  // Table — fila de categoría clickeable, expande el detalle por rubro debajo
  const tableRows = catItems.map(d => {
    const neto = d.ing - d.egr;
    const isExp = catResExpandido.has(d.cat);
    const detalleHtml = isExp ? d.rubros.map(r => {
      const rn = r.ing - r.egr;
      return `<tr class="sum-table-detail-row">
        <td style="padding-left:22px;font-size:11px;color:var(--text3)">${esc(r.nombre)}</td>
        <td class="ing" style="font-size:11px">${r.ing?fmt(r.ing):""}</td>
        <td class="egr" style="font-size:11px">${r.egr?fmt(r.egr):""}</td>
        <td class="net ${rn>=0?"":"egr"}" style="font-size:11px">${rn>=0?"+":"−"}${fmt(rn)}</td>
      </tr>`;
    }).join("") : "";
    return `<tr class="sum-table-row-toggle" onclick="toggleCatRes('${esc(escJs(d.cat))}')">
      <td>${isExp?"▾":"▸"} ${esc(d.cat)}</td>
      <td class="ing">${d.ing?fmt(d.ing):""}</td>
      <td class="egr">${d.egr?fmt(d.egr):""}</td>
      <td class="net ${neto>=0?"":"egr"}">${neto>=0?"+":"−"}${fmt(neto)}</td>
    </tr>${detalleHtml}`;
  }).join("");

  // Adherentes del mes — mismo criterio que Resumen > Adherentes (calcPendientesMesActual),
  // pero para el mes seleccionado en pantalla (sharedMes) en vez del mes real en curso
  const pendAdh = calcPendientesEnMes(sharedMes);
  const adhPendientesHtml = pendAdh.pendientes.map(nombre => `<div class="adh-item-res">
      <span class="nombre">${esc(nombre)}</span>
      <span class="adh-estado pendiente">PENDIENTE</span>
    </div>`).join("");

  // Top 10 jugadores/CT por monto neto (egresos - ingresos) en el mes
  const jugMontoMes = {};
  for (const m of movMes) {
    if (m.jugadorCT) {
      if (!jugMontoMes[m.jugadorCT]) jugMontoMes[m.jugadorCT] = { egr: 0, ing: 0 };
      if (m.tipo === "EGRESO")  jugMontoMes[m.jugadorCT].egr += m.egreso;
      if (m.tipo === "INGRESO") jugMontoMes[m.jugadorCT].ing += m.ingreso;
    }
  }
  const top10Jug = Object.entries(jugMontoMes)
    .map(([nombre, v]) => [nombre, v.egr - v.ing])
    .filter(([, neto]) => neto !== 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 10);
  const totalJugMes = top10Jug.reduce((s,[,v]) => s + v, 0);
  const avgJugMes   = top10Jug.length ? totalJugMes / top10Jug.length : 0;

  // Promedio mensual histórico por jugador/CT (monto neto)
  function avgMensualJug(nombre) {
    const mesMap = {};
    for (const m of movimientos) {
      if (m.jugadorCT === nombre) {
        const k = mesFromRecord(m);
        if (!mesMap[k]) mesMap[k] = { egr: 0, ing: 0 };
        if (m.tipo === "EGRESO")  mesMap[k].egr += m.egreso;
        if (m.tipo === "INGRESO") mesMap[k].ing += m.ingreso;
      }
    }
    const vals = Object.values(mesMap).map(v => v.egr - v.ing).filter(n => n !== 0);
    return vals.length ? vals.reduce((s,v) => s + v, 0) / vals.length : 0;
  }
  const jugTableRows = top10Jug.map(([nombre, neto], i) => {
    const avg = avgMensualJug(nombre);
    const clsNeto = neto < 0 ? "ing" : "egr";
    const clsAvg  = avg  < 0 ? "ing" : "egr";
    return `<tr>
      <td>${i+1}. ${esc(nombre)}</td>
      <td class="${clsNeto}">${neto < 0 ? "-" : ""}${fmt(neto)}</td>
      <td class="${clsAvg}" style="opacity:.7">${avg < 0 ? "-" : ""}${fmt(avg)}</td>
    </tr>`;
  }).join("");

  // Saldo cuentas html
  const ajustesPorCuenta = {};
  for (const m of movimientos) {
    if (m.tipo === "AJUSTE") {
      if (!ajustesPorCuenta[m.cuenta] || m.fecha > ajustesPorCuenta[m.cuenta].fecha) {
        ajustesPorCuenta[m.cuenta] = m;
      }
    }
  }
  const cuentasHtml = cuentas.map(c => {
    const s  = saldosCuentas[c] || 0;
    const aj = ajustesPorCuenta[c];
    const ajHtml = aj ? `<span class="cuenta-adj-note">
      ⊙ últ. ajuste ${aj.fecha.slice(8)+"/"+aj.fecha.slice(5,7)} ${aj.montoFinal>=0?"+":""}${fmt(aj.montoFinal)}</span>` : "";
    return `<div class="cuenta-item cuenta-item-kpi">
      <div class="cuenta-item-row">
        <span class="cuenta-nombre">${esc(c)}</span>
        <span class="cuenta-saldo ${s>0?"pos":s<0?"neg":"zer"}">${s<0?"-":""}${fmt(s)}</span>
      </div>
      ${ajHtml}
    </div>`;
  }).join("");

  // Reintegros médicos — total pendiente global (todos los años) para el badge de alerta
  const reintegrosGlobal = calcReintegrosPorJugador("");
  const pendienteGlobal  = reintegrosGlobal.reduce((s,r) => s + Math.max(r.pendiente,0), 0);

  // Adherentes — total adeudado del año actual para el badge de alerta
  const adherentesGlobal = calcAdherentesPorAnio(String(new Date().getFullYear()));
  const adherentePendienteGlobal = adherentesGlobal
    .filter(r => r.compromisoAnual > 0 && r.diferencia < 0)
    .reduce((s,r) => s + Math.abs(r.diferencia), 0);

  const subTabsHtml = `
    <div class="entity-tabs entity-tabs--wrap">
      <button class="entity-tab ${resumenSubTab==='mensual'?'active':''}"    onclick="setResumenSubTab('mensual')">Mensual</button>
      <button class="entity-tab ${resumenSubTab==='reportes'?'active':''}"   onclick="setResumenSubTab('reportes')">Reportes</button>
      <button class="entity-tab ${resumenSubTab==='partido'?'active':''}"    onclick="setResumenSubTab('partido')">Por Partido</button>
      <button class="entity-tab ${resumenSubTab==='reintegros'?'active':''}" onclick="setResumenSubTab('reintegros')">Reintegros${pendienteGlobal>0?" 🏥":""}</button>
      <button class="entity-tab ${resumenSubTab==='adherentes'?'active':''}" onclick="setResumenSubTab('adherentes')">Adherentes${adherentePendienteGlobal>0?" 👥":""}</button>
      <button class="entity-tab ${resumenSubTab==='jugadoresRes'?'active':''}" onclick="setResumenSubTab('jugadoresRes')">Jugadores</button>
      <button class="entity-tab ${resumenSubTab==='eventosRes'?'active':''}" onclick="setResumenSubTab('eventosRes')">Eventos</button>
      <button class="entity-tab ${resumenSubTab==='patrimonio'?'active':''}" onclick="setResumenSubTab('patrimonio')">Patrimonio</button>
    </div>`;

  const alertHtml = (pendienteGlobal > 0 && resumenSubTab !== "reintegros") ? `
    <div class="reintegro-alert" onclick="setResumenSubTab('reintegros')">
      🏥 ${fmt(pendienteGlobal)} pendientes de reintegro
    </div>` : "";

  const adherenteAlertHtml = (adherentePendienteGlobal > 0 && resumenSubTab !== "adherentes") ? `
    <div class="adherente-alert" onclick="setResumenSubTab('adherentes')">
      👥 ${fmt(adherentePendienteGlobal)} pendientes de adherentes
    </div>` : "";

  setContent(`
    <div class="resumen-top-row">
      ${subTabsHtml}
      <div class="resumen-alerts">${alertHtml}${adherenteAlertHtml}</div>
    </div>
    ${resumenSubTab === "mensual" ? `
    <div class="resumen-kpi-row">
      <div class="mes-sel">
        <button class="mes-sel-btn" onclick="changeMes(-1)">◀</button>
        <span class="mes-sel-label">${mesLabel(sharedMes)}</span>
        <button class="mes-sel-btn" onclick="changeMes(1)">▶</button>
      </div>

      <div class="sum-grid three">
        <div class="stat-card">
          <div class="stat-label">Ingresos mes</div>
          <div class="stat-val ing">${fmt(ingMes)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Egresos mes</div>
          <div class="stat-val egr">${fmt(egrMes)}</div>
        </div>
        <div class="stat-card">
          <div class="stat-label">Saldo mes</div>
          <div class="stat-val ${saldoMes>=0?"ing":"egr"}">${saldoMes<0?"-":""}${fmt(saldoMes)}</div>
        </div>
      </div>

      <div class="stat-card resumen-kpi-acc" style="margin-bottom:14px">
        <div class="stat-label">Saldo acumulado hasta ${mesLabel(sharedMes)}</div>
        <div class="stat-val acc" style="font-size:22px">${saldoAcc<0?"-":""}${fmt(saldoAcc)}</div>
      </div>
    </div>

    <div class="resumen-2col">
      <div>
        ${catItems.length ? `
        <div class="sec-hdr"><span class="sec-title">Tabla por categoría</span></div>
        <table class="sum-table">
          <thead><tr><th>Categoría</th><th style="text-align:right">Ing.</th><th style="text-align:right">Egr.</th><th style="text-align:right">Neto</th></tr></thead>
          <tbody>${tableRows}</tbody>
        </table>` : ""}

        ${top10Jug.length ? `
        <div class="sec-hdr">
          <span class="sec-title">Top jugadores / CT</span>
          <span class="note">${mesLabel(sharedMes)}</span>
        </div>
        <div class="sum-grid" style="margin-bottom:12px">
          <div class="stat-card">
            <div class="stat-label">Monto neto jugadores</div>
            <div class="stat-val ${totalJugMes<0?'ing':'egr'}">${totalJugMes<0?"-":""}${fmt(totalJugMes)}</div>
          </div>
          <div class="stat-card">
            <div class="stat-label">Prom. mensual / jugador</div>
            <div class="stat-val ${avgJugMes<0?'ing':'egr'}">${avgJugMes<0?"-":""}${fmt(avgJugMes)}</div>
          </div>
        </div>
        <table class="sum-table">
          <thead><tr><th>Jugador / CT</th><th style="text-align:right">Monto mes</th><th style="text-align:right">Prom. mensual</th></tr></thead>

      <div>
        <div class="sec-hdr"><span class="sec-title">Saldo por cuenta</span></div>

        <div class="sec-hdr">
          <span class="sec-title">Adherentes — ${mesLabel(sharedMes)}</span>
        </div>
        ${!pendAdh.totalCount ? `<p class="note">Sin adherentes registrados</p>` :
          !pendAdh.pendientes.length ? `
          <button class="reint-aldia-toggle" style="cursor:default">
            ${pendAdh.pagadosCount}/${pendAdh.totalCount} pagados — Todos al día ✓
          </button>` : `
          <button class="reint-aldia-toggle" onclick="toggleAdhResumenOpen()">
            ${pendAdh.pagadosCount}/${pendAdh.totalCount} pagados — ${pendAdh.pendientes.length} pendientes ${adhResumenOpen?"▲":"▼"}
          </button>
          ${adhResumenOpen ? `<div class="adh-resumen">${adhPendientesHtml}</div>` : ""}`
        }

    ${resumenSubTab === "reportes" ? renderReportesTab() : ""}
