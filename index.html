// Último número emitido, persistido en la hoja Config (clave "ultimoComprobante")
// para que la numeración sea correlativa entre el celular y la computadora.
let ultimoComprobante = 0;
let compData          = null; // datos del comprobante que se está editando
let compMovPendiente  = null; // movimiento recién guardado, todavía no listado

// Como fmt() pero conservando los centavos cuando los hay: el fmt() general
// redondea a entero, y en un comprobante el monto tiene que coincidir exacto
// con lo que se pagó. Si el monto es redondo se muestra sin decimales.
function fmtComp(n) {
  const v   = +n || 0;
  const abs = Math.abs(v);
  const conDecimales = Math.abs(abs - Math.round(abs)) > 0.004;
  const s = abs.toLocaleString("es-AR", {
    minimumFractionDigits: conDecimales ? 2 : 0,
    maximumFractionDigits: 2,
  });
  return (v < 0 ? "−$" : "$") + s;
}

function fmtFechaDMY(f) {
  if (!f || f.length < 10) return f || "";
  return f.slice(8,10) + "/" + f.slice(5,7) + "/" + f.slice(0,4);
}

// Mismo escudo (75° Aniversario) que usaba la webapp de comprobantes aparte.
// Se pasa a escala de grises una sola vez y se cachea: html2canvas no soporta
// el filtro CSS grayscale, así que hay que hornearlo en la imagen.
const COMP_ESCUDO = "./escudo.png";
let _escudoBN = null;
function escudoBN() {
  return new Promise((resolve) => {
    if (_escudoBN) { resolve(_escudoBN); return; }
    const img = new Image();
    img.onload = () => {
      try {
        const c   = document.createElement("canvas");
        c.width   = img.width;
        c.height  = img.height;
        const ctx = c.getContext("2d");
        ctx.drawImage(img, 0, 0);
        const d = ctx.getImageData(0, 0, c.width, c.height);
        for (let i = 0; i < d.data.length; i += 4) {
          const g = 0.299*d.data[i] + 0.587*d.data[i+1] + 0.114*d.data[i+2];
          d.data[i] = d.data[i+1] = d.data[i+2] = g;
        }
        ctx.putImageData(d, 0, 0);
        _escudoBN = c.toDataURL("image/png");
      } catch (e) {
        _escudoBN = COMP_ESCUDO; // canvas contaminado — se usa el original
      }
      resolve(_escudoBN);
    };
    img.onerror = () => { _escudoBN = COMP_ESCUDO; resolve(_escudoBN); };
    img.src = COMP_ESCUDO;
  });
}

/** Precarga los datos del comprobante a partir de un movimiento guardado. */
// Las filas de un mismo cobro dividido. Se reconocen por compartir todo lo que las hace un solo
// cobro —tipo, fecha, rubro, concepto, partido y evento— y diferir sólo en la cuenta. Se detectan
// así y no por un campo de vínculo porque el reparto no deja rastro en la hoja: cada fila es un
// movimiento común y corriente, y tiene que seguir siéndolo para que el saldo por cuenta cierre.
//
// Si dos de las candidatas comparten cuenta no era un reparto (serían dos movimientos idénticos),
// y se devuelve sólo el propio: ante la duda, no sumar de más.
function movsMismoCobro(mov) {
  if (!mov.concepto) return [mov];
  const mismos = movimientos.filter(m =>
    m.tipo === mov.tipo && m.fecha === mov.fecha && m.codRubro === mov.codRubro &&
    (m.concepto || "") === (mov.concepto || "") &&
    (m.partidoId || "") === (mov.partidoId || "") &&
    (m.eventoId  || "") === (mov.eventoId  || ""));
  if (!mismos.some(m => m.id === mov.id)) mismos.push(mov);   // recién guardado, todavía fuera del array
  const cuentas = new Set(mismos.map(m => m.cuenta));
  return (mismos.length > 1 && cuentas.size === mismos.length) ? mismos : [mov];
}

function movToComprobante(mov) {
  const esAdh  = (mov.rubro || "").toUpperCase().includes("ADHERENTE");
  // El comprobante va por el total del cobro: a quien lo recibe no le importa que una parte haya
  // entrado en efectivo y otra por Mercado Pago, le importa cuánto pagó.
  const montoDe = m => m.tipo === "INGRESO" ? Number(m.ingreso || 0) : Number(m.egreso || m.montoFinal || 0);
  const monto  = movsMismoCobro(mov).reduce((s, m) => s + montoDe(m), 0);
  const mesKey = mov.mes ? mov.mes.slice(0,4) + "-" + mov.mes.slice(4) : "";
  return {
    movId:    mov.id,
    tipoDoc:  esAdh ? "recibo" : "comprobante",
    numero:   (Number(ultimoComprobante) || 0) + 1,
    fecha:    fmtFechaDMY(mov.fecha),
    receptor: mov.jugadorCT || mov.adherente || mov.concepto || "",
    periodo:  mesLabel(mesKey),
    // Movimientos con desglose (ej. pago de jugador que sumó partido + premios/ajustes)
    // precargan un ítem por concepto en vez de uno solo con el total.
    items:    (mov.itemsDetalle && mov.itemsDetalle.length) ? mov.itemsDetalle.map(it => ({ desc: it.desc||"Concepto", monto: Number(it.monto||0) }))
             : [{ desc: mov.concepto || mov.rubro || "Concepto", monto }],
    // El agradecimiento solo tiene sentido en el recibo de adhesión.
    mensaje:  esAdh ? "Gracias por su colaboración." : "",
  };
}

function abrirComprobanteModal(movId) {
  const mov = movimientos.find(m => m.id === movId)
           || (compMovPendiente && compMovPendiente.id === movId ? compMovPendiente : null);
  if (!mov) { toast("No se encontró el movimiento", "err"); return; }
  compData = movToComprobante(mov);
  renderComprobanteModal();
  escudoBN().then(() => compRefreshDoc());
}

/**
 * Comprobante de un jugador armado desde lo tildado en Transferencias, sin movimiento detrás.
 *
 * La transferencia bancaria se hace antes de tocar la app, y el jugador pide el comprobante en
 * ese momento; obligar a confirmar el pago primero fuerza a registrar un egreso que todavía no
 * se controló contra el banco. Por eso los ítems se arman de las filas de Pagos Jugadores y no
 * de un movimiento: acá no se graba nada, sólo se emite el papel.
 */
function abrirComprobantePrevio(jugadorId) {
  const tr = document.querySelector(`#pj-transf-table tbody tr[data-jug="${jugadorId}"]`);
  if (!tr) return;
  const main = tr.querySelector(".pj-transf-cb");
  // Misma regla que el pago: reusa pjIdsDeSeleccion con una sola fila para que el comprobante
  // y lo que después se confirme no puedan discrepar.
  const ids = pjIdsDeSeleccion([{
    jugadorId,
    incluido:   !!(main && main.checked && !main.disabled),
    premiosIds: [...tr.querySelectorAll(".pj-premio-cb:checked")].map(cb => cb.value)
  }]);
  const filas = ids.map(id => pagosJugadores.find(p => p.id === id)).filter(Boolean);
  if (!filas.length) { toast("Tildá lo que querés incluir en el comprobante", "err"); return; }
  const total = filas.reduce((s,p) => s + Number(p.montoFinal||0), 0);
  if (total <= 0) { toast("El neto de " + (filas[0].jugadorNombre || "el jugador") + " no da un monto a pagar", "err"); return; }

  const mes = (filas.find(p => p.mes) || {}).mes || "";
  compData = {
    movId:    "",                                   // sin movimiento: es previo a confirmar
    tipoDoc:  "comprobante",
    numero:   (Number(ultimoComprobante) || 0) + 1,
    fecha:    fmtFechaDMY(today()),
    receptor: filas[0].jugadorNombre || "",
    periodo:  mes ? mesLabel(mes) : "",
    items:    filas.map(p => ({ desc: pjDescItem(p), monto: Number(p.montoFinal||0) })),
    mensaje:  "",
  };
  renderComprobanteModal();
  escudoBN().then(() => compRefreshDoc());
}

          Acordate de confirmarlo cuando corresponda.</p>`}
        <div class="fgrid">
          <div class="field">
            <label>Tipo de documento</label>
            <select class="inp" id="comp-tipo" onchange="compOnInput()">
              <option value="comprobante" ${d.tipoDoc==="comprobante"?"selected":""}>Comprobante de pago</option>
              <option value="recibo" ${d.tipoDoc==="recibo"?"selected":""}>Recibo de adhesión</option>
            </select>
          </div>
          <div style="display:flex;gap:8px">
            <div class="field" style="flex:0 0 110px">
              <label>N°</label>
              <input class="inp" id="comp-numero" type="number" step="1" value="${d.numero}" oninput="compOnInput()">
            </div>
            <div class="field" style="flex:1">
              <label>Fecha</label>
              <input class="inp" id="comp-fecha" type="text" value="${esc(d.fecha)}" oninput="compOnInput()">
            </div>
          </div>
          <div class="field">
            <label>Receptor</label>
            <input class="inp" id="comp-receptor" type="text" value="${esc(d.receptor)}" oninput="compOnInput()">
          </div>
          <div class="field">
            <label>Período</label>
            <input class="inp" id="comp-periodo" type="text" value="${esc(d.periodo)}" placeholder="Agosto 2026" oninput="compOnInput()">
          </div>
          <div class="field">
            <label>Detalle</label>
            <div id="comp-items">${d.items.map(it => compItemRowHTML(it)).join("")}</div>
            <button class="btn-secondary" style="margin-top:8px" onclick="compAgregarItem()">+ Agregar concepto</button>
          </div>
          <div class="field">
            <label>Mensaje (opcional)</label>
            <input class="inp" id="comp-mensaje" type="text" value="${esc(d.mensaje)}" oninput="compOnInput()">
          </div>

        <div class="comp-preview-label">Vista previa</div>
        <div id="comp-preview-wrap" class="comp-preview-wrap">
          <div id="comprobante-doc"></div>
        </div>

        <p class="note" id="comp-status" style="text-align:center"></p>
        <div class="modal-footer">
          <button class="btn-main" style="flex:1;background:#25d366;color:#0b3d20" id="btn-comp-share" onclick="compExportar('share')">Enviar por WhatsApp</button>
          <button class="btn-secondary" style="flex:1" id="btn-comp-png" onclick="compExportar('download')">Descargar</button>
        </div>
      </div>
    </div>`;
}

let compItemSeq = 0;
function compItemRowHTML(it) {
  const k = "ci" + (compItemSeq++);
  return `
    <div class="entity-item comp-item-row" id="compitem-${k}" style="gap:6px">
      <input class="inp comp-item-desc" type="text" placeholder="Concepto"
             value="${esc(it ? it.desc : "")}" style="flex:1;min-width:0" oninput="compOnInput()">
      <input class="inp comp-item-monto" type="number" step="0.01" placeholder="0"
             value="${it ? it.monto : ""}" style="width:110px" oninput="compOnInput()">
      <button class="btn-sm danger" onclick="compQuitarItem('${k}')" title="Quitar">✕</button>
    </div>`;
}

function compAgregarItem() {
  document.getElementById("comp-items")?.insertAdjacentHTML("beforeend", compItemRowHTML(null));
  compOnInput();
}

function compQuitarItem(k) {
  document.getElementById("compitem-" + k)?.remove();
  compOnInput();
}

/** Lee los campos del formulario a compData y repinta el documento. */
function compOnInput() {
  if (!compData) return;
  compData.tipoDoc  = document.getElementById("comp-tipo")?.value || "comprobante";
  compData.numero   = parseInt(document.getElementById("comp-numero")?.value || "0", 10) || 0;
  compData.fecha    = (document.getElementById("comp-fecha")?.value || "").trim();
  compData.receptor = (document.getElementById("comp-receptor")?.value || "").trim();
  compData.periodo  = (document.getElementById("comp-periodo")?.value || "").trim();
  compData.mensaje  = (document.getElementById("comp-mensaje")?.value || "").trim();
  compData.items    = [...document.querySelectorAll(".comp-item-row")].map(row => ({
    desc:  (row.querySelector(".comp-item-desc")?.value || "").trim(),
    monto: parseFloat(row.querySelector(".comp-item-monto")?.value || "0") || 0,
  })).filter(it => it.desc || it.monto);
  compRefreshDoc();
}

function compRefreshDoc() {
  const doc = document.getElementById("comprobante-doc");
  if (!doc || !compData) return;
  doc.innerHTML = comprobanteDocHTML(compData);
  compFitPreview();
}

// El documento se arma siempre a COMP_ANCHO px reales (así la imagen exportada
// sale igual desde el celular que desde la compu) y se escala solo para la vista previa.
function compFitPreview() {
  const wrap = document.getElementById("comp-preview-wrap");
  const doc  = document.getElementById("comprobante-doc");
  if (!wrap || !doc) return;
  doc.style.transform = "none";
  const s = Math.min(1, (wrap.clientWidth || COMP_ANCHO) / COMP_ANCHO);
  doc.style.transformOrigin = "top left";
  doc.style.transform = "scale(" + s + ")";
  wrap.style.height = Math.ceil(doc.offsetHeight * s) + "px";
}

  const esRecibo = d.tipoDoc === "recibo";
  const total    = (d.items || []).reduce((s, it) => s + Number(it.monto || 0), 0);

        <div style="display:flex;justify-content:space-between;align-items:baseline;padding:4px 0">

    <div style="display:flex;align-items:center;gap:12px;padding:14px 18px;border-bottom:2px solid #000">
      <img src="${escudo}" alt="" style="width:44px;height:56px;object-fit:contain;flex-shrink:0">
      <div style="flex:1;min-width:0">
        <div style="font-size:15px;color:#000">Club Deportivo Mitre</div>
        <div style="font-size:11px;color:#666;margin-top:1px">1951 – 2026 · 75° Aniversario</div>
        <div style="font-size:10px;letter-spacing:1px;color:#000;margin-top:3px">${esRecibo ? "RECIBO DE ADHESIÓN" : "COMPROBANTE DE PAGO"}</div>
      </div>
      <div style="text-align:right;flex-shrink:0">
        <div style="font-family:var(--mono);font-size:14px;color:#000">N° ${String(d.numero || 0).padStart(4,"0")}</div>

      </div>

      </div>
      ${d.mensaje ? `<div style="margin-top:12px;padding:8px 12px;border-left:3px solid #000;font-size:12px;color:#444;font-style:italic">${esc(d.mensaje)}</div>` : ""}

      ${esRecibo ? `<span style="font-size:11px;color:#000;border:1px solid #000;border-radius:20px;padding:2px 10px">Recibido</span>` : ""}
      <span style="font-size:10px;color:#666">Emitido el ${esc(d.fecha)}</span>

// ── Exportar: imagen JPG → compartir o descargar ──────────────
const HTML2CANVAS_URL = "https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js";
let _h2cPromise = null;

// Se carga recién cuando hace falta, para no pesar en el arranque de la app.
// El service worker la deja cacheada después del primer uso (cache-first para
// orígenes externos), así que a partir de ahí anda también sin señal.
function ensureHtml2Canvas() {
  if (window.html2canvas) return Promise.resolve(window.html2canvas);
  if (_h2cPromise) return _h2cPromise;
  _h2cPromise = new Promise((resolve, reject) => {
    const s = document.createElement("script");
    s.src = HTML2CANVAS_URL;
    s.onload  = () => resolve(window.html2canvas);
    s.onerror = () => { _h2cPromise = null; reject(new Error("No se pudo cargar el generador de imágenes (sin conexión)")); };
    document.head.appendChild(s);
  });
  return _h2cPromise;
}

function compNombreArchivo(d) {
  const recep = (d.receptor || "comprobante").replace(/[^a-zA-Z0-9]/g, "_");
  return "CDM_" + String(d.numero || 0).padStart(4,"0") + "_" + recep + ".jpg";
}

/** Renderiza el documento a un Blob JPG con fondo blanco sólido. */
async function compRenderBlob() {
  const h2c = await ensureHtml2Canvas();
  const doc = document.getElementById("comprobante-doc");
  if (!doc) throw new Error("No hay comprobante para exportar");
  // Se saca la escala de la vista previa para capturar a tamaño real.
  const prevTransform = doc.style.transform;
  doc.style.transform = "none";
  let canvas;
  try {
    canvas = await h2c(doc, {
      scale: 2, useCORS: true, allowTaint: true,
      backgroundColor: "#ffffff", logging: false, width: COMP_ANCHO,
    });
  } finally {
    doc.style.transform = prevTransform;
    compFitPreview();
  }
  // Canvas intermedio con blanco sólido: algunos Android ignoran backgroundColor.
  const flat = document.createElement("canvas");
  flat.width  = canvas.width;
  flat.height = canvas.height;
  const ctx = flat.getContext("2d");
  ctx.fillStyle = "#ffffff";
  ctx.fillRect(0, 0, flat.width, flat.height);
  ctx.drawImage(canvas, 0, 0);
  return new Promise(res => flat.toBlob(res, "image/jpeg", 0.95));
}

/** Guarda el número emitido para que el próximo comprobante siga la numeración. */
async function compConfirmarNumero(n) {
  if (!n || n <= Number(ultimoComprobante || 0)) return;
  ultimoComprobante = n;
  try { await Storage.saveConfig("ultimoComprobante", String(n)); } catch (e) { /* offline: queda local */ }
}

async function compExportar(modo) {
  const btnId  = modo === "share" ? "btn-comp-share" : "btn-comp-png";
  const btn    = document.getElementById(btnId);
  const status = document.getElementById("comp-status");
  if (!btn || btn.disabled) return;
  btn.disabled = true;
  if (status) status.textContent = "Generando imagen…";
  try {
    const blob = await compRenderBlob();
    if (!blob) throw new Error("No se pudo generar la imagen");
    const nombre = compNombreArchivo(compData);
    const file   = new File([blob], nombre, { type: "image/jpeg" });

    if (modo === "share" && navigator.share && navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: "Comprobante Club Deportivo Mitre" });
      if (status) status.textContent = "¡Compartido!";
    } else {
      const url = URL.createObjectURL(blob);
      const a   = document.createElement("a");
      a.href = url; a.download = nombre; a.click();
      URL.revokeObjectURL(url);
      if (status) status.textContent = modo === "share"
        ? "Tu navegador no permite compartir directo — la imagen se descargó, adjuntala en WhatsApp."
        : "Imagen descargada ✓";
    }
    await compConfirmarNumero(compData.numero);
  } catch (e) {
    if (e && e.name === "AbortError") { if (status) status.textContent = ""; }
    else { if (status) status.textContent = "Error: " + (e.message || "no se pudo generar la imagen"); }
  } finally {
    btn.disabled = false;
  }
}
